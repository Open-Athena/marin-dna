[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin_dna"
version = "0.0.1"
description = "Lightweight genomic primitives for MarinDNA projects"
requires-python = ">=3.13,<3.14"
dependencies = [
    "biopython>=1.85",
    "numpy",
    "polars",
    "polars-bio>=0.33.0,<0.34.0",
    "pyarrow>=21.0.0",
    "pyfaidx>=0.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna"]

[tool.mypy]
files = "src/marin_dna"
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
    ".agents/skills/run-training-sweep-cw/tests",
    ".agents/skills/run-training-sweep-trc/tests",
]
markers = [
    "slow: slow and/or network-dependent; deselected in the default CI gate",
]
