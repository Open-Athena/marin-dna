[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-dna-pipeline"
version = "0.0.1"
description = "Template for a locked MarinDNA Snakemake pipeline project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marin-dna",
    "snakemake",
    "snakemake-storage-plugin-s3>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
marin-dna = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
