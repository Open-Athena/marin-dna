version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: mypy
      - dependency-name: pre-commit
    groups:
      uv-quality-tools:
        patterns:
          - mypy
          - pre-commit

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    groups:
      dashboard:
        patterns:
          - "*"
