name: Dashboard

# Builds the marin-dna leaderboard dashboard (Observable Framework site
# under `dashboard/`) and deploys it to GitHub Pages.
#
# Runs on push to main *and* on pull requests against main, so the build
# acts as a required status check before merge — same workflow, two
# different entry points. The deploy job is gated to push-to-main only;
# PR runs build + upload the artifact but never publish.
#
# PR triggers do NOT filter by paths: the build is a required status check,
# and a required check that is gated by `paths:` will sit pending forever
# on any PR that doesn't touch the matched files (e.g. a README-only PR),
# blocking merge. The build is ~1.5 min — cheap enough to run on every PR.
# Push-to-main is still path-filtered so we don't redeploy Pages on
# unrelated commits.
#
# Setup (one-time, by a repo admin):
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. AWS S3 access for the data loaders via GitHub OIDC (no long-lived keys):
#       - In the marin-dna AWS account (836683583872):
#         * GitHub OIDC identity provider for `token.actions.githubusercontent.com`
#           with audience `sts.amazonaws.com`.
#         * IAM policy `BolinasDnaDashboardMetricsRead` granting `s3:GetObject`
#           on these prefixes (one per eval pipeline; evals_v2 is `results/*` so
#           the dashboard can also read the nuc_dep interpretation artifacts, #240).
#           The accessibility-QTL benchmark (#311/#312) is the one non-`snakemake/`
#           top-level prefix — `accessibility_qtl.parquet.py` reads only `metrics/`:
#             - `arn:aws:s3:::oa-bolinas/snakemake/analysis/evals_v2/results/*`
#             - `arn:aws:s3:::oa-bolinas/snakemake/conservation_eval/results/*`
#             - `arn:aws:s3:::oa-bolinas/snakemake/alphagenome_eval/results/metrics/*`
#             - `arn:aws:s3:::oa-bolinas/snakemake/gpn_star_eval/results/metrics/*`
#             - `arn:aws:s3:::oa-bolinas/qtl_benchmark/metrics/*`
#         * IAM role `BolinasDnaDashboardCI` trusting the OIDC provider on
#           two `sub` claims (so PR runs from this repo can also assume the
#           role and run a pre-merge build):
#             - `repo:Open-Athena/marin-dna:ref:refs/heads/main`
#             - `repo:Open-Athena/marin-dna:pull_request`
#           Fork PRs carry a different sub (`repo:<fork>:pull_request`) and
#           are denied — they can't grab AWS creds.
#       - In the repo: set the `AWS_ROLE_ARN` Actions *variable* (Settings →
#         Secrets and variables → Actions → Variables) to the role's ARN.
#       - Branch protection: Settings → Branches → require the
#         "Dashboard / build" status check to pass on PRs against main.

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - src/marin_dna/pipelines/evals/leaderboard.py
      - src/marin_dna/pipelines/evals/models.py
      - src/marin_dna/pipelines/evals/metrics.py
      - src/marin_dna/pipelines/evals/interpretation_catalog.py
      - snakemake/analysis/evals_v2/config/config.yaml  # nuc_dep loci/models the loader reads (#240)
      - .github/workflows/dashboard.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assume AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: pyproject.toml

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python deps
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install npm deps
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npx observable build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dashboard/dist

  deploy:
    needs: build
    # Only publish on pushes to main. PR runs upload the artifact (which the
    # build step does for free) but stop here without touching Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Single concurrent deploy at a time; cancel in-flight publishes so we
    # always ship the latest commit. PR builds don't share this group, so
    # they can run in parallel without interfering.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
