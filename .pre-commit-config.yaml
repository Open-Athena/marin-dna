ci:
  # https://pre-commit.ci — auto-updates hook revs and auto-fixes ruff /
  # ruff-format / etc. on PRs. ``skip`` keeps it from running hooks that
  # need the project venv (mypy via ``uv run``) or that have a
  # pre-existing parse failure on ``run:`` blocks (snakefmt — tracked
  # separately, run locally with care).
  autoupdate_schedule: monthly
  skip: [mypy, snakefmt]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # lm-evaluation-harness task configs use the framework's custom
        # ``!function`` tag — valid for it but not for PyYAML's default
        # SafeLoader. Skip them; structure is checked when lm-eval parses.
        exclude: ^src/marin_dna/pipelines/evals/lm_eval/.*\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Preserve the byte-identical Matplotlib SVGs imported from website PR #59.
        exclude: >-
          ^blog/marin-dna/static/assets/images/blog/marin-dna/.*\.svg$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/snakemake/snakefmt
    rev: v2.0.3
    hooks:
      - id: snakefmt
        files: (Snakefile|\.smk)$

  - repo: local
    hooks:
      # Runs mypy from the project's uv-managed venv so it sees real
      # transitive types. Config (target, flags) lives in pyproject.toml
      # under [tool.mypy]. `pass_filenames: false` so mypy always scans
      # the whole tree on any python change in src/marin_dna/ — partial
      # mypy runs miss cross-file issues.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/marin_dna/.*\.py$
