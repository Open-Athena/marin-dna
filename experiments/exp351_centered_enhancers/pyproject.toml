[project]
name = "exp351-centered-enhancers"
version = "0.1.0"
description = "Enhancer-centered vs tiled-control Qwen3-0.25B training (issue #351), packaged as a self-contained marin-consumer experiment (issue #328). Mirrors the marin-experiments/tiny-stories + Open-Athena/MarinFold canonical pattern: marin in BASE deps (so Iris/zephyr workers get the runtime however the job ships its env) and the local lib via a git dep (so the same pyproject resolves on remote workers)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # marin packages in BASE deps (not an extra). This is the fix for #328's
    # zephyr-worker failure: with marin in an *extra*, the zephyr-dispatched
    # tokenize worker's `uv sync` didn't install it → No module named 'zephyr'.
    # In base, the worker gets it. (Confirmed by MarinFold exp53's comment.)
    # Floored to >=0.2.20 (06-18): iris's controller freshness floor moved past
    # exp326's 06-17 pin (#356). The transformers<5 override below keeps uv in the
    # pre-06-30 window (<=0.2.31, transformers-4), and the pytorch-cpu index +
    # tpu-extra torch/torchvision routing (below) makes the tpu extra resolvable
    # there — the full recipe (#356 partial fix; this repo's marin-blocker notes).
    "marin-core>=0.2.20.dev0",
    "marin-levanter>=0.2.20.dev0",
    "marin-iris>=0.2.20.dev0",
    "marin-zephyr>=0.2.20.dev0",
    "marin-rigging>=0.2.20.dev0",
    "marin-dupekit",
    # finelog left to iris's own constraint (the 06-17 proxy pin was 0.2.19-only).
    "marin-finelog",
    "marin-finelog-server",
    # marin-levanter[lm_eval]'s extra is a URL dep; uv requires URL deps top-level.
    "lm-eval @ git+https://github.com/stanford-crfm/lm-evaluation-harness.git@d5e3391f22cde186c827674d5c3ec7c5f4fe0cab",
    # Our library code (marin_dna.levanter.* formats/defaults + the mendelian
    # lm_eval task config). Git dep (NOT a local path) so the SAME pyproject
    # resolves on remote Iris/zephyr workers — they clone + install it rather
    # than relying on the (unreliable) workspace bundle. (Matches MarinFold exp53.)
    "marin_dna @ git+https://github.com/Open-Athena/marin-dna.git@main",
    # exp53's pin: with prerelease=allow, httpx otherwise floats to 1.0.dev*,
    # whose Client() dropped the `timeout` kwarg marin-iris's GCP provider passes
    # → iris CLI crashes on submit.
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
# torch/torchvision listed here (not just routed in [tool.uv.sources]) because uv
# only applies an index source to a package that is a DIRECT dep of the extra —
# without this the tpu extra's transitive torch/torchvision==...+cpu isn't pulled
# from the pytorch-cpu index and the tpu closure backtracks to the (too-old) 0.2.19.
tpu = [
    "marin-core[tpu]; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
]

# Iris's remote worker runs `uv sync --all-packages --no-group dev`, which errors
# if the dev group doesn't exist — define an empty one. (Per tiny-stories.)
[dependency-groups]
dev = []

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
# Linux-only: we launch from the linux dev box and all Iris/zephyr workers are
# linux. Dropping darwin removes the mac branch, where the tpu extra is trivially
# unsatisfiable (no libtpu/+cpu wheels) and derails the whole resolution (#356).
environments = [
    "sys_platform == 'linux'",
]
# Mirrored from marin's pyproject — omitting these makes uv resolution fail the
# same way it does for marin itself (+ our pandas<3 pin to keep parquet dtypes).
# transformers<5: marin >=0.2.32 (06-30) declares transformers-5, which breaks
# lm-eval@d5e3391 (its hf_vlms uses AutoModelForVision2Seq, renamed in tf5). This
# override keeps uv on the transformers-4 line → picks a pre-06-30 marin where
# lm-eval works, and forces tf4 even if a later build declares tf5 (#356 layer 3).
override-dependencies = [
    "omegaconf>=2.4.0.dev4",
    "antlr4-python3-runtime==4.11",
    "python-multipart>=0.0.22",
    "wheel>=0.46.2",
    "datasets>=3.1.0,<4.0.0",
    "equinox>=0.11.10",
    "pandas>=2.0,<3.0",
    "transformers>=4.57,<5",
]

# marin depends on resiliparse>=0.17.2 which only exists on this custom index.
[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

# marin-core[tpu] >=0.2.20 pins torch/torchvision ==...+cpu local-tag wheels that
# only live on PyTorch's CPU index. Explicit so it doesn't shadow PyPI globally;
# torch/torchvision are routed here AND listed in the tpu extra above (#356).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
