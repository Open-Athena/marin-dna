[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exp473-center-seeded-projection"
version = "0.1.0"
description = "Matched CDS and enhancer-centered projection-policy training for MarinDNA issue 473"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marin-core @ git+https://github.com/marin-community/marin.git@6bb4d74694fa185cabf20d037f414235e6a12eed#subdirectory=lib/marin",
    "marin-dupekit @ git+https://github.com/marin-community/marin.git@6bb4d74694fa185cabf20d037f414235e6a12eed#subdirectory=lib/dupekit",
    "marin-iris[controller] @ git+https://github.com/marin-community/marin.git@6bb4d74694fa185cabf20d037f414235e6a12eed#subdirectory=lib/iris",
    "numpy",
]

[project.optional-dependencies]
cpu = [
    "marin-core[cpu] @ git+https://github.com/marin-community/marin.git@6bb4d74694fa185cabf20d037f414235e6a12eed#subdirectory=lib/marin",
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0+cpu; sys_platform == 'linux'",
]
tpu = [
    "marin-core[tpu] @ git+https://github.com/marin-community/marin.git@6bb4d74694fa185cabf20d037f414235e6a12eed#subdirectory=lib/marin",
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0+cpu; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[tool.uv]
package = true
fork-strategy = "fewest"
prerelease = "allow"
environments = [
    "sys_platform == 'linux'",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "tpu" },
    ],
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/exp473_center_seeded_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
