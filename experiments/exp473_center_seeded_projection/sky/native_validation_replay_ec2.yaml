# CPU-only EC2 execution for the exact native-validation replay. The logical
# Snakemake gpu=1 resource serializes score cells; the instance has no GPU.

name: exp473-native-validation-replay-ec2

resources:
    infra: aws/us-east-2
    instance_type: c7i.16xlarge
    use_spot: true
    disk_size: 100
    labels:
        project: dna

workdir: .

envs:
    EXP473_DIAGNOSTIC_COMMIT: ""
    DRY_RUN: "0"
    SNAKEMAKE_ARGS: ""

file_mounts:
    ~/.config/gcloud/application_default_credentials.json: ~/.config/gcloud/application_default_credentials.json

setup: |
    set -euxo pipefail
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    if [[ "$(uv --version)" != "uv 0.11.31" ]]; then
        uv self update 0.11.31
    fi
    if ! command -v gcloud >/dev/null 2>&1; then
        curl -fsSL https://sdk.cloud.google.com > /tmp/gcloud-install.sh
        bash /tmp/gcloud-install.sh --disable-prompts --install-dir="$HOME"
    fi
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
    uv sync --project snakemake/analysis/evals_v2 --locked --group genome-s3
    gcloud storage ls gs://marin-us-east1/MarinDNA/exp473_center_seeded_projection/checkpoints/ | head -3 >/dev/null
    aws sts get-caller-identity >/dev/null

run: |
    set -euxo pipefail
    test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
    test -n "$EXP473_DIAGNOSTIC_COMMIT"
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
    export CUDA_VISIBLE_DEVICES=""
    export OMP_NUM_THREADS=64
    export MKL_NUM_THREADS=64
    export TOKENIZERS_PARALLELISM=false
    export WANDB_DISABLED=true
    REPO_ROOT="$PWD"
    export PYTHONPATH="$REPO_ROOT/experiments/exp473_center_seeded_projection/src"
    CONFIG_PATH=/tmp/issue_473_native_validation_replay.yaml
    uv run --project snakemake/analysis/evals_v2 --locked --group genome-s3 \
        python -m exp473_center_seeded_projection.native_validation_replay_config \
        --output "$CONFIG_PATH" --diagnostic-commit "$EXP473_DIAGNOSTIC_COMMIT"

    SNAKEMAKE_MODE=()
    if [ "$DRY_RUN" = "1" ]; then
        SNAKEMAKE_MODE+=(--dry-run)
    fi
    ALLOWED_RULES=(
        issue_473_native_validation_download_source
        issue_473_native_validation_download_model
        issue_473_native_validation_score
        issue_473_native_validation_analyze
        issue_473_native_validation_replay
    )

    cd snakemake/analysis/evals_v2
    uv run --locked --group genome-s3 snakemake \
        issue_473_native_validation_replay \
        "${SNAKEMAKE_MODE[@]}" \
        --snakefile "$REPO_ROOT/experiments/exp473_center_seeded_projection/workflow/NativeValidationReplay.smk" \
        --profile workflow/profiles/default \
        --configfile "$CONFIG_PATH" \
        --cores 64 \
        --resources gpu=1 mem_mb=120000 \
        --allowed-rules "${ALLOWED_RULES[@]}" \
        --printshellcmds \
        --rerun-incomplete \
        $SNAKEMAKE_ARGS
