# Additive terminal VEP comparison for the issue #473 random-validation control.

name: exp473-random-validation-vep

resources:
    infra: aws/us-east-2
    image_id: ami-0324f0ad73bdcd087
    accelerators: A10G:1
    disk_size: 180
    labels:
        project: dna
    any_of:
      - use_spot: true
      - use_spot: false

workdir: .

envs:
    EXP473_VEP_COMMIT: ""
    SNAKEMAKE_ARGS: ""
    DRY_RUN: "0"

file_mounts:
    ~/.config/gcloud/application_default_credentials.json: ~/.config/gcloud/application_default_credentials.json

setup: |
    set -euxo pipefail
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    if [[ "$(uv --version)" != "uv 0.11.31" ]]; then
        uv self update 0.11.31
    fi
    if ! command -v gcloud >/dev/null 2>&1; then
        curl -fsSL https://sdk.cloud.google.com > /tmp/gcloud-install.sh
        bash /tmp/gcloud-install.sh --disable-prompts --install-dir="$HOME"
    fi
    grep -q 'google-cloud-sdk/bin' "$HOME/.bashrc" || \
        echo 'export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
    uv sync --project snakemake/analysis/evals_v2 --locked --group genome-s3
    uv run --project snakemake/analysis/evals_v2 --locked --group genome-s3 \
        evals-gpu-runtime-check \
        --config snakemake/analysis/evals_v2/config/gpu_runtime_validation.yaml \
        smoke
    gcloud storage ls gs://marin-us-east5/MarinDNA/exp473_center_seeded_projection/checkpoints/ \
        | head -3 >/dev/null
    aws s3 ls s3://oa-bolinas/snakemake/analysis/evals_v2/results/issue473/ \
        | head -3 >/dev/null

run: |
    set -euxo pipefail
    test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
    test -n "$EXP473_VEP_COMMIT"
    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
    export WANDB_DISABLED=true
    export PYTHONPATH="$PWD/experiments/exp473_center_seeded_projection/src"
    uv run --project snakemake/analysis/evals_v2 --locked --group genome-s3 \
        python -m exp473_center_seeded_projection.random_validation_vep_config \
        --output /tmp/issue_473_random_validation_vep.yaml \
        --snapshot-commit "$EXP473_VEP_COMMIT"
    SNAKEMAKE_MODE=()
    if [ "$DRY_RUN" = "1" ]; then
        SNAKEMAKE_MODE+=(--dry-run)
    fi
    if [ -z "$SNAKEMAKE_ARGS" ]; then
        SNAKEMAKE_ARGS=issue_473_random_validation_vep_all
    fi
    ALLOWED_RULES=(
        issue_473_random_validation_vep_download_model
        issue_473_random_validation_vep_score
        issue_473_random_validation_vep_metrics
        issue_473_random_validation_vep_analyze
        issue_473_random_validation_vep_all
    )
    REPO_ROOT="$PWD"
    cd snakemake/analysis/evals_v2
    uv run --locked --group genome-s3 snakemake \
        "${SNAKEMAKE_MODE[@]}" \
        --snakefile "$REPO_ROOT/experiments/exp473_center_seeded_projection/workflow/RandomValidationVep.smk" \
        --profile workflow/profiles/default \
        --configfile /tmp/issue_473_random_validation_vep.yaml \
        --cores 4 \
        --resources gpu=1 mem_mb=12000 \
        --allowed-rules "${ALLOWED_RULES[@]}" \
        --printshellcmds \
        --rerun-incomplete \
        $SNAKEMAKE_ARGS
