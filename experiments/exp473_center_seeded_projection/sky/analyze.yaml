# Bounded-memory CPU analysis for issue #473 after all official score cells pass.

name: exp473-analyze

resources:
    infra: aws/us-east-2
    # Validated issue-462 runtime; unlike Sky's default CPU image, it includes
    # the AWS CLI used to publish the final analysis bundle.
    image_id: ami-0324f0ad73bdcd087
    cpus: 8+
    memory: 32+
    disk_size: 150
    labels:
        project: dna
    use_spot: false

workdir: .

envs:
    EVAL_RESULTS_ROOT: s3://oa-bolinas/snakemake/analysis/evals_v2/results/issue473
    OUTPUT_S3_ROOT: s3://oa-bolinas/snakemake/analysis/evals_v2/results/issue473
    EXP473_EXPERIMENT_COMMIT: ""
    EXP473_ANALYSIS_COMMIT: ""

setup: |
    set -euxo pipefail
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    uv self update 0.11.31
    uv sync --project snakemake/analysis/evals_v2 --locked --group genome-s3
    uv sync --project experiments/exp473_center_seeded_projection --locked --group dev
    aws sts get-caller-identity >/dev/null

run: |
    set -euxo pipefail
    test -n "$EXP473_EXPERIMENT_COMMIT"
    test -n "$EXP473_ANALYSIS_COMMIT"
    uv run --project experiments/exp473_center_seeded_projection --locked \
        pytest \
        --rootdir=experiments/exp473_center_seeded_projection \
        experiments/exp473_center_seeded_projection/tests
    OUTPUT_DIR="/tmp/issue_473_analysis"
    export PYTHONPATH="$PWD/experiments/exp473_center_seeded_projection/src"
    uv run --project snakemake/analysis/evals_v2 --locked --group genome-s3 \
        python -m exp473_center_seeded_projection.analyze_evals \
        --results-root "${EVAL_RESULTS_ROOT%/}/$EXP473_EXPERIMENT_COMMIT/development_eval" \
        --output-dir "$OUTPUT_DIR" \
        --n-bootstrap 1000 \
        --seed 473 \
        --experiment-commit "$EXP473_EXPERIMENT_COMMIT" \
        --analysis-commit "$EXP473_ANALYSIS_COMMIT"
    ANALYSIS_ROOT="${OUTPUT_S3_ROOT%/}/$EXP473_EXPERIMENT_COMMIT/analysis/$EXP473_ANALYSIS_COMMIT"
    aws s3 sync "$OUTPUT_DIR" "$ANALYSIS_ROOT/" \
        --only-show-errors
    aws s3 ls "$ANALYSIS_ROOT/manifest.json"
