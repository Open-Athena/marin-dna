# Registered issue #515 matrix; runner.py consumes the equivalent pinned constants.
source_checkpoint: gs://marin-us-east5/checkpoints/dna-exp232-zoonomia-v1-0p25b-v4_tss_region_and_utr5-v0.1-rerun-d08452/hf/step-2000
dataset:
  name: marin-dna/zoonomia-v1-v4_tss_region_and_utr5
  revision: 80b44bf6129d6ec7988f8cf1b706e4b1464ec9dc
  sequence_column: sequence
  species_column: species
  context_tokens: 256
  reverse_complement_augmentation: false
  filter_all_lowercase: true
evaluation:
  name: marin-dna/evals_mendelian_traits
  revision: 4aed58e50c5dea0b878a665007af2ef9e5108e9f
  split: train
  subset: tss_proximal
  window_bases: 255
  lm_validation: false
model:
  wrapper: glm_experiments.models.components.lm.HFCLM
  selector_mode: uniform
  selector_ratio: 1.0
  selector_seed: 1515
optimizer:
  name: AdamW
  peak_learning_rate: 0.001
  end_learning_rate: 0.0001
  betas: [0.9, 0.98]
  epsilon: 1.0e-9
  weight_decay: 0.1
  gradient_clip_norm: 1.0
schedule:
  bridge_steps: 100
  maximum_continuation_steps: 1000
batch:
  effective_sequences: 2048
  initial_microbatch_sequences: 256
arms:
  uniform-100: {selector_mode: uniform, selector_ratio: 1.0}
  random-50: {selector_mode: random, selector_ratio: 0.5}
  student-low-50: {selector_mode: student_low, selector_ratio: 0.5}
  student-middle-50: {selector_mode: student_middle, selector_ratio: 0.5}
  student-high-50: {selector_mode: student_high, selector_ratio: 0.5}
refseq_screen:
  dataset:
    name: marin-dna/genomes-v5-genome_set-animals-intervals-v1_255_128
    revision: d93209847b02a0c9be5c03591a0a5e56ee09c35d
    sequence_column: seq
    species_column: null
    filter_all_lowercase: true
  schedule:
    warmup_steps: 100
    peak_and_constant_learning_rate: 0.001
  midpoint_continuation_steps: 250
  endpoint_continuation_steps: 500
  midpoint_gate:
    test: paired_match_group_permutation
    alternative: candidate_is_worse_than_bridge
    permutations: 20000
    correction: holm
    familywise_alpha: 0.05
    decision: drop_only_if_significantly_worse

cds_gate:
  student_checkpoint: gs://marin-dna-us-central1/checkpoints/exp58-animals-r01-1e3682/hf/step-1000
  teacher_checkpoint: gs://marin-dna-us-central1/checkpoints/exp58-animals-r01-1e3682/hf/step-16999
  dataset:
    name: marin-dna/genomes-v4-genome_set-animals-intervals-v5_256_128
    revision: 04d374450a0f78f0ab5e17a8bc7b7c4baeb8295c
    sequence_column: seq
    window_bases: 256
    bos_token: null
    filter_all_lowercase: true
  schedule:
    warmup_steps: 100
    arm_steps: 100
    peak_and_constant_learning_rate: 0.001
  evaluation:
    split: train
    subsets: [missense_variant, splicing]
    primary: pooled_auprc
    rows: 8990
    positives: 899
  additional_arms:
    teacher-kl-full: {objective: pure_teacher_kl, temperature: 1.0}
    teacher-low-50: {objective: hard_ce, selector: frozen_teacher_low, ratio: 0.5}
  stop: discuss_after_all_seven_arms_reach_100_steps

budget:
  provider: Lambda Cloud
  accelerator: A100:1
  hourly_rate_usd: 1.99
  gpu_compute_stop_usd: 48
  all_in_cap_usd: 50
logging:
  authoritative: csv
  wandb: optional_best_effort
