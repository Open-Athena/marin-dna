# CPU analysis for the issue #429 chr21 consequence extraction.

name: dna-exp429-variant-consequence-analysis

resources:
    infra: aws/us-east-2
    instance_type: m6i.2xlarge
    disk_size: 100
    autostop:
        idle_minutes: 30
        down: true

file_mounts:
    /home/ubuntu/exp429-inputs/extraction: ../../scratch/issue429/retrieval/extraction
    /home/ubuntu/exp429-inputs/panel: ../../scratch/issue429/retrieval/panel
    /home/ubuntu/exp429-inputs/reference: ../../scratch/issue418/reference

envs:
    ANALYSIS_COMMIT: ""
    PROBE_JOBS: "8"

setup: |
    set -euxo pipefail

    REPO_DIR="$HOME/exp429-repo"
    if [ ! -d "$REPO_DIR/.git" ]; then
        git clone --filter=blob:none https://github.com/Open-Athena/marin-dna.git "$REPO_DIR"
    fi
    git -C "$REPO_DIR" fetch origin codex/issue-429-variant-feature-map
    git -C "$REPO_DIR" checkout --force --detach "$ANALYSIS_COMMIT"
    test "$(git -C "$REPO_DIR" rev-parse HEAD)" = "$ANALYSIS_COMMIT"
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    cd "$REPO_DIR/experiments/exp429_variant_feature_map"
    uv sync --frozen --no-dev

run: |
    set -euxo pipefail

    export PATH="$HOME/.local/bin:$PATH"
    export ANALYSIS_COMMIT PROBE_JOBS
    export POLARS_MAX_THREADS=8 RAYON_NUM_THREADS=8
    export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
    cd "$HOME/exp429-repo/experiments/exp429_variant_feature_map"
    /usr/bin/time -v uv run --no-dev python analyze.py \
        --extraction-dir /home/ubuntu/exp429-inputs/extraction \
        --panel /home/ubuntu/exp429-inputs/panel/panel.parquet \
        --fasta /home/ubuntu/exp429-inputs/reference/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz \
        --output-dir "$HOME/exp429-artifacts/analysis" \
        --probe-jobs "$PROBE_JOBS"
