# Candidate-only spatial SAE extraction for issue #429.

name: dna-exp429-spatial

resources:
    infra: aws/us-east-2
    instance_type: g5.2xlarge
    disk_size: 150
    autostop:
        idle_minutes: 30
        down: true

file_mounts:
    /home/ubuntu/exp429-inputs/panel: ../../scratch/issue429/retrieval/panel
    /home/ubuntu/exp429-inputs/sae: ../../scratch/issue418/dna-exp418-micro-seed288-e816ec343c30/sae
    /home/ubuntu/exp429-inputs/reference: ../../scratch/issue418/reference
    /home/ubuntu/exp429-inputs/analysis: ../../scratch/issue429/retrieval/analysis

envs:
    RUN_ID: dna-exp429-cds-splice-spatial-seed288
    SPATIAL_COMMIT: ""

setup: |
    set -euxo pipefail

    REPO_DIR="$HOME/exp429-repo"
    if [ ! -d "$REPO_DIR/.git" ]; then
        git clone --filter=blob:none https://github.com/Open-Athena/marin-dna.git "$REPO_DIR"
    fi
    git -C "$REPO_DIR" fetch origin codex/issue-429-variant-feature-map
    git -C "$REPO_DIR" checkout --force --detach "$SPATIAL_COMMIT"
    test "$(git -C "$REPO_DIR" rev-parse HEAD)" = "$SPATIAL_COMMIT"
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    cd "$REPO_DIR/experiments/exp429_variant_feature_map"
    uv sync --frozen --no-dev
    uv run --no-dev python -c \
        'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
    set -euxo pipefail

    export PATH="$HOME/.local/bin:$PATH"
    export SPATIAL_COMMIT RUN_ID HF_HUB_DOWNLOAD_TIMEOUT=120 UV_LOCK_TIMEOUT=7200
    cd "$HOME/exp429-repo/experiments/exp429_variant_feature_map"
    /usr/bin/time -v uv run --no-dev python spatial.py \
        --panel /home/ubuntu/exp429-inputs/panel/panel.parquet \
        --panel-manifest /home/ubuntu/exp429-inputs/panel/panel.manifest.json \
        --fasta /home/ubuntu/exp429-inputs/reference/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz \
        --sae /home/ubuntu/exp429-inputs/sae \
        --analysis-dir /home/ubuntu/exp429-inputs/analysis \
        --output-dir "$HOME/exp429-artifacts/spatial-r2" \
        --batch-size 32 \
        --block-index 9 \
        --radius 15
