[project]
name = "exp421-422-statistical-revisits"
version = "0.1.0"
description = "CPU environment for complete-family AlphaGenome and consequence scans"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "polars>=1.0,<2",
    "pyarrow>=18",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12.11",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false
