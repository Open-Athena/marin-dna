[project]
name = "exp424-paired-variant-rc-protocol"
version = "0.1.0"
description = "Paired ref/alt and reverse-complement protocol for issue 424"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=18",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
