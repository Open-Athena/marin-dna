# Direct Lambda H100 task for the remaining issue #420 all-feature extraction
# and label-stratified consequence analysis. No AWS credential is sent.

name: dna-exp420-mendelian-subsets

resources:
    infra: lambda/us-west-3
    instance_type: gpu_1x_h100_pcie
    disk_size: 150
    autostop:
        idle_minutes: 30
        down: true

workdir: .

file_mounts:
    /home/ubuntu/exp420_inputs/panel: ../../scratch/issue420/input
    /home/ubuntu/exp420_inputs/sae: ../../scratch/issue418/dna-exp418-micro-seed288-e816ec343c30/sae
    /home/ubuntu/exp420_inputs/reference: ../../scratch/issue418/reference

envs:
    RUN_ID: dna-exp420-mendelian-subsets-seed288
    EXPERIMENT_COMMIT: ""

setup: |
    set -euxo pipefail

    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --frozen --no-dev
    uv run --no-dev python -c \
        'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
    set -euxo pipefail

    export PATH="$HOME/.local/bin:$PATH"
    export HF_HUB_DOWNLOAD_TIMEOUT=120
    export TOKENIZERS_PARALLELISM=false
    export OMP_NUM_THREADS=1
    export MKL_NUM_THREADS=1
    export OPENBLAS_NUM_THREADS=1
    export NUMEXPR_NUM_THREADS=1
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    EXTRACTION_DIR="artifacts/$RUN_ID/extraction"
    ANALYSIS_DIR="artifacts/$RUN_ID/subset-analysis"

    uv run --no-dev python extract_all_features.py \
        --panel /home/ubuntu/exp420_inputs/panel/panel.parquet \
        --panel-manifest /home/ubuntu/exp420_inputs/panel/panel.manifest.json \
        --fasta /home/ubuntu/exp420_inputs/reference/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz \
        --sae /home/ubuntu/exp420_inputs/sae \
        --output-dir "$EXTRACTION_DIR" \
        --batch-size 32 \
        --num-workers 4 \
        --torch-compile

    uv run --no-dev python subset_analysis.py \
        --panel /home/ubuntu/exp420_inputs/panel/panel.parquet \
        --extraction-dir "$EXTRACTION_DIR" \
        --output-dir "$ANALYSIS_DIR"
