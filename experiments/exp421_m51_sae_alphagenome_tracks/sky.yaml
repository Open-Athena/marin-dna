name: dna-exp421-alphagenome-tracks

resources:
  cloud: aws
  region: us-east-2
  instance_type: c7i.8xlarge
  disk_size: 80

workdir: .

file_mounts:
  /home/ubuntu/exp421_inputs/panel: ../../scratch/issue420/input
  /home/ubuntu/exp421_inputs/extraction: ../../scratch/issue420/retrieval/dna-exp420-mendelian-subsets-seed288/extraction
  /home/ubuntu/exp421_inputs/track_metadata: ../../scratch/issue421/track_metadata

run: |
  set -euo pipefail
  if [[ ! -x /tmp/exp421-cpu/bin/python ]]; then
    uv venv --python 3.12 /tmp/exp421-cpu
    uv pip install --python /tmp/exp421-cpu/bin/python \
      matplotlib numpy pandas polars pyarrow scipy
  fi
  rm -rf /tmp/dna-exp421-alphagenome-tracks
  /tmp/exp421-cpu/bin/python association.py \
    --panel /home/ubuntu/exp421_inputs/panel/panel.parquet \
    --extraction-dir /home/ubuntu/exp421_inputs/extraction \
    --alphagenome-uri s3://oa-bolinas/snakemake/alphagenome_eval/results/per_track_l2/mendelian_traits.parquet \
    --track-metadata /home/ubuntu/exp421_inputs/track_metadata/track_metadata.parquet \
    --track-metadata-manifest /home/ubuntu/exp421_inputs/track_metadata/manifest.json \
    --output-dir /tmp/dna-exp421-alphagenome-tracks \
    --extraction-commit "${EXTRACTION_COMMIT:?set EXTRACTION_COMMIT}" \
    --analysis-commit "${ANALYSIS_COMMIT:?set ANALYSIS_COMMIT}"
