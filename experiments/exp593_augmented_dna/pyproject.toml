[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exp593-augmented-dna"
version = "0.1.0"
description = "Deterministic DNA presentation augmentation and CPU preparation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "tokenizers>=0.22", "huggingface-hub>=0.36", "pyarrow>=21"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.2"]

[project.scripts]
exp593-prep = "exp593_dna.audit:main"

[tool.uv]
required-version = ">=0.13.5,<0.14"

[tool.hatch.build.targets.wheel]
packages = ["src/exp593_dna"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["exp593_dna"]
