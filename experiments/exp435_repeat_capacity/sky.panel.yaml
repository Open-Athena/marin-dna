name: dna-exp435-repeat-reference-panel

resources:
  infra: aws/us-east-2
  cpus: 16+
  memory: 32+
  disk_size: 100
  use_spot: false
  labels:
    project: dna

workdir: .

envs:
  EXPERIMENT_COMMIT: ""
  RUN_ID: dna-exp435-repeat-reference-panel-r1

setup: |
  set -euxo pipefail
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if ! command -v aws >/dev/null 2>&1; then
    uv tool install awscli
  fi
  aws sts get-caller-identity
  uv sync --project experiments/exp435_repeat_capacity --frozen

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export POLARS_MAX_THREADS=12
  export RAYON_NUM_THREADS=12
  export OMP_NUM_THREADS=4
  export MKL_NUM_THREADS=4
  export OPENBLAS_NUM_THREADS=4
  export NUMEXPR_NUM_THREADS=4

  test "${#EXPERIMENT_COMMIT}" -eq 40
  test "$RUN_ID" = "dna-exp435-repeat-reference-panel-r1"
  EXPERIMENT_DIR="experiments/exp435_repeat_capacity"
  INPUT_ROOT="$HOME/exp435-repeat-inputs"
  RUN_ROOT="$HOME/exp435-repeat-runs/$RUN_ID"
  S3_ROOT="s3://oa-bolinas/experiments/exp435/retrieval/$RUN_ID"
  INVENTORY_S3="s3://oa-bolinas/experiments/exp435/retrieval/dna-exp435-repeat-inventory-r1"
  REFERENCE_S3="s3://oa-bolinas/data/genomes/homo_sapiens/GRCh38/ensembl-release-115"
  REFERENCE_NAME="Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz"
  test ! -e "$RUN_ROOT"
  mkdir -p "$INPUT_ROOT/inventory" "$INPUT_ROOT/reference" "$RUN_ROOT/inputs"

  uv run --project "$EXPERIMENT_DIR" python -m pytest -q "$EXPERIMENT_DIR/tests"
  aws s3 cp "$INVENTORY_S3/archive_manifest.json" "$INPUT_ROOT/inventory/archive_manifest.json"
  aws s3 cp "$INVENTORY_S3/inventory/manifest.json" "$INPUT_ROOT/inventory/manifest.json"
  aws s3 cp "$INVENTORY_S3/inventory/annotations.parquet" "$INPUT_ROOT/inventory/annotations.parquet"
  aws s3 cp "$INVENTORY_S3/inventory/category_inventory.parquet" "$INPUT_ROOT/inventory/category_inventory.parquet"
  aws s3 cp "$INVENTORY_S3/inventory/chrom_inventory.parquet" "$INPUT_ROOT/inventory/chrom_inventory.parquet"
  aws s3 cp "$INVENTORY_S3/inventory/results.json" "$INPUT_ROOT/inventory/results.json"
  aws s3 cp "$REFERENCE_S3/$REFERENCE_NAME" "$INPUT_ROOT/reference/$REFERENCE_NAME"
  aws s3 cp "$REFERENCE_S3/$REFERENCE_NAME.fai" "$INPUT_ROOT/reference/$REFERENCE_NAME.fai"
  aws s3 cp "$REFERENCE_S3/$REFERENCE_NAME.gzi" "$INPUT_ROOT/reference/$REFERENCE_NAME.gzi"
  cp "$INPUT_ROOT/inventory/archive_manifest.json" "$RUN_ROOT/inputs/inventory_archive_manifest.json"
  cp "$INPUT_ROOT/inventory/manifest.json" "$RUN_ROOT/inputs/inventory_manifest.json"

  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/prepare_reference_panel.py" \
    --inventory-dir "$INPUT_ROOT/inventory" \
    --fasta "$INPUT_ROOT/reference/$REFERENCE_NAME" \
    --output-dir "$RUN_ROOT/panel"

  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/archive_posthoc.py" \
    --root "$RUN_ROOT" \
    --run-id "$RUN_ID" \
    --analysis-status outcome_blind_reference_panel
  aws s3 sync "$RUN_ROOT/" "$S3_ROOT/" --only-show-errors
  DRYRUN_LOG="/tmp/exp435-repeat-reference-panel-r1-s3-dryrun.txt"
  aws s3 sync "$RUN_ROOT/" "$S3_ROOT/" --dryrun > "$DRYRUN_LOG"
  test ! -s "$DRYRUN_LOG"
  aws s3 ls "$S3_ROOT/" --recursive

