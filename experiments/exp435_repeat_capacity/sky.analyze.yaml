name: dna-exp435-repeat-reference-associations

resources:
  infra: aws/us-east-2
  cpus: 16+
  memory: 32+
  disk_size: 100
  use_spot: false
  labels:
    project: dna

workdir: .

envs:
  EXPERIMENT_COMMIT: ""
  EXTRACTION_ARCHIVE_SHA256: ""
  RUN_ID: dna-exp435-repeat-reference-associations-r1

setup: |
  set -euxo pipefail
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if ! command -v aws >/dev/null 2>&1; then
    uv tool install awscli
  fi
  aws sts get-caller-identity
  uv sync --project experiments/exp435_repeat_capacity --frozen

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export POLARS_MAX_THREADS=12
  export RAYON_NUM_THREADS=12
  export OMP_NUM_THREADS=4
  export MKL_NUM_THREADS=4
  export OPENBLAS_NUM_THREADS=4
  export NUMEXPR_NUM_THREADS=4

  test "${#EXPERIMENT_COMMIT}" -eq 40
  test "${#EXTRACTION_ARCHIVE_SHA256}" -eq 64
  test "$RUN_ID" = "dna-exp435-repeat-reference-associations-r1"
  EXPERIMENT_DIR="experiments/exp435_repeat_capacity"
  INPUT_ROOT="$HOME/exp435-repeat-analysis-inputs"
  RUN_ROOT="$HOME/exp435-repeat-runs/$RUN_ID"
  EXTRACTION_S3="s3://oa-bolinas/experiments/exp435/retrieval/dna-exp435-repeat-reference-activations-r1"
  S3_ROOT="s3://oa-bolinas/experiments/exp435/retrieval/$RUN_ID"
  test ! -e "$RUN_ROOT"
  mkdir -p "$INPUT_ROOT/extraction" "$RUN_ROOT"

  uv run --project "$EXPERIMENT_DIR" python -m pytest -q "$EXPERIMENT_DIR/tests"
  aws s3 sync "$EXTRACTION_S3/" "$INPUT_ROOT/extraction/" --only-show-errors
  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/analyze_reference_capacity.py" \
    --extraction-archive "$INPUT_ROOT/extraction" \
    --output-dir "$RUN_ROOT/associations" \
    --expected-archive-sha256 "$EXTRACTION_ARCHIVE_SHA256"

  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/archive_posthoc.py" \
    --root "$RUN_ROOT" \
    --run-id "$RUN_ID" \
    --analysis-status frozen_reference_repeat_capacity_associations
  aws s3 sync "$RUN_ROOT/" "$S3_ROOT/" --only-show-errors
  DRYRUN_LOG="/tmp/exp435-repeat-reference-associations-r1-s3-dryrun.txt"
  aws s3 sync "$RUN_ROOT/" "$S3_ROOT/" --dryrun > "$DRYRUN_LOG"
  test ! -s "$DRYRUN_LOG"
  aws s3 ls "$S3_ROOT/" --recursive
