# One direct Lambda H100 for joint layer extraction and the small CPU analysis.

name: dna-exp434-dsqtl-direction-pilot

resources:
  infra: lambda/us-west-3
  instance_type: gpu_1x_h100_pcie
  disk_size: 100
  autostop:
    idle_minutes: 60
    down: true

workdir: .

envs:
  EXPERIMENT_COMMIT: ""
  EXTRACTION_RUN_ID: dna-exp434-dsqtl-direction-pilot-extraction-r1
  ASSOCIATION_RUN_ID: dna-exp434-dsqtl-direction-pilot-associations-r1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""

setup: |
  set -euxo pipefail
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if ! command -v aws >/dev/null 2>&1; then
    uv tool install awscli
  fi
  aws sts get-caller-identity
  uv sync --project experiments/exp434_m51_sae_accessibility_qtl --frozen
  uv run --project experiments/exp434_m51_sae_accessibility_qtl --no-dev python -c \
    'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export HF_HUB_DOWNLOAD_TIMEOUT=120
  export TOKENIZERS_PARALLELISM=true
  export POLARS_MAX_THREADS=6
  export RAYON_NUM_THREADS=6
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export WANDB_DISABLED=true
  export EXPERIMENT_COMMIT

  test "${#EXPERIMENT_COMMIT}" -eq 40
  test "$EXTRACTION_RUN_ID" = "dna-exp434-dsqtl-direction-pilot-extraction-r1"
  test "$ASSOCIATION_RUN_ID" = "dna-exp434-dsqtl-direction-pilot-associations-r1"
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  EXPERIMENT_DIR="experiments/exp434_m51_sae_accessibility_qtl"
  INPUT_ROOT="$HOME/exp434-direction-pilot-inputs"
  PANEL_ROOT="$INPUT_ROOT/panel"
  MODELS_ROOT="$INPUT_ROOT/models"
  RUN_ROOT="$HOME/exp434-runs"
  EXTRACTION_ROOT="$RUN_ROOT/$EXTRACTION_RUN_ID"
  ASSOCIATION_ROOT="$RUN_ROOT/$ASSOCIATION_RUN_ID"
  PANEL_S3="s3://oa-bolinas/experiments/exp434/inputs/dna-exp434-dsqtl-positive-panel-r1"
  EXTRACTION_S3="s3://oa-bolinas/experiments/exp434/retrieval/$EXTRACTION_RUN_ID"
  ASSOCIATION_S3="s3://oa-bolinas/experiments/exp434/retrieval/$ASSOCIATION_RUN_ID"
  test ! -e "$EXTRACTION_ROOT"
  test ! -e "$ASSOCIATION_ROOT"
  mkdir -p "$PANEL_ROOT" "$MODELS_ROOT/block01-25m" \
    "$MODELS_ROOT/block10-25m" "$MODELS_ROOT/block19-25m" "$RUN_ROOT"

  uv run --project "$EXPERIMENT_DIR" python -m pytest -q "$EXPERIMENT_DIR/tests"
  aws s3 sync "$PANEL_S3/" "$PANEL_ROOT/" --only-show-errors
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp436/retrieval/dna-exp436-block01-seed288-r1/models/block01-25m/ \
    "$MODELS_ROOT/block01-25m/"
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp426/retrieval/dna-exp426-layer-budget-seed288-r5/models/block10-25m/ \
    "$MODELS_ROOT/block10-25m/"
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp426/retrieval/dna-exp426-layer-budget-seed288-r5/models/block19-25m/ \
    "$MODELS_ROOT/block19-25m/"

  export RUN_ID="$EXTRACTION_RUN_ID"
  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/extract_focal.py" \
    --panel "$PANEL_ROOT/panel.parquet" \
    --panel-manifest "$PANEL_ROOT/manifest.json" \
    --models-root "$MODELS_ROOT" \
    --output-dir "$EXTRACTION_ROOT" \
    --batch-size 128
  aws s3 sync "$EXTRACTION_ROOT/" "$EXTRACTION_S3/" \
    --exclude manifest.json --only-show-errors
  aws s3 cp "$EXTRACTION_ROOT/manifest.json" "$EXTRACTION_S3/manifest.json"

  export RUN_ID="$ASSOCIATION_RUN_ID"
  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/analyze_direction_pilot.py" \
    --panel "$PANEL_ROOT/panel.parquet" \
    --panel-manifest "$PANEL_ROOT/manifest.json" \
    --extraction-root "$EXTRACTION_ROOT" \
    --output-dir "$ASSOCIATION_ROOT"
  aws s3 sync "$ASSOCIATION_ROOT/" "$ASSOCIATION_S3/" \
    --exclude manifest.json --only-show-errors
  aws s3 cp "$ASSOCIATION_ROOT/manifest.json" "$ASSOCIATION_S3/manifest.json"

  for SPEC in "$EXTRACTION_ROOT|$EXTRACTION_S3|extraction" \
              "$ASSOCIATION_ROOT|$ASSOCIATION_S3|association"; do
    LOCAL_ROOT="${SPEC%%|*}"
    REST="${SPEC#*|}"
    REMOTE_ROOT="${REST%%|*}"
    LABEL="${REST##*|}"
    DRYRUN_LOG="/tmp/exp434-dsqtl-direction-$LABEL-s3-dryrun.txt"
    aws s3 sync "$LOCAL_ROOT/" "$REMOTE_ROOT/" --dryrun > "$DRYRUN_LOG"
    test ! -s "$DRYRUN_LOG"
  done
