[project]
name = "exp418-m51-block10-sae"
version = "0.1.0"
description = "Decision-gate BatchTopK SAE run for MarinDNA m5.1 block 10"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Iris must be a base dependency: remote workers install base deps only.
    "marin-iris",
    "marin_dna @ git+https://github.com/Open-Athena/marin-dna.git@c4c1c86bbfc0bd58ff76dda3bac1d2acea856a33",
    "sae-lens @ git+https://github.com/decoderesearch/SAELens.git@8be14080485952f729ed58d674bcddf9778e0aa4",
    "datasets>=3.1,<4",
    "fsspec",
    "huggingface-hub",
    "s3fs>=2024",
    "torch",
    "transformers>=4.57,<5",
    "wandb",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12.11",
]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "omegaconf>=2.4.0.dev4",
    "antlr4-python3-runtime==4.11",
    "python-multipart>=0.0.22",
    "wheel>=0.46.2",
    "datasets>=3.1.0,<4.0.0",
    "equinox>=0.11.10",
    "pandas>=2.0,<3.0",
    "transformers>=4.57,<5",
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
