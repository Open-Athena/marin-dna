# One direct Lambda H100 for joint block-1/10/19 focal extraction.

name: dna-exp440-reference-state-focal

resources:
  infra: lambda/us-west-3
  instance_type: gpu_1x_h100_pcie
  disk_size: 100
  autostop:
    idle_minutes: 30
    down: true

workdir: .

envs:
  EXPERIMENT_COMMIT: ""
  RUN_ID: dna-exp440-reference-state-focal-seed288-r1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""

setup: |
  set -euxo pipefail
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if ! command -v aws >/dev/null 2>&1; then
    uv tool install awscli
  fi
  aws sts get-caller-identity
  uv sync --project experiments/exp440_m51_sae_reference_segmentation --frozen
  uv run --project experiments/exp440_m51_sae_reference_segmentation --no-dev \
    python -c 'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export HF_HUB_DOWNLOAD_TIMEOUT=120
  export TOKENIZERS_PARALLELISM=true
  export POLARS_MAX_THREADS=6
  export RAYON_NUM_THREADS=6
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export WANDB_DISABLED=true
  export EXPERIMENT_COMMIT

  test "${#EXPERIMENT_COMMIT}" -eq 40
  test "$RUN_ID" = "dna-exp440-reference-state-focal-seed288-r1"
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  EXPERIMENT_DIR="experiments/exp440_m51_sae_reference_segmentation"
  INPUT_ROOT="$HOME/exp440-reference-state-inputs"
  PANEL_ROOT="$INPUT_ROOT/panel"
  MODELS_ROOT="$INPUT_ROOT/models"
  OUTPUT_ROOT="$HOME/exp440-runs/$RUN_ID"
  PANEL_S3="s3://oa-bolinas/experiments/exp440/inputs/dna-exp440-reference-state-panel-r1"
  OUTPUT_S3="s3://oa-bolinas/experiments/exp440/retrieval/$RUN_ID"
  test ! -e "$OUTPUT_ROOT"
  mkdir -p "$PANEL_ROOT" "$MODELS_ROOT/block01-25m" \
    "$MODELS_ROOT/block10-25m" "$MODELS_ROOT/block19-25m"

  uv run --project "$EXPERIMENT_DIR" python -m pytest -q "$EXPERIMENT_DIR/tests"
  aws s3 sync "$PANEL_S3/" "$PANEL_ROOT/" --only-show-errors
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp436/retrieval/dna-exp436-block01-seed288-r1/models/block01-25m/ \
    "$MODELS_ROOT/block01-25m/"
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp426/retrieval/dna-exp426-layer-budget-seed288-r5/models/block10-25m/ \
    "$MODELS_ROOT/block10-25m/"
  aws s3 cp --recursive \
    s3://oa-bolinas/experiments/exp426/retrieval/dna-exp426-layer-budget-seed288-r5/models/block19-25m/ \
    "$MODELS_ROOT/block19-25m/"

  uv run --project "$EXPERIMENT_DIR" --no-dev python \
    "$EXPERIMENT_DIR/extract_focal.py" \
    --panel "$PANEL_ROOT/panel.parquet" \
    --panel-manifest "$PANEL_ROOT/manifest.json" \
    --models-root "$MODELS_ROOT" \
    --output-dir "$OUTPUT_ROOT" \
    --batch-size 128

  aws s3 sync "$OUTPUT_ROOT/" "$OUTPUT_S3/" \
    --exclude manifest.json --only-show-errors
  aws s3 cp "$OUTPUT_ROOT/manifest.json" "$OUTPUT_S3/manifest.json"
  DRYRUN_LOG="/tmp/exp440-reference-state-focal-s3-dryrun.txt"
  aws s3 sync "$OUTPUT_ROOT/" "$OUTPUT_S3/" --dryrun > "$DRYRUN_LOG"
  test ! -s "$DRYRUN_LOG"
