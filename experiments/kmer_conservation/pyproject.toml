[project]
name = "kmer-conservation"
version = "0.1.0"
description = "Bounded issue 568 local k-mer conservation experiment"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2", "scipy>=1.15", "polars>=1.30", "boto3>=1.35", "pyyaml>=6", "py2bit>=0.3", "edlib>=1.3", "datasketch>=1.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kmer-fixture = "kmer_conservation.fixture:main"
kmer-screen = "kmer_conservation.screen:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
