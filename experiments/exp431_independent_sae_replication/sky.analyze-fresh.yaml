# Freeze decoder candidates and run the registered fresh-dictionary test.

name: dna-exp431-analyze-fresh-seed289

resources:
    infra: lambda/us-west-3
    instance_type: gpu_1x_h100_pcie
    disk_size: 250
    autostop:
        idle_minutes: 45
        down: true

file_mounts:
    /home/ubuntu/exp431-inputs/panels: ../../scratch/issue431/retrieval/panels
    /home/ubuntu/exp431-inputs/reference-sae: ../../scratch/issue418/dna-exp418-micro-seed288-e816ec343c30/sae

envs:
    EXPERIMENT_COMMIT: ""
    DICTIONARY_NAME: rc-balanced-normalized-seed289

setup: |
    set -euxo pipefail
    REPO_DIR="$HOME/exp431-repo"
    if [ ! -d "$REPO_DIR/.git" ]; then
        git clone --filter=blob:none https://github.com/Open-Athena/marin-dna.git "$REPO_DIR"
    fi
    git -C "$REPO_DIR" fetch origin codex/issue-431-independent-sae-replication
    git -C "$REPO_DIR" checkout --force --detach "$EXPERIMENT_COMMIT"
    test "$(git -C "$REPO_DIR" rev-parse HEAD)" = "$EXPERIMENT_COMMIT"
    export PATH="$HOME/.local/bin:$PATH"
    cd "$REPO_DIR/experiments/exp431_independent_sae_replication"
    uv sync --frozen --no-dev
    uv run --no-dev python -c 'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export EXPERIMENT_COMMIT DICTIONARY_NAME
    export POLARS_MAX_THREADS=8 RAYON_NUM_THREADS=8
    export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
    cd "$HOME/exp431-repo/experiments/exp431_independent_sae_replication"
    FRESH_SAE="$HOME/exp431-artifacts/dna-exp431-fresh-seed289/models/block10-5m"
    CANDIDATES="$HOME/exp431-artifacts/decoder-fresh"
    EXTRACTION="$HOME/exp431-artifacts/fresh-extraction"
    ANALYSIS="$HOME/exp431-artifacts/analysis-fresh"
    test -f "$FRESH_SAE/sae_weights.safetensors"
    test ! -e "$CANDIDATES"
    test ! -e "$EXTRACTION"
    test ! -e "$ANALYSIS"
    /usr/bin/time -v uv run --no-dev python decoder_neighbors.py --reference-sae /home/ubuntu/exp431-inputs/reference-sae --candidate-sae "$FRESH_SAE" --dictionary-name "$DICTIONARY_NAME" --output-dir "$CANDIDATES" --top-k 32
    /usr/bin/time -v uv run --no-dev python extract_candidates.py --panel /home/ubuntu/exp431-inputs/panels/discovery/perturbation_panel.parquet --panel-manifest /home/ubuntu/exp431-inputs/panels/discovery/manifest.json --candidate-dir "$CANDIDATES" --sae "$FRESH_SAE" --output-dir "$EXTRACTION/discovery" --dictionary-name "$DICTIONARY_NAME" --batch-size 32
    /usr/bin/time -v uv run --no-dev python extract_candidates.py --panel /home/ubuntu/exp431-inputs/panels/validation/perturbation_panel.parquet --panel-manifest /home/ubuntu/exp431-inputs/panels/validation/manifest.json --candidate-dir "$CANDIDATES" --sae "$FRESH_SAE" --output-dir "$EXTRACTION/validation" --dictionary-name "$DICTIONARY_NAME" --batch-size 32
    /usr/bin/time -v uv run --no-dev python extract_candidates.py --panel /home/ubuntu/exp431-inputs/panels/test/perturbation_panel.parquet --panel-manifest /home/ubuntu/exp431-inputs/panels/test/manifest.json --candidate-dir "$CANDIDATES" --sae "$FRESH_SAE" --output-dir "$EXTRACTION/test" --dictionary-name "$DICTIONARY_NAME" --batch-size 32
    /usr/bin/time -v uv run --no-dev python analyze_replication.py --panel-root /home/ubuntu/exp431-inputs/panels --extraction-root "$EXTRACTION" --output-dir "$ANALYSIS" --dictionary-name "$DICTIONARY_NAME" --bootstraps 2000
