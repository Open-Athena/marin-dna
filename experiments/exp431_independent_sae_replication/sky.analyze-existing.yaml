# Held-out semantic-transfer analysis for the existing #426 dictionary.

name: dna-exp431-analysis-existing

resources:
    infra: aws/us-east-2
    instance_type: m6i.2xlarge
    disk_size: 120
    autostop:
        idle_minutes: 30
        down: true

file_mounts:
    /home/ubuntu/exp431-inputs/panels: ../../scratch/issue431/retrieval/panels
    /home/ubuntu/exp431-inputs/existing: ../../scratch/issue431/retrieval/existing

envs:
    EXPERIMENT_COMMIT: ""
    DICTIONARY_NAME: rc-balanced-normalized-seed288

setup: |
    set -euxo pipefail
    REPO_DIR="$HOME/exp431-repo"
    if [ ! -d "$REPO_DIR/.git" ]; then
        git clone --filter=blob:none https://github.com/Open-Athena/marin-dna.git "$REPO_DIR"
    fi
    git -C "$REPO_DIR" fetch origin codex/issue-431-independent-sae-replication
    git -C "$REPO_DIR" checkout --force --detach "$EXPERIMENT_COMMIT"
    test "$(git -C "$REPO_DIR" rev-parse HEAD)" = "$EXPERIMENT_COMMIT"
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    cd "$REPO_DIR/experiments/exp431_independent_sae_replication"
    uv sync --frozen --no-dev

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export EXPERIMENT_COMMIT DICTIONARY_NAME
    export POLARS_MAX_THREADS=4 RAYON_NUM_THREADS=4
    export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
    cd "$HOME/exp431-repo/experiments/exp431_independent_sae_replication"
    /usr/bin/time -v uv run --no-dev python analyze_replication.py \
        --panel-root /home/ubuntu/exp431-inputs/panels \
        --extraction-root /home/ubuntu/exp431-inputs/existing \
        --output-dir "$HOME/exp431-artifacts/analysis-existing" \
        --dictionary-name "$DICTIONARY_NAME" \
        --bootstraps 2000
