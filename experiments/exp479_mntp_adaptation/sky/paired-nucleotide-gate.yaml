name: dna-exp479-paired-nucleotide-information-gate

resources:
  cloud: lambda
  accelerators: A10:1
  disk_size: 64

setup: |
  cd experiments/exp479_mntp_adaptation
  uv sync --locked --group dev

run: |
  set -euo pipefail
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  cd experiments/exp479_mntp_adaptation
  test -n "${EXPERIMENT_COMMIT:-}"
  test -n "${EXP479_INSTANCE_START_UNIX:-}"
  test -n "${EXP479_PRIOR_COST_USD:-}"
  test -n "${WANDB_API_KEY:-}"
  artifact_root="$HOME/exp479-paired-nucleotide-gate-artifacts"
  output_dir="$artifact_root/evaluation/paired-nucleotide-gate"
  mkdir -p "$output_dir"
  trap 'uv run --locked exp479 finalize-local --artifact-dir "$HOME/exp479-paired-nucleotide-gate-artifacts" || true' EXIT
  uv run --locked pytest
  uv run --locked exp479 prepare-data \
    --output-dir "$artifact_root/data" \
    --batch-size 1 \
    --seed 0
  uv run --locked exp479 paired-nucleotide-gate \
    --artifact-dir "$artifact_root" \
    --output-dir "$output_dir" \
    --validation-plan "$artifact_root/data/validation.jsonl" \
    --batch-size 64 \
    --n-bootstrap 2000
