name: dna-exp479-final-checkpoint-dependency

resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 64

setup: |
  cd experiments/exp479_mntp_adaptation
  uv sync --locked --group dev

run: |
  set -euo pipefail
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  cd experiments/exp479_mntp_adaptation
  test -n "${EXPERIMENT_COMMIT:-}"
  test -n "${EXP479_INSTANCE_START_UNIX:-}"
  test -n "${HF_REPO_ID:-}"
  test -n "${HF_TOKEN:-}"
  test -n "${WANDB_API_KEY:-}"
  artifact_root="$HOME/exp479-final-dependency-artifacts"
  output_dir="$artifact_root/evaluation/final-checkpoint-dependency"
  mkdir -p "$output_dir"
  trap 'uv run --locked exp479 finalize --artifact-dir "$HOME/exp479-final-dependency-artifacts" --hf-repo-id "$HF_REPO_ID" || true' EXIT
  uv run --locked pytest
  uv run --locked exp479 final-dependency \
    --artifact-dir "$artifact_root" \
    --output-dir "$output_dir" \
    --hf-repo-id "$HF_REPO_ID" \
    --batch-size 1024
