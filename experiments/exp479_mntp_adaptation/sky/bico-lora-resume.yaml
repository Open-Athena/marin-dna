name: dna-exp479-bico-lora-resume

resources:
  cloud: lambda
  accelerators: GH200:1
  use_spot: false
  disk_size: 80

setup: |
  cd experiments/exp479_mntp_adaptation
  uv sync --locked --group dev

run: |
  set -euo pipefail
  export CUBLAS_WORKSPACE_CONFIG=:4096:8
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  cd experiments/exp479_mntp_adaptation
  test -n "${EXPERIMENT_COMMIT:-}"
  test -n "${EXP479_INSTANCE_START_UNIX:-}"
  test -n "${EXP479_PRIOR_COST_USD:-}"
  test -n "${WANDB_API_KEY:-}"
  artifact_root="$HOME/exp479-bico-lora-resume-artifacts"
  preflight_dir="$artifact_root/batch-preflights"
  output_dir="$artifact_root/training/bico-lora"
  mkdir -p "$preflight_dir" "$output_dir"
  trap 'uv run --locked exp479 finalize-local --artifact-dir "$HOME/exp479-bico-lora-resume-artifacts" || true' EXIT

  uv run --locked pytest
  uv run --locked exp479 prepare-data \
    --output-dir "$artifact_root/preflight-data" \
    --batch-size 1 \
    --seed 0
  timeout --signal=TERM 900 uv run --locked exp479 bico-lora-preflight \
    --batch-size 94 \
    --train-plan "$artifact_root/preflight-data/train.jsonl" \
    --validation-plan "$artifact_root/preflight-data/validation.jsonl" \
    --output "$preflight_dir/batch-94.json" \
    --seed 0
  printf '%s\n' '94' > "$preflight_dir/selected-batch.txt"

  uv run --locked exp479 prepare-data \
    --output-dir "$artifact_root/data" \
    --batch-size 94 \
    --seed 0
  timeout --signal=TERM 12000 uv run --locked exp479 bico-lora-mntp \
    --artifact-dir "$artifact_root" \
    --output-dir "$output_dir" \
    --train-plan "$artifact_root/data/train.jsonl" \
    --validation-plan "$artifact_root/data/validation.jsonl" \
    --preflight-dir "$preflight_dir" \
    --batch-size 94 \
    --seed 0 \
    --num-workers 4 \
    --evaluation-batch-size 64 \
    --n-bootstrap 2000
