name: dna-exp479-pilot

resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 512

setup: |
  cd experiments/exp479_mntp_adaptation
  uv sync --locked --group dev

run: |
  set -euo pipefail
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  cd experiments/exp479_mntp_adaptation
  test -n "${EXPERIMENT_COMMIT:-}"
  test -n "${EXP479_INSTANCE_START_UNIX:-}"
  test -n "${HF_REPO_ID:-}"
  test -n "${HF_TOKEN:-}"
  test -n "${WANDB_API_KEY:-}"
  mkdir -p "$HOME/exp479-artifacts"
  uv run --locked pytest
  uv run --locked exp479 preflight \
    --output "$HOME/exp479-artifacts/preflight.json"
  TRAIN_BATCH=""
  for CANDIDATE in 128 64 32 16 8 4 2 1; do
    if uv run --locked exp479 trainer-preflight \
      --batch-size "$CANDIDATE" \
      --output "$HOME/exp479-artifacts/lightning-preflight.json"; then
      TRAIN_BATCH="$CANDIDATE"
      break
    fi
  done
  test -n "$TRAIN_BATCH"
  PILOT_EXTRA_ARGS=()
  if [[ -n "${RESUME_HF_REPO_ID:-}" ]]; then
    PILOT_EXTRA_ARGS+=(--resume-hf-repo-id "$RESUME_HF_REPO_ID")
  fi
  if [[ -n "${CHECKPOINT_UPLOAD_STEPS:-}" ]]; then
    read -r -a UPLOAD_STEPS <<< "$CHECKPOINT_UPLOAD_STEPS"
    PILOT_EXTRA_ARGS+=(--checkpoint-upload-steps "${UPLOAD_STEPS[@]}")
  fi

  uv run --locked exp479 pilot \
    --preflight "$HOME/exp479-artifacts/preflight.json" \
    --trainer-preflight "$HOME/exp479-artifacts/lightning-preflight.json" \
    --artifact-dir "$HOME/exp479-artifacts" \
    --hf-repo-id "$HF_REPO_ID" \
    --model-card README.hf.md \
    --experiment-commit "$EXPERIMENT_COMMIT" \
    --model-card-reviewed \
    "${PILOT_EXTRA_ARGS[@]}"
  uv run --locked exp479 evaluate \
    --artifact-dir "$HOME/exp479-artifacts" \
    --output-dir "$HOME/exp479-artifacts/evaluation/vep" \
    --hf-repo-id "$HF_REPO_ID" \
    --batch-size "$TRAIN_BATCH"
  uv run --locked exp479 nuc-dep \
    --artifact-dir "$HOME/exp479-artifacts" \
    --output-dir "$HOME/exp479-artifacts/evaluation/nucleotide-dependency" \
    --hf-repo-id "$HF_REPO_ID" \
    --batch-size 1024
  uv run --locked exp479 finalize \
    --artifact-dir "$HOME/exp479-artifacts" \
    --hf-repo-id "$HF_REPO_ID"
