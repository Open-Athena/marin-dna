[project]
name = "exp422-m51-sae-variant-consequences"
version = "0.1.0"
description = "Balanced chr21 variant-consequence benchmark for m5.1 SAE features"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marin_dna @ git+https://github.com/Open-Athena/marin-dna.git@c4c1c86bbfc0bd58ff76dda3bac1d2acea856a33",
    "sae-lens @ git+https://github.com/decoderesearch/SAELens.git@8be14080485952f729ed58d674bcddf9778e0aa4",
    "huggingface-hub",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=18",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch==2.11.0",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12.11",
]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "omegaconf>=2.4.0.dev4",
    "antlr4-python3-runtime==4.11",
    "python-multipart>=0.0.22",
    "wheel>=0.46.2",
    "datasets>=3.1.0,<4.0.0",
    "equinox>=0.11.10",
    "pandas>=2.0,<3.0",
    "transformers>=4.57,<5",
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
