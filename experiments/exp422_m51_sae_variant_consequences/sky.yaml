# Direct EC2 A10G extraction for the issue #422 chr21 consequence panel.

name: dna-exp422-variant-consequences

resources:
    infra: aws/us-east-2
    instance_type: g5.xlarge
    disk_size: 150
    autostop:
        idle_minutes: 30
        down: true

workdir: .

file_mounts:
    /home/ubuntu/exp422_inputs/panel: ../../scratch/issue422/input
    /home/ubuntu/exp422_inputs/sae: ../../scratch/issue418/dna-exp418-micro-seed288-e816ec343c30/sae
    /home/ubuntu/exp422_inputs/reference: ../../scratch/issue418/reference

envs:
    RUN_ID: dna-exp422-variant-consequences-seed288
    EXPERIMENT_COMMIT: ""

setup: |
    set -euxo pipefail

    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --frozen --no-dev
    uv run --no-dev python -c \
        'import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

run: |
    set -euxo pipefail

    export PATH="$HOME/.local/bin:$PATH"
    export HF_HUB_DOWNLOAD_TIMEOUT=120
    uv run --no-dev python extract.py \
        --panel /home/ubuntu/exp422_inputs/panel/panel.parquet \
        --panel-manifest /home/ubuntu/exp422_inputs/panel/panel.manifest.json \
        --fasta /home/ubuntu/exp422_inputs/reference/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz \
        --sae /home/ubuntu/exp422_inputs/sae \
        --output-dir "artifacts/$RUN_ID" \
        --batch-size 16 \
        --block-index 9
