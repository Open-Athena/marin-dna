<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 166" role="img" aria-labelledby="t" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Scaling ladder — one proportional mixture shared by all 8 model sizes</title>
