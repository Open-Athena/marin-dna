<svg xmlns="http://www.w3.org/2000/svg" width="720" height="138" viewBox="0 0 720 138" role="img" aria-labelledby="title desc" font-family="Lato, sans-serif" data-figure-typography="lato-v1" data-figure-render-width="640">
  <title id="title">Available annotation-derived DNA training pool</title>
  <desc id="desc">Approximately 85 billion tokens in a proportional mixture of 73 percent coding sequence, 21 percent upstream sequence, and 6 percent downstream sequence.</desc>
  <defs>
    <clipPath id="pool-bar"><rect x="24" y="76" width="672" height="36" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="718" height="136" rx="12" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="24" y="27" font-size="13.5" font-weight="750" letter-spacing="0.75" fill="#a89a80">AVAILABLE ANNOTATION-DERIVED TRAINING POOL</text>
  <text x="24" y="53" font-size="18" font-weight="760" fill="#1f1e1b">~85B DNA tokens</text>
  <text x="696" y="51" text-anchor="end" font-size="15.75" fill="#7a6f5f">Proportional animal-region mixture</text>
  <g clip-path="url(#pool-bar)">
    <rect x="24" y="76" width="491" height="36" fill="#9c4f2f"/>
    <rect x="515" y="76" width="141" height="36" fill="#2f6f63"/>
    <rect x="656" y="76" width="40" height="36" fill="#c0883a"/>
  </g>
  <g>
    <text x="269.5" y="99" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">CDS 73%</text>
    <text x="585.5" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Upstream 21%</text>
    <text x="676" y="68" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a6b2f">Downstream 6%</text>
  </g>
</svg>
