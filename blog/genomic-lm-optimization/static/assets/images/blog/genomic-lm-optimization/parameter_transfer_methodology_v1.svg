<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Calibrate once, transfer hyperparameters across scales</title>
  <desc id="desc">A compact two-stage schematic. A reference sweep tunes eight hyperparameters on a small model. At a target width D, batch size B, and token horizon T, four hyperparameters are transformed with B and T while four are reused unchanged. Optimizer transfer is independent of width D.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5b4a36" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7d68"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="258" rx="16" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="28" y="35" font-size="21" font-weight="760" fill="#1f1e1b">Calibrate once, transfer hyperparameters across scales</text>

  <g filter="url(#shadow)">
    <rect x="24" y="50" width="390" height="191" rx="14" fill="#fffaf0" stroke="#d8ccb5"/>
  </g>
  <circle cx="49" cy="75" r="13" fill="#9c4f2f"/>
  <text x="49" y="79.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">1</text>
  <text x="70" y="80" font-size="15" font-weight="760" fill="#1f1e1b">Tune on a small reference model</text>

  <rect x="46" y="97" width="346" height="46" rx="9" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="62" y="113" font-size="8.8" font-weight="750" letter-spacing="0.65" fill="#8a7d68">REFERENCE SETTING</text>
  <rect x="62" y="118" width="190" height="20" rx="10" fill="#fffaf0" stroke="#ddd3bf"/>
  <text x="157" y="132" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3b3934">width D₀ = 512 · ~25M parameters</text>
  <rect x="260" y="118" width="116" height="20" rx="10" fill="#fffaf0" stroke="#ddd3bf"/>
  <text x="318" y="132" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3b3934">2.5B tokens</text>

  <rect x="46" y="151" width="346" height="74" rx="9" fill="#fbf5e9" stroke="#e0d5c0"/>
  <text x="62" y="167" font-size="8.8" font-weight="750" letter-spacing="0.65" fill="#8a7d68">TUNED AT THE REFERENCE</text>
  <g font-size="9" font-weight="650" fill="#3b3934">
    <rect x="62" y="173" width="110" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="117" y="188" text-anchor="middle">initialization scale</text>
    <rect x="178" y="173" width="60" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="208" y="188" text-anchor="middle">AdamH LR</text>
    <rect x="244" y="173" width="60" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="274" y="188" text-anchor="middle">Adam LR</text>
    <rect x="310" y="173" width="42" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="331" y="188" text-anchor="middle">β₁</text>
    <rect x="62" y="199" width="42" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="83" y="214" text-anchor="middle">β₂</text>
    <rect x="110" y="199" width="42" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="131" y="214" text-anchor="middle">ε</text>
    <rect x="158" y="199" width="98" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="207" y="214" text-anchor="middle">gradient clip</text>
    <rect x="262" y="199" width="62" height="22" rx="11" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="293" y="214" text-anchor="middle">z-loss</text>
  </g>

  <path d="M 414 153 H 449" fill="none" stroke="#8a7d68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="421" y="121" width="36" height="21" rx="10.5" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="439" y="135.5" text-anchor="middle" font-size="10.5" font-weight="750" fill="#5b4a36">h₀</text>

  <g filter="url(#shadow)">
    <rect x="462" y="50" width="474" height="191" rx="14" fill="#fffaf0" stroke="#d8ccb5"/>
  </g>
  <circle cx="487" cy="75" r="13" fill="#2f6f63"/>
  <text x="487" y="79.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">2</text>
  <text x="508" y="80" font-size="15" font-weight="760" fill="#1f1e1b">Apply at width D, batch B, and token horizon T</text>

  <rect x="484" y="97" width="202" height="128" rx="9" fill="#e8f0ed" stroke="#c7d9d3"/>
  <text x="585" y="117" text-anchor="middle" font-size="8.8" font-weight="760" letter-spacing="0.6" fill="#5d756e">TRANSFORM WITH B AND T</text>
  <text x="585" y="133" text-anchor="middle" font-size="9.2" fill="#5d756e">independent of width D</text>
  <g font-size="9" font-weight="680" fill="#3b3934">
    <rect x="499" y="143" width="82" height="24" rx="12" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="540" y="159" text-anchor="middle">AdamH LR</text>
    <rect x="587" y="143" width="80" height="24" rx="12" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="627" y="159" text-anchor="middle">Adam LR</text>
    <rect x="536" y="177" width="44" height="24" rx="12" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="558" y="193" text-anchor="middle">ε</text>
    <rect x="587" y="177" width="44" height="24" rx="12" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="609" y="193" text-anchor="middle">β₂</text>
  </g>

  <rect x="698" y="97" width="216" height="128" rx="9" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="806" y="117" text-anchor="middle" font-size="8.8" font-weight="760" letter-spacing="0.6" fill="#8a7d68">REUSE UNCHANGED</text>
  <text x="806" y="133" text-anchor="middle" font-size="9.2" fill="#8a7d68">carry forward from h₀</text>
  <g font-size="9" font-weight="680" fill="#3b3934">
    <rect x="724" y="143" width="112" height="24" rx="12" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="780" y="159" text-anchor="middle">initialization scale</text>
    <rect x="844" y="143" width="44" height="24" rx="12" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="866" y="159" text-anchor="middle">β₁</text>
    <rect x="723" y="177" width="96" height="24" rx="12" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="771" y="193" text-anchor="middle">gradient clip</text>
    <rect x="827" y="177" width="62" height="24" rx="12" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="858" y="193" text-anchor="middle">z-loss</text>
  </g>
</svg>
