<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" font-family="Lato, sans-serif" data-figure-typography="lato-v1" data-figure-render-width="700">
  <title id="title">Two complementary sources of evidence for variant effects</title>
  <desc id="desc">Side-by-side comparison of the Mendelian disease and saturation genome editing benchmarks. The diagram preserves their evidence sources, label construction, matching and calibration protocols, consequence-subset counts, totals, chromosome split, and relevant training-region legend.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7d68"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="758" rx="16" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="28" y="36" font-size="21.943" font-weight="750" fill="#1f1e1b">Two complementary sources of evidence for variant effects</text>

  <!-- Shared benchmark metadata -->
  <g font-size="16.457" font-weight="650" text-anchor="middle" fill="#5f574b">
    <rect x="20" y="53" width="130" height="28" rx="14" fill="#ebe4d7" stroke="#ddd3bf"/>
    <text x="85" y="72">GRCh38 SNVs</text>

    <rect x="160" y="53" width="200" height="28" rx="14" fill="#ebe4d7" stroke="#ddd3bf"/>
    <text x="260" y="72">HIGH-impact excluded</text>

    <rect x="370" y="53" width="570" height="28" rx="14" fill="#ebe4d7" stroke="#ddd3bf"/>
    <text x="655" y="72">Odd chromosomes → train/validation · Even chromosomes → test</text>
  </g>

  <!-- Mendelian panel -->
  <rect x="20" y="99" width="450" height="594" rx="14" fill="#fffaf0" stroke="#d9cbb1"/>
  <path d="M 20 113 Q 20 99 34 99 H 456 Q 470 99 470 113 V 160 H 20 Z" fill="#eadcc2"/>
  <text x="40" y="135" font-size="21.943" font-weight="750" fill="#1f1e1b">Mendelian disease</text>

  <text x="40" y="174" font-size="17.241" font-weight="750" letter-spacing="0.8" fill="#8a7d68">CLINICAL EVIDENCE</text>
  <text x="450" y="174" font-size="15.674" font-weight="650" text-anchor="end" fill="#8a7d68">TraitGym-inspired</text>
  <rect x="40" y="186" width="410" height="86" rx="10" fill="#fcfaf5" stroke="#e2d7c2"/>
  <circle cx="60" cy="212" r="5" fill="#9c4f2f"/>
  <text x="74" y="210" font-size="18.808" font-weight="750" fill="#1f1e1b">Pathogenic</text>
  <text x="180" y="210" font-size="16.457" fill="#5f574b">OMIM + Smedley et al. + HGMD</text>
  <text x="180" y="229" font-size="16.457" fill="#5f574b">AF &lt; 0.1%</text>
  <circle cx="60" cy="244" r="5" fill="#f4e9e1" stroke="#9c4f2f"/>
  <text x="74" y="248" font-size="18.808" font-weight="750" fill="#1f1e1b">Control</text>
  <text x="170" y="248" font-size="16.457" fill="#5f574b">gnomAD non-rare SNVs · AF &gt; 0.1%</text>

  <line x1="245" y1="274" x2="245" y2="287" stroke="#8a7d68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="292" width="410" height="68" rx="10" fill="#f3ead8" stroke="#d9cbb1"/>
  <text x="56" y="317" font-size="19.592" font-weight="750" fill="#1f1e1b">1 pathogenic + 9 controls</text>
  <text x="56" y="339" font-size="16.457" fill="#5f574b">Matched on chromosome · consequence</text>
  <text x="56" y="356" font-size="16.457" fill="#5f574b">TSS distance · exon distance</text>

  <text x="40" y="382" font-size="17.241" font-weight="750" letter-spacing="0.4" fill="#8a7d68">SUBSET COUNTS</text>
  <text x="444" y="382" font-size="15.086" text-anchor="end" fill="#8a7d68">Dark: pathogenic · Tint: controls · Total</text>

  <!-- Mendelian bars: one shared total-count scale; dark:tint = 1:9 matching. -->
  <g font-size="16.457" fill="#1f1e1b">
    <text x="42" y="408">Missense</text>
    <rect x="162" y="396" width="22" height="14" rx="2" fill="#9c4f2f"/>
    <rect x="184" y="396" width="198" height="14" rx="2" fill="#9c4f2f" fill-opacity="0.22"/>
    <text x="436" y="408" text-anchor="end">10,000</text>

    <text x="42" y="430">Splicing</text>
    <rect x="162" y="418" width="12" height="14" rx="2" fill="#9c4f2f"/>
    <rect x="174" y="418" width="109" height="14" rx="2" fill="#9c4f2f" fill-opacity="0.22"/>
    <text x="436" y="430" text-anchor="end">5,500</text>

    <text x="42" y="452">5′ UTR</text>
    <rect x="162" y="440" width="6" height="14" rx="2" fill="#2f6f63"/>
    <rect x="168" y="440" width="61" height="14" rx="2" fill="#2f6f63" fill-opacity="0.22"/>
    <text x="436" y="452" text-anchor="end">3,050</text>

    <text x="42" y="474">Promoter</text>
    <rect x="162" y="462" width="6" height="14" rx="2" fill="#2f6f63"/>
    <rect x="168" y="462" width="54" height="14" rx="2" fill="#2f6f63" fill-opacity="0.22"/>
    <text x="436" y="474" text-anchor="end">2,700</text>

    <text x="42" y="496">ncRNA</text>
    <rect x="162" y="484" width="4" height="14" rx="2" fill="#465c6e"/>
    <rect x="166" y="484" width="31" height="14" rx="2" fill="#465c6e" fill-opacity="0.22"/>
    <text x="436" y="496" text-anchor="end">1,590</text>

    <text x="42" y="518">3′ UTR</text>
    <rect x="162" y="506" width="3" height="14" rx="2" fill="#c0883a"/>
    <rect x="165" y="506" width="21" height="14" rx="2" fill="#c0883a" fill-opacity="0.22"/>
    <text x="436" y="518" text-anchor="end">1,100</text>

    <text x="42" y="540">Distal</text>
    <rect x="162" y="528" width="3" height="14" rx="2" fill="#6f7d3f"/>
    <rect x="165" y="528" width="19" height="14" rx="2" fill="#6f7d3f" fill-opacity="0.22"/>
    <text x="436" y="540" text-anchor="end">990</text>

    <text x="42" y="562">Synonymous</text>
    <rect x="162" y="550" width="2" height="14" rx="2" fill="#9c4f2f"/>
    <rect x="164" y="550" width="13" height="14" rx="2" fill="#9c4f2f" fill-opacity="0.22"/>
    <text x="436" y="562" text-anchor="end">650</text>

    <text x="42" y="584">Mature miRNA</text>
    <rect x="162" y="572" width="2" height="14" rx="2" fill="#465c6e"/>
    <text x="436" y="584" text-anchor="end">50</text>
  </g>

  <line x1="40" y1="608" x2="450" y2="608" stroke="#e6dcc6"/>
  <text x="40" y="634" font-size="19.592" font-weight="750" fill="#1f1e1b">25,630 variants</text>
  <text x="40" y="657" font-size="16.457" fill="#7a6f5f">2,563 pathogenic · 23,067 controls</text>

  <!-- SGE panel -->
  <rect x="490" y="99" width="450" height="594" rx="14" fill="#fffaf0" stroke="#d9cbb1"/>
  <path d="M 490 113 Q 490 99 504 99 H 926 Q 940 99 940 113 V 160 H 490 Z" fill="#dce6df"/>
  <text x="510" y="135" font-size="21.943" font-weight="750" fill="#1f1e1b">Saturation genome editing</text>

  <text x="510" y="174" font-size="17.241" font-weight="750" letter-spacing="0.8" fill="#8a7d68">EXPERIMENTAL EVIDENCE</text>
  <text x="920" y="174" font-size="15.674" font-weight="650" text-anchor="end" fill="#8a7d68">MaveDB · 11 studies</text>
  <rect x="510" y="186" width="410" height="86" rx="10" fill="#fcfaf5" stroke="#d4e0db"/>
  <text x="526" y="211" font-size="19.592" font-weight="750" fill="#1f1e1b">CRISPR-HDR variant library</text>
  <text x="526" y="234" font-size="16.457" fill="#5f574b">Cell fitness / proliferation → continuous score</text>
  <text x="526" y="255" font-size="15.674" fill="#8a7d68">Only Missense + near-exon Splicing retained</text>

  <line x1="715" y1="274" x2="715" y2="287" stroke="#8a7d68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="292" width="410" height="68" rx="10" fill="#eaf1ed" stroke="#c8dbd4"/>
  <text x="526" y="317" font-size="19.592" font-weight="750" fill="#1f1e1b">Calibrated class → abnormal vs normal</text>
  <text x="526" y="340" font-size="16.457" fill="#5f574b">ClinGen / ExCALIBR or author thresholds</text>

  <text x="510" y="382" font-size="17.241" font-weight="750" letter-spacing="0.8" fill="#8a7d68">SUBSET COUNTS</text>
  <text x="920" y="382" font-size="15.086" text-anchor="end" fill="#8a7d68">Dark = abnormal · Tint = normal</text>

  <!-- SGE bars use one shared total-count scale. -->
  <text x="510" y="412" font-size="18.025" font-weight="750" fill="#1f1e1b">Missense</text>
  <text x="920" y="412" font-size="16.457" text-anchor="end" fill="#1f1e1b">31,316 total</text>
  <rect x="615" y="398" width="31" height="18" rx="3" fill="#9c4f2f"/>
  <rect x="646" y="398" width="199" height="18" rx="3" fill="#9c4f2f" fill-opacity="0.22"/>
  <text x="615" y="439" font-size="16.457" fill="#9c4f2f">4,250 abnormal</text>
  <text x="740" y="439" font-size="16.457" fill="#7a6f5f">27,066 normal</text>

  <text x="510" y="482" font-size="18.025" font-weight="750" fill="#1f1e1b">Splicing</text>
  <text x="920" y="482" font-size="16.457" text-anchor="end" fill="#1f1e1b">7,425 total</text>
  <rect x="615" y="468" width="6" height="18" rx="3" fill="#9c4f2f"/>
  <rect x="621" y="468" width="51" height="18" rx="3" fill="#9c4f2f" fill-opacity="0.22"/>
  <text x="615" y="509" font-size="16.457" fill="#9c4f2f">735 abnormal</text>
  <text x="740" y="509" font-size="16.457" fill="#7a6f5f">6,690 normal</text>

  <rect x="510" y="538" width="410" height="65" rx="10" fill="#eaf1ed" stroke="#c8dbd4"/>
  <text x="526" y="563" font-size="18.808" font-weight="750" fill="#1f1e1b">No matching · no subsampling</text>
  <text x="526" y="585" font-size="16.457" fill="#5f574b">Macro-averaged AUPRC within each MaveDB study</text>

  <line x1="510" y1="608" x2="920" y2="608" stroke="#e6dcc6"/>
  <text x="510" y="634" font-size="19.592" font-weight="750" fill="#1f1e1b">38,741 variants</text>
  <text x="510" y="657" font-size="16.457" fill="#7a6f5f">4,985 abnormal · 33,756 normal</text>

  <!-- Region-color legend -->
  <line x1="28" y1="708" x2="932" y2="708" stroke="#ddd3bf"/>
  <text x="28" y="736" font-size="16.457" font-weight="750" fill="#7a6f5f">Relevant training region</text>
  <g font-size="16.457" fill="#5f574b">
    <rect x="225" y="725" width="11" height="11" rx="2" fill="#9c4f2f"/>
    <text x="243" y="735">CDS</text>
    <rect x="295" y="725" width="11" height="11" rx="2" fill="#2f6f63"/>
    <text x="313" y="735">Upstream</text>
    <rect x="400" y="725" width="11" height="11" rx="2" fill="#c0883a"/>
    <text x="418" y="735">Downstream</text>
    <rect x="525" y="725" width="11" height="11" rx="2" fill="#465c6e"/>
    <text x="543" y="735">ncRNA</text>
    <rect x="615" y="725" width="11" height="11" rx="2" fill="#6f7d3f"/>
    <text x="633" y="735">Enhancer</text>
  </g>
</svg>
