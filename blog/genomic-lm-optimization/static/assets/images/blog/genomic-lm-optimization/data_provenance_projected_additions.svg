<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 224" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Later additions — alignment-projected training datasets</title>
  <desc id="d">Enhancer and non-coding RNA exon datasets built from human annotations, conservation-filtered and projected onto approximately 108 Zoonomia mammals. These datasets were added during the later five-region mixture experiments. Bar length uses the same token scale as the three-region baseline figure, and each dataset links to its Hugging Face page.</desc>
  <rect x="1" y="1" width="898" height="222" rx="14" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="26" y="34" font-size="17" font-weight="700" fill="#1f1e1b">Later additions — alignment-projected datasets</text>
  <text x="26" y="53" font-size="11.5" fill="#7a6f5f">added during five-region mixture experiments  ·  same token scale as above  ·  🤗 dataset links</text>

  <g stroke="#e6dcc6" stroke-width="1">
    <line x1="380" y1="72" x2="380" y2="160"/><line x1="532" y1="72" x2="532" y2="160"/><line x1="684" y1="72" x2="684" y2="160"/><line x1="836" y1="72" x2="836" y2="160"/>
  </g>

  <text x="26" y="86" font-size="12.5" font-weight="700" fill="#3a4a4a">Human anchors → conservation filter → halLiftover onto ~108 Zoonomia mammals</text>

  <g>
    <rect x="26" y="100" width="13" height="13" rx="3" fill="#6f7d3f"/><text x="45" y="111" font-size="12.5" font-weight="700" fill="#1f1e1b">Enhancer</text>
    <a href="https://huggingface.co/datasets/bolinas-dna/zoonomia-v1-v3_ccre_non_promoter" target="_blank"><text x="356" y="112" font-size="12">🤗</text></a>
    <text x="45" y="126" font-size="9.5" fill="#8a7d68">ENCODE cCRE V4 (SCREEN), non-promoter classes +500 bp</text>
    <rect x="380" y="101" width="187" height="14" rx="2" fill="#6f7d3f"/><text x="573" y="112" font-size="10.5" font-weight="700" fill="#5b4a36">24.6B</text>
  </g>
  <g>
    <rect x="26" y="138" width="13" height="13" rx="3" fill="#465c6e"/><text x="45" y="149" font-size="12.5" font-weight="700" fill="#1f1e1b">ncRNA</text>
    <a href="https://huggingface.co/datasets/bolinas-dna/zoonomia-v1-v3_ncrna_exon" target="_blank"><text x="356" y="150" font-size="12">🤗</text></a>
    <text x="45" y="164" font-size="9.5" fill="#8a7d68">Ensembl r115 non-protein-coding exons</text>
    <rect x="380" y="139" width="30" height="14" rx="2" fill="#465c6e"/><text x="416" y="150" font-size="10.5" font-weight="700" fill="#5b4a36">3.9B</text>
  </g>

  <g font-size="9.5" fill="#a89a80" text-anchor="middle">
    <text x="380" y="184">0</text><text x="532" y="184">20B</text><text x="684" y="184">40B</text><text x="836" y="184">60B</text>
    <text x="608" y="202" fill="#8a7d68">dataset tokens</text>
  </g>
</svg>
