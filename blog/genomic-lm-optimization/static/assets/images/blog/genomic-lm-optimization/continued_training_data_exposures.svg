<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Training-data exposure histories for three continued-training recipes</title>
  <desc id="desc">All three lanes span the same 166-billion-token comparison horizon. The m5.1 recipe changes after about 104 billion tokens from a uniform three-region mixture to a uniform five-region mixture. The m1.3 recipe uses a uniform five-region mixture throughout. The m3.3 recipe uses an upstream-tilted five-region mixture throughout. Same-data training-job boundaries are collapsed.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#6b5d48" flood-opacity="0.14"/>
    </filter>
    <clipPath id="m51"><rect x="206" y="121" width="700" height="44" rx="7"/></clipPath>
    <clipPath id="m13"><rect x="206" y="236" width="700" height="44" rx="7"/></clipPath>
    <clipPath id="m33"><rect x="206" y="351" width="700" height="44" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="34" y="36" font-size="10" font-weight="700" letter-spacing="1" fill="#a89a80">CONTINUED-TRAINING RECIPES · FIGURE 15</text>
  <text x="34" y="64" font-size="20" font-weight="750" fill="#1f1e1b">What training data did each recipe see?</text>
  <text x="34" y="86" font-size="11.5" fill="#6f6350">Each lane spans the same 166B-token window; a stage boundary appears only when the data mixture changes.</text>
  <text x="34" y="136" font-size="13" font-weight="750" fill="#9c4f2f">m5.1 ★</text>
  <text x="34" y="156" font-size="10.5" fill="#6f6350">staged exposure</text>
  <text x="425" y="113" font-size="10" font-weight="700" fill="#5b4a36" text-anchor="middle">uniform 3-region mix · ~104B tokens</text>
  <text x="775" y="113" font-size="10" font-weight="700" fill="#5b4a36" text-anchor="middle">uniform 5-region mix · ~62B tokens</text>
  <g clip-path="url(#m51)" filter="url(#shadow)">
    <rect x="206" y="121" width="146" height="44" fill="#9c4f2f"/>
    <rect x="352" y="121" width="146" height="44" fill="#2f6f63"/>
    <rect x="498" y="121" width="146" height="44" fill="#c0883a"/>
    <rect x="644" y="121" width="52.4" height="44" fill="#9c4f2f"/>
    <rect x="696.4" y="121" width="52.4" height="44" fill="#2f6f63"/>
    <rect x="748.8" y="121" width="52.4" height="44" fill="#c0883a"/>
    <rect x="801.2" y="121" width="52.4" height="44" fill="#465c6e"/>
    <rect x="853.6" y="121" width="52.4" height="44" fill="#6f7d3f"/>
  </g>
  <line x1="644" y1="119" x2="644" y2="167" stroke="#f6f0e4" stroke-width="4"/>
  <g font-size="10" font-weight="650" fill="#fff" text-anchor="middle">
    <text x="279" y="147">CDS ⅓</text>
    <text x="425" y="147">Upstream ⅓</text>
    <text x="571" y="147">Downstream ⅓</text>
  </g>
  <g font-size="8.5" font-weight="650" fill="#fff" text-anchor="middle">
    <text x="670.2" y="139"><tspan x="670.2">CDS</tspan><tspan x="670.2" dy="12">20%</tspan></text>
    <text x="722.6" y="139"><tspan x="722.6">Up</tspan><tspan x="722.6" dy="12">20%</tspan></text>
    <text x="775" y="139"><tspan x="775">Down</tspan><tspan x="775" dy="12">20%</tspan></text>
    <text x="827.4" y="139"><tspan x="827.4">ncRNA</tspan><tspan x="827.4" dy="12">20%</tspan></text>
    <text x="879.8" y="139"><tspan x="879.8">Enh</tspan><tspan x="879.8" dy="12">20%</tspan></text>
  </g>
  <line x1="206" y1="176" x2="906" y2="176" stroke="#b9aa91" stroke-width="1"/>
  <line x1="206" y1="172" x2="206" y2="180" stroke="#b9aa91"/>
  <line x1="644" y1="172" x2="644" y2="180" stroke="#b9aa91"/>
  <line x1="906" y1="172" x2="906" y2="180" stroke="#b9aa91"/>
  <text x="206" y="190" font-size="9" fill="#8a7d68" text-anchor="middle">0</text>
  <text x="644" y="190" font-size="9" font-weight="700" fill="#6f6350" text-anchor="middle">~104B · add ncRNA + enhancer</text>
  <text x="906" y="190" font-size="9" fill="#8a7d68" text-anchor="middle">~166B</text>
  <line x1="34" y1="207" x2="926" y2="207" stroke="#ddd3bf"/>
  <text x="34" y="251" font-size="13" font-weight="750" fill="#1f1e1b">m1.3</text>
  <text x="34" y="271" font-size="10.5" fill="#6f6350">from scratch · fixed mix</text>
  <text x="206" y="228" font-size="10" font-weight="700" fill="#5b4a36">uniform 5-region mix throughout</text>
  <g clip-path="url(#m13)" filter="url(#shadow)">
    <rect x="206" y="236" width="140" height="44" fill="#9c4f2f"/>
    <rect x="346" y="236" width="140" height="44" fill="#2f6f63"/>
    <rect x="486" y="236" width="140" height="44" fill="#c0883a"/>
    <rect x="626" y="236" width="140" height="44" fill="#465c6e"/>
    <rect x="766" y="236" width="140" height="44" fill="#6f7d3f"/>
  </g>
  <g font-size="10" font-weight="650" fill="#fff" text-anchor="middle">
    <text x="276" y="262">CDS 20%</text>
    <text x="416" y="262">Upstream 20%</text>
    <text x="556" y="262">Downstream 20%</text>
    <text x="696" y="262">ncRNA 20%</text>
    <text x="836" y="262">Enhancer 20%</text>
  </g>
  <line x1="34" y1="322" x2="926" y2="322" stroke="#ddd3bf"/>
  <text x="34" y="366" font-size="13" font-weight="750" fill="#1f1e1b">m3.3</text>
  <text x="34" y="386" font-size="10.5" fill="#6f6350">from scratch · fixed mix</text>
  <text x="206" y="343" font-size="10" font-weight="700" fill="#5b4a36">upstream-tilted 5-region mix throughout</text>
  <g clip-path="url(#m33)" filter="url(#shadow)">
    <rect x="206" y="351" width="131.25" height="44" fill="#9c4f2f"/>
    <rect x="337.25" y="351" width="175" height="44" fill="#2f6f63"/>
    <rect x="512.25" y="351" width="131.25" height="44" fill="#c0883a"/>
    <rect x="643.5" y="351" width="131.25" height="44" fill="#465c6e"/>
    <rect x="774.75" y="351" width="131.25" height="44" fill="#6f7d3f"/>
  </g>
  <g font-size="9.5" font-weight="650" fill="#fff" text-anchor="middle">
    <text x="271.625" y="377">CDS 18.75%</text>
    <text x="424.75" y="377">Upstream 25%</text>
    <text x="577.875" y="377">Downstream 18.75%</text>
    <text x="709.125" y="377">ncRNA 18.75%</text>
    <text x="840.375" y="377">Enhancer 18.75%</text>
  </g>
  <text x="34" y="421" font-size="9.5" font-style="italic" fill="#a89a80">Same-data continuations and restarts are collapsed; horizontal extent is cumulative training exposure, not job count.</text>
</svg>
