<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc" font-family="Lato, sans-serif" data-figure-typography="lato-v1" data-figure-render-width="660">
  <title id="title">Calibrate once, transfer hyperparameters across scales</title>
  <desc id="desc">A compact two-stage schematic. A reference sweep tunes eight hyperparameters on a small model. At a target width D, batch size B, and token horizon T, four hyperparameters are transformed with B and T while four are reused unchanged. Optimizer transfer is independent of width D.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5b4a36" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7d68"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="328" rx="16" fill="#f6f0e4" stroke="#ddd3bf"/>
  <text x="28" y="35" font-size="23.258" font-weight="760" fill="#1f1e1b">Calibrate once, transfer hyperparameters across scales</text>

  <g filter="url(#shadow)">
    <rect x="24" y="50" width="390" height="265" rx="14" fill="#fffaf0" stroke="#d8ccb5"/>
  </g>
  <circle cx="49" cy="75" r="16" fill="#9c4f2f"/>
  <text x="49" y="81" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text>
  <text x="70" y="80" font-size="23.258" font-weight="760" fill="#1f1e1b">Tune on a small reference model</text>

  <rect x="46" y="97" width="346" height="61" rx="9" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="62" y="117" font-size="17.455" font-weight="750" letter-spacing="0.65" fill="#8a7d68">REFERENCE SETTING</text>
  <rect x="62" y="126" width="190" height="25" rx="12.5" fill="#fffaf0" stroke="#ddd3bf"/>
  <text x="157" y="143" text-anchor="middle" font-size="18.843" font-weight="700" fill="#3b3934">D₀ = 512 · ~25M</text>
  <rect x="260" y="126" width="116" height="25" rx="12.5" fill="#fffaf0" stroke="#ddd3bf"/>
  <text x="318" y="143" text-anchor="middle" font-size="18.843" font-weight="700" fill="#3b3934">2.5B tokens</text>

  <rect x="46" y="168" width="346" height="128" rx="9" fill="#fbf5e9" stroke="#e0d5c0"/>
  <text x="62" y="190" font-size="17.455" font-weight="750" letter-spacing="0.65" fill="#8a7d68">TUNED AT THE REFERENCE</text>
  <g font-size="17.851" font-weight="650" fill="#3b3934">
    <rect x="62" y="199" width="88" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="106" y="219" text-anchor="middle">Init scale</text>
    <rect x="156" y="199" width="90" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="201" y="219" text-anchor="middle">AdamH LR</text>
    <rect x="252" y="199" width="82" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="293" y="219" text-anchor="middle">Adam LR</text>
    <rect x="340" y="199" width="36" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="358" y="219" text-anchor="middle">β₁</text>
    <rect x="62" y="242" width="45" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="84.5" y="262" text-anchor="middle">β₂</text>
    <rect x="113" y="242" width="45" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="135.5" y="262" text-anchor="middle">ε</text>
    <rect x="164" y="242" width="120" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="224" y="262" text-anchor="middle">Gradient clip</text>
    <rect x="290" y="242" width="70" height="30" rx="15" fill="#e8f0ed" stroke="#c7d9d3"/>
    <text x="325" y="262" text-anchor="middle">Z-loss</text>
  </g>

  <path d="M 414 183 H 449" fill="none" stroke="#8a7d68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="421" y="151" width="36" height="23" rx="11.5" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="439" y="167" text-anchor="middle" font-size="20.811" font-weight="750" fill="#5b4a36">h₀</text>

  <g filter="url(#shadow)">
    <rect x="462" y="50" width="474" height="265" rx="14" fill="#fffaf0" stroke="#d8ccb5"/>
  </g>
  <circle cx="487" cy="75" r="16" fill="#2f6f63"/>
  <text x="487" y="81" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text>
  <text x="508" y="80" font-size="23.258" font-weight="760" fill="#1f1e1b">Apply at the target scale</text>

  <rect x="484" y="97" width="202" height="199" rx="9" fill="#e8f0ed" stroke="#c7d9d3"/>
  <text x="585" y="120" text-anchor="middle" font-size="17.455" font-weight="760" letter-spacing="0.6" fill="#5d756e">TRANSFORM WITH</text>
  <text x="585" y="140" text-anchor="middle" font-size="17.455" font-weight="760" letter-spacing="0.6" fill="#5d756e">B AND T</text>
  <text x="585" y="162" text-anchor="middle" font-size="18.248" fill="#5d756e">Independent of width D</text>
  <g font-size="17.851" font-weight="680" fill="#3b3934">
    <rect x="510" y="174" width="150" height="28" rx="14" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="585" y="193" text-anchor="middle">AdamH LR</text>
    <rect x="510" y="211" width="150" height="28" rx="14" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="585" y="230" text-anchor="middle">Adam LR</text>
    <rect x="535" y="248" width="48" height="28" rx="14" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="559" y="267" text-anchor="middle">ε</text>
    <rect x="589" y="248" width="48" height="28" rx="14" fill="#fffaf0" stroke="#c7d9d3"/>
    <text x="613" y="267" text-anchor="middle">β₂</text>
  </g>

  <rect x="698" y="97" width="216" height="199" rx="9" fill="#f2eadb" stroke="#e0d5c0"/>
  <text x="806" y="120" text-anchor="middle" font-size="17.455" font-weight="760" letter-spacing="0.6" fill="#8a7d68">REUSE UNCHANGED</text>
  <text x="806" y="146" text-anchor="middle" font-size="18.248" fill="#8a7d68">Carry forward from h₀</text>
  <g font-size="17.851" font-weight="680" fill="#3b3934">
    <rect x="724" y="178" width="112" height="30" rx="15" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="780" y="198" text-anchor="middle">Init scale</text>
    <rect x="844" y="178" width="44" height="30" rx="15" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="866" y="198" text-anchor="middle">β₁</text>
    <rect x="712" y="228" width="120" height="30" rx="15" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="772" y="248" text-anchor="middle">Gradient clip</text>
    <rect x="840" y="228" width="60" height="30" rx="15" fill="#fffaf0" stroke="#ddd3bf"/>
    <text x="870" y="248" text-anchor="middle">Z-loss</text>
  </g>
</svg>
