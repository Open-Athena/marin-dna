<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -10 1380 140" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .ink   { fill: #1f1e1b; }
      .muted { fill: #7a7a7a; }
      .label-bold { font-family: 'Open Sans', sans-serif; font-size: 22px; font-weight: 700; }
      .micro { font-family: 'Open Sans', sans-serif; font-size: 18px; }
      .span-label { font-family: 'Open Sans', sans-serif; font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <!-- ─── Cumulative training-subset spans, inverse-stacked ───
       Just the bars now (phylo-tree topology dropped). The bar widths
       and ordering already convey the nesting (animals ⊃ vertebrates
       ⊃ mammals ⊃ primates ⊃ humans). -->
  <g stroke="#1f1e1b" stroke-width="0.75">
    <rect x="60"  y="0"   width="900" height="18" fill="#fecf92"/>  <!-- animals     magma 0.90  (lightest) -->
    <rect x="60"  y="24"  width="640" height="18" fill="#f8765c"/>  <!-- vertebrates magma 0.71            -->
    <rect x="60"  y="48"  width="370" height="18" fill="#c03a76"/>  <!-- mammals     magma 0.53            -->
    <rect x="60"  y="72"  width="160" height="18" fill="#732081"/>  <!-- primates    magma 0.34            -->
    <rect x="60"  y="96"  width="40"  height="18" fill="#251255"/>  <!-- humans      magma 0.15  (darkest) -->
  </g>

  <!-- Bar labels: clade name + cumulative species count -->
  <g>
    <text x="970" y="14"  class="span-label ink">animals
      <tspan class="micro muted" font-weight="400"> (~499 sp.)</tspan>
    </text>
    <text x="710" y="38"  class="span-label ink">vertebrates
      <tspan class="micro muted" font-weight="400"> (~317 sp.)</tspan>
    </text>
    <text x="440" y="62"  class="span-label ink">mammals
      <tspan class="micro muted" font-weight="400"> (~81 sp.)</tspan>
    </text>
    <text x="230" y="86"  class="span-label ink">primates
      <tspan class="micro muted" font-weight="400"> (~11 sp.)</tspan>
    </text>
    <text x="110" y="110" class="span-label ink">humans
      <tspan class="micro muted" font-weight="400"> (1 sp.)</tspan>
    </text>
  </g>

  <!-- Caption on the left of the bar block, vertically centred on mammals -->
  <text class="label-bold ink" text-anchor="start">
    <tspan x="-90" y="50">train on</tspan>
    <tspan x="-90" y="72" class="micro muted">a cumulative</tspan>
    <tspan x="-90" y="90" class="micro muted">species subset</tspan>
  </text>
</svg>
