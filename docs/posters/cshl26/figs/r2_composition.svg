<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .ink   { fill: #1f1e1b; }
      .muted { fill: #7a7a7a; }
      .row-label { font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700; }
      .header    { font-family: 'Lato', sans-serif; font-size: 16px; font-weight: 700; }
      .promoter { fill: #0173b2; stroke: #1f1e1b; stroke-width: 1.2; }   /* Promoter blue   */
      .cds      { fill: #de8f05; stroke: #1f1e1b; stroke-width: 1.2; }   /* CDS orange      */
    </style>
  </defs>

  <!-- Header strip: tiny column hints -->
  <text x="80"  y="22" class="header muted" text-anchor="middle">line plot</text>
  <text x="288" y="22" class="header muted" text-anchor="middle">training condition</text>
  <text x="800" y="22" class="header muted" text-anchor="middle">training data mix (ratio)</text>

  <!-- All 4 bars share the same total width (700px from x=450 to x=1150).
       Bar widths encode RATIOS, not absolute amounts — sidesteps the
       "is uniform repeating promoter 5x or 9x" question entirely.
       Line-swatch colours mirror the line plot below (METHOD_COLORS in
       plots/cshl26_poster.py): Promoter-blue → olive (50/50) → dark
       gold (10/90) → CDS-orange. -->

  <!-- ─── Row 1: Promoter only — Promoter blue ─── -->
  <line x1="35" y1="60" x2="125" y2="60" stroke="#0173b2" stroke-width="3.5"/>
  <circle cx="80" cy="60" r="7" fill="#0173b2" stroke="#1f1e1b" stroke-width="1.1"/>
  <text x="160" y="68" class="row-label ink">Promoter only</text>
  <rect x="450" y="42" width="700" height="36" class="promoter"/>

  <!-- ─── Row 2: CDS only — CDS orange ─── -->
  <line x1="35" y1="120" x2="125" y2="120" stroke="#de8f05" stroke-width="3.5"/>
  <circle cx="80" cy="120" r="7" fill="#de8f05" stroke="#1f1e1b" stroke-width="1.1"/>
  <text x="160" y="128" class="row-label ink">CDS only</text>
  <rect x="450" y="102" width="700" height="36" class="cds"/>

  <!-- ─── Row 3: Proportional mix (10/90, 90% CDS) — dark gold ─── -->
  <line x1="35" y1="180" x2="125" y2="180" stroke="#c78c16" stroke-width="3.5"/>
  <circle cx="80" cy="180" r="7" fill="#c78c16" stroke="#1f1e1b" stroke-width="1.1"/>
  <text x="160" y="188" class="row-label ink">Proportional mix (10 / 90)</text>
  <rect x="450" y="162" width="70"  height="36" class="promoter"/>
  <rect x="520" y="162" width="630" height="36" class="cds"/>

  <!-- ─── Row 4: Uniform mix (50/50) — midpoint olive ─── -->
  <line x1="35" y1="240" x2="125" y2="240" stroke="#6f815b" stroke-width="3.5"/>
  <circle cx="80" cy="240" r="7" fill="#6f815b" stroke="#1f1e1b" stroke-width="1.1"/>
  <text x="160" y="248" class="row-label ink">Uniform mix (50 / 50)</text>
  <rect x="450" y="222" width="350" height="36" class="promoter"/>
  <rect x="800" y="222" width="350" height="36" class="cds"/>
</svg>
