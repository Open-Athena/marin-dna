          <text x="128" y="14">elephant</text>
          <text x="216" y="14">armadillo</text>
          <text x="304" y="14">cow</text>
          <text x="392" y="14">horse</text>
          <text x="480" y="14">mouse</text>
          <text x="568" y="14">lemur</text>
        </g>
      </g>
    </g>

