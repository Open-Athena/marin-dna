      <circle cx="40" cy="36" r="19" fill="#976F4A"/>
      <text x="40" y="42" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#FAFAF7">1</text>
      <text x="74" y="41" class="sans copper eyebrow">RETRIEVE RELATIVES</text>
      <text x="74" y="70" class="sans muted" font-size="16">Project a 255-base human locus to seven mammals</text>
      <text x="74" y="93" class="sans muted" font-size="16">through the Zoonomia alignment</text>
      <g transform="translate(74 106)">
        <rect x="0" y="0" width="80" height="20" rx="4" fill="#5B6F82" opacity="0.18"/>
        <rect x="88" y="0" width="80" height="20" rx="4" fill="#5B6F82" opacity="0.18"/>
        <rect x="176" y="0" width="80" height="20" rx="4" fill="#5B6F82" opacity="0.18"/>
