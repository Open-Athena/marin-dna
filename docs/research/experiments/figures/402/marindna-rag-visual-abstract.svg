        <text x="558" y="20" text-anchor="middle" class="mono ink" font-size="12">human₍₂₅₅₎</text>
      </g>
    </g>

    <path d="M360 316v18" stroke="#8B6340" stroke-width="2.4"/>
    <path d="m353 329 7 8 7-8" fill="none" stroke="#8B6340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 340)" filter="url(#shadow)">
      <rect width="720" height="130" rx="17" fill="#E8E0D5" fill-opacity="0.80" stroke="#AA9C8C"/>
      <circle cx="40" cy="35" r="19" fill="#976F4A"/>
      <text x="40" y="41" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#FAFAF7">3</text>
      <text x="74" y="40" class="sans copper eyebrow">CONDITION → SCORE</text>
      <text x="74" y="83" class="serif ink" font-size="25">P(human<tspan baseline-shift="sub" font-size="14">t</tspan> | ortholog context, human<tspan baseline-shift="sub" font-size="14">&lt;t</tspan>)</text>
      <text x="74" y="112" class="sans muted" font-size="15">Forward + reverse-complement scoring</text>
    </g>

    <text x="0" y="504" class="sans muted" font-size="13">Fixed offline retrieval · seven ortholog windows followed by the human window</text>
  </g>

