<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MarinDNA-RAG visual abstract</title>
  <desc id="desc">A visual abstract combining the MarinDNA-RAG method and results. A human locus is projected to seven mammals through the Zoonomia alignment, concatenated into a 2,048-token document, and scored by a causal genomic language model. Point plots compare MarinDNA-RAG 104M against GPN-Star M, MarinDNA-1B m5.1, and phyloP on official Mendelian, Complex, and SGE train splits. Capless error bars show plus or minus one standard error. Next directions are more species, more training steps, and more parameters.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1F1E1B" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="human" x1="0" x2="1">
      <stop offset="0" stop-color="#C49A6C" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#976F4A" stop-opacity="0.20"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Castoro, Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .ink { fill: #2D2D2D; }
      .body { fill: #3A3A3A; }
      .muted { fill: #6F6B65; }
      .copper { fill: #8B6340; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; }
      .label { font-size: 14px; font-weight: 700; }
      .value { font-size: 12px; font-weight: 700; }
      .tick { font-size: 11px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#C4B7A6"/>
  <circle cx="1515" cy="-25" r="220" fill="#E8E0D5" opacity="0.32"/>
  <circle cx="1570" cy="35" r="92" fill="#976F4A" opacity="0.09"/>

  <!-- Header -->
  <text x="70" y="76" class="serif ink" font-size="53">MarinDNA-RAG</text>
  <text x="70" y="112" class="sans body" font-size="21">Retrieve evolutionary context → condition a genomic language model → score human variants</text>
  <g transform="translate(1286 45)">
    <rect width="244" height="62" rx="31" fill="#2E2C29"/>
    <text x="122" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" letter-spacing="1.2" fill="#C49A6C">SMALL MODEL</text>
    <text x="122" y="46" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#E8E0D5">104M parameters · 30k updates</text>
  </g>

  <!-- Method schematic -->
  <g transform="translate(70 158)">
    <text x="0" y="0" class="sans copper eyebrow">METHOD</text>

    <g transform="translate(0 24)" filter="url(#shadow)">
