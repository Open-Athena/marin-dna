# SkyPilot task: train the one-hot ChromBPNet baseline on GM12878 DNase (#241, #259).
#
# Stages the GM12878 DNase inputs (ARSENAL Synapse syn72513540) + a chr-prefixed
# hg38 fasta (DART-Eval Synapse), then runs scripts/chrombpnet_eval/train_onehot.py.
# No gLM checkpoint — just the one-hot arm.
#
# No accessibility validation loop (#259): trains a fixed step budget (MAX_STEPS)
# with a WSD schedule and logs the caqtl/dsqtl QTL Pearson (+ qtl_avg_pearson) on
# a global-step cadence (QTL_EVERY, decoupled from epoch boundaries) — reusing the
# staged hg38 fasta with --qtl-chrom-prefix chr; needs HF access to the parquets.
#
# SMOKE=1 (default): tiny budget (~60 steps), logs every step — confirms the
# pipeline + W&B logging in a few minutes. SMOKE=0: the full run (MAX_STEPS).
#
# #259 all-chroms fixed-budget WSD baseline (warmup 0.01 / decay 0.2 → ~0; the
# stable phase reveals where the QTL curve plateaus → the budget N for the sweep).
# NB --all-chroms loads all 24 chroms' sequences into RAM → g5.xlarge's 16 GB OOMs
# in data setup; --memory 32+ picks g5.2xlarge (32 GB, verified), 64+ → g5.4xlarge:
#   sky launch -c cbp-259 scripts/chrombpnet_eval/sky/run_onehot.yaml --memory 32+ \
#     --env SYNAPSE_AUTH_TOKEN --env WANDB_API_KEY --env HF_TOKEN --env SMOKE=0 \
#     --env ALL_CHROMS=1 --env WANDB_NAME=dna-exp259-onehot-allchroms-wsd -i 30 --down

name: cbp-onehot

resources:
    infra: aws/us-east-2
    accelerators: A10G:1        # 24 GB; ~11 GB used at batch 64 fp32 (GPU-bound)
    disk_size: 200
    labels:
        project: dna

workdir: .

envs:
    SMOKE: "1"
    BATCH: "128"                # bf16/128 is the A10G sweet spot (#241); fp32/64 = faithful
    PRECISION: "bf16-mixed"     # bf16-safe forward; faster on the GPU-bound conv tower
    ALL_CHROMS: "0"             # #259: "1" trains on all 1-22,X,Y (not leakage; VEP zero-shot)
    NO_BIAS: "0"                # #259 ablation: "1" drops the Tn5/DNase bias entirely
    SAME_PAD: "0"               # #259: "1" = zero-padded variant (out_window scales w/ in_window, constant params; no bias)
    ALPHAGENOME: "0"            # #259: "1" = AlphaGenome/Borzoi per-base head + Poisson-Multinomial loss + target scaling (no bias)
    PERBASE_MSE: "0"            # #259: "1" = simplest per-base head + MSE on log1p(per-base counts) (no bias)
    N_SEGMENTS: "1"             # Poisson-Multinomial segments; 1 = full-window total (AlphaGenome's 8 is for their ~1Mb outputs)
    MULTINOMIAL_WEIGHT: "5.0"   # AlphaGenome multinomial-term weight (Borzoi default)
    COUNT_ONLY: "0"             # #259 ablation: "1" = count head only (beta=0, no profile NLL)
    COUNT_LOSS: "mse_log"       # #259 loss form: mse_log (official) | poisson
    COUNT_WEIGHT_SCALE: "1.0"   # #259: multiply the count-loss weight (alpha); sweeps the two-loss balance
    OPTIMIZER: "adam"           # adam (official) | adamw (#259, decoupled weight decay)
    WEIGHT_DECAY: "0.0"         # weight decay (#259)
    IN_WINDOW: "2114"           # #259 context size: 255 = gLM-native (set OUT_WINDOW/N_LAYERS to match)
    OUT_WINDOW: "1000"          # profile output; 255bp/N_LAYERS=5 -> 35
    N_LAYERS: "8"               # dilated layers; fewer for short context (255bp -> 5)
    N_FILTERS: "512"            # #259 capacity knob; params ~n_filters^2 (362=half, 724=double)
    JITTER: "500"               # random-crop jitter; shrink for short context (255bp -> 25)
    MAX_STEPS: "12000"          # fixed step budget (#259); SMOKE caps to ~60
    LR_SCHEDULER: "wsd"         # none (constant) | wsd (#259 Warmup-Stable-Decay)
    QTL_EVERY: "500"            # log the QTL metric every N global steps (decoupled from epochs)
    WANDB_NAME: "dna-exp259-onehot-allchroms-wsd"
    WANDB_MODE: "online"
    WANDB_API_KEY: ""           # pass via `sky launch --env WANDB_API_KEY`
    SYNAPSE_AUTH_TOKEN: ""      # pass via `sky launch --env SYNAPSE_AUTH_TOKEN`
    HF_TOKEN: ""                # pass via `--env HF_TOKEN` (caqtl/dsqtl parquets)

setup: |
    set -euxo pipefail
    command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --extra chrombpnet

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export WANDB_MODE="${WANDB_MODE:-online}"
    cd ~/sky_workdir
    mkdir -p data

    # GM12878 DNase inputs (ARSENAL Synapse) + chr-prefixed hg38 fasta (DART-Eval).
    # `set +x` around the curl so `set -x` doesn't echo the bearer token to logs.
    syn() {
        test -s "$2" && return 0
        { set +x; } 2>/dev/null
        curl -fsSL -H "Authorization: Bearer $SYNAPSE_AUTH_TOKEN" \
            "https://repo-prod.prod.sagebase.org/repo/v1/entity/$1/file" -o "$2"
        set -x
    }
    syn syn73665410 data/gm12878_peaks.bed
    syn syn73665411 data/gm12878_nonpeaks.bed
    syn syn73665418 data/GM12878_unstranded.bw
    syn syn73665413 data/bias_model_scaled.h5
    syn syn60756064 data/GRCh38.fasta
    syn syn62284997 data/GRCh38.fasta.fai
    test -s data/hg38.chrom.sizes || curl -fsSL \
        "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.chrom.sizes" -o data/hg38.chrom.sizes

    nvidia-smi
    # Base args + #259 knobs. SMOKE caps to a tiny budget; otherwise MAX_STEPS.
    ARGS="--batch-size $BATCH --num-workers 4 --precision $PRECISION --lr-scheduler $LR_SCHEDULER --optimizer $OPTIMIZER --weight-decay $WEIGHT_DECAY --count-loss $COUNT_LOSS --count-weight-scale $COUNT_WEIGHT_SCALE --in-window $IN_WINDOW --out-window $OUT_WINDOW --n-layers $N_LAYERS --n-filters $N_FILTERS --jitter $JITTER"
    [ "$ALL_CHROMS" = "1" ] && ARGS="$ARGS --all-chroms"
    [ "$NO_BIAS" = "1" ] && ARGS="$ARGS --no-bias"
    [ "$COUNT_ONLY" = "1" ] && ARGS="$ARGS --count-only"
    # The same-pad and AlphaGenome variants (#259) have no bias model: omit --bias.
    BIAS_ARG="--bias data/bias_model_scaled.h5"
    [ "$SAME_PAD" = "1" ] && { ARGS="$ARGS --same-pad"; BIAS_ARG=""; }
    [ "$ALPHAGENOME" = "1" ] && { ARGS="$ARGS --alphagenome --n-segments $N_SEGMENTS --multinomial-weight $MULTINOMIAL_WEIGHT"; BIAS_ARG=""; }
    [ "$PERBASE_MSE" = "1" ] && { ARGS="$ARGS --perbase-mse"; BIAS_ARG=""; }
    if [ "$SMOKE" = "1" ]; then
        ARGS="$ARGS --log-every-n-steps 1 --qtl-every-steps 20 --limit-train-batches 300 --max-steps 60"
    else
        ARGS="$ARGS --qtl-every-steps $QTL_EVERY --max-steps $MAX_STEPS"
    fi
    uv run --extra chrombpnet python scripts/chrombpnet_eval/train_onehot.py \
        --peaks data/gm12878_peaks.bed --nonpeaks data/gm12878_nonpeaks.bed \
        --bigwig data/GM12878_unstranded.bw $BIAS_ARG \
        --fasta data/GRCh38.fasta --chrom-sizes data/hg38.chrom.sizes \
        --qtl-eval --qtl-genome data/GRCh38.fasta --qtl-chrom-prefix chr \
        --wandb-name "$WANDB_NAME" --out-dir runs/onehot $ARGS
