# SkyPilot task: iter3 variant-type transfer matrix for one model (one cluster per model).
#   sky launch scripts/issue314/iter3_transfer.yaml -c vep-xfer-exp135 -y --env MODEL=exp135-1B-m5.1
name: vep-transfer

resources:
    infra: aws/us-east-2
    cpus: 8+
    memory: 32+
    use_spot: false
    labels:
        project: dna

workdir: .

envs:
    MODEL: "exp135-1B-m5.1"

setup: |
    set -euxo pipefail
    command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --frozen --group genome-s3

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=1
    uv run --group genome-s3 python scripts/issue314/iter3_transfer.py \
        --cache "s3://oa-bolinas/analysis/issue314/embeddings/${MODEL}/mendelian_traits" \
        --out "s3://oa-bolinas/analysis/issue314/iter3_transfer" \
        --model "${MODEL}"
