# SkyPilot task: ref-context ablation on mendelian — signed delta vs concat(ref, delta),
# nested-LOCO, per-chrom. Does adding the local-context (ref) term help the signed effect?
#   sky launch scripts/issue314/refdelta_probe.yaml -c vep-rd-exp135 -y --env MODEL=exp135-1B-m5.1
name: vep-refdelta

resources:
    infra: aws/us-east-2
    cpus: 8+
    memory: 32+
    use_spot: false
    labels:
        project: dna

workdir: .

envs:
    MODEL: "exp135-1B-m5.1"

setup: |
    set -euxo pipefail
    command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --frozen --group genome-s3

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=1
    uv run --group genome-s3 python scripts/issue314/iter2_nested.py \
        --cache "s3://oa-bolinas/analysis/issue314/embeddings/${MODEL}/mendelian_traits" \
        --out "s3://oa-bolinas/analysis/issue314/iter2_nested_refdelta" \
        --model "${MODEL}" --refdelta
