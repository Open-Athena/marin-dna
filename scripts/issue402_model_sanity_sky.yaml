# SkyPilot task: run frozen issue-402 behavioral diagnostics for one checkpoint.
# Launch only from a commit containing scripts/issue402_model_sanity.py.

name: dna-exp402-model-sanity

resources:
  infra: aws/us-east-2
  accelerators: A10G:1
  disk_size: 100
  labels:
    project: dna
  any_of:
    - use_spot: true
    - use_spot: false

workdir: .

envs:
  CHECKPOINT_URI: ""
  OUTPUT_URI: ""
  MODEL_LABEL: ""
  CODE_REVISION: ""
  BATCH_SIZE: "8"
  VEP_BATCH_SIZE: "16"
  VALIDATION_ROWS: "2048"
  ABLATION_ROWS: "512"
  ATTENTION_ROWS: "4"
  N_BOOTSTRAP: "1000"

file_mounts:
  ~/.config/gcloud/application_default_credentials.json: ~/.config/gcloud/application_default_credentials.json

setup: |
  set -euxo pipefail
  export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  if ! command -v gcloud >/dev/null 2>&1; then
    curl -fsSL https://sdk.cloud.google.com > /tmp/gcloud-install.sh
    bash /tmp/gcloud-install.sh --disable-prompts --install-dir="$HOME"
  fi
  uv sync --frozen --no-dev

run: |
  set -euxo pipefail
  export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
  export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
  export WANDB_DISABLED=true
  test -n "$CHECKPOINT_URI"
  test -n "$OUTPUT_URI"
  test "$MODEL_LABEL" = "46M" -o "$MODEL_LABEL" = "104M"
  test "${#CODE_REVISION}" -eq 40
  test "$BATCH_SIZE" -gt 1
  test "$VEP_BATCH_SIZE" -gt 0
  test "$VALIDATION_ROWS" -gt 1
  test "$ABLATION_ROWS" -gt 1
  test "$ATTENTION_ROWS" -gt 0
  nvidia-smi

  CHECKPOINT_DIR="$HOME/issue402-checkpoint"
  RESULTS_DIR="$HOME/issue402-sanity-results"
  mkdir -p "$CHECKPOINT_DIR" "$RESULTS_DIR"
  gcloud storage rsync "$CHECKPOINT_URI" "$CHECKPOINT_DIR" --recursive
  test -s "$CHECKPOINT_DIR/config.json"
  test -s "$CHECKPOINT_DIR/model.safetensors"
  test -s "$CHECKPOINT_DIR/tokenizer.json"

  uv run --no-dev python scripts/issue402_model_sanity.py \
    --model "$CHECKPOINT_DIR" \
    --model-source "$CHECKPOINT_URI" \
    --model-label "$MODEL_LABEL" \
    --code-revision "$CODE_REVISION" \
    --output-dir "$RESULTS_DIR" \
    --batch-size "$BATCH_SIZE" \
    --vep-batch-size "$VEP_BATCH_SIZE" \
    --validation-rows "$VALIDATION_ROWS" \
    --ablation-rows "$ABLATION_ROWS" \
    --attention-rows "$ATTENTION_ROWS" \
    --n-bootstrap "$N_BOOTSTRAP" \
    --device cuda
  test -s "$RESULTS_DIR/manifest.json"
  test -s "$RESULTS_DIR/validation_position_loss.parquet"
  test -s "$RESULTS_DIR/attention_alignment.parquet"
  test -s "$RESULTS_DIR/vep_special_token_diagnostics.parquet"
  test -s "$RESULTS_DIR/vep/mendelian_traits/bos_to_pad/metrics.parquet"
  test -s "$RESULTS_DIR/vep/mendelian_traits/human_only/metrics.parquet"
  test -s "$RESULTS_DIR/vep/complex_traits/all_n/metrics.parquet"
  test -s "$RESULTS_DIR/vep/complex_traits/seq_to_unk/metrics.parquet"
  test -s "$RESULTS_DIR/vep/sge/human_only/metrics.parquet"
  gcloud storage rsync "$RESULTS_DIR" "$OUTPUT_URI" --recursive
