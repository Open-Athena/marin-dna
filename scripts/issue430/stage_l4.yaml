# Stage one AWS g6.2xlarge L4 for issue #430 without starting a benchmark.
#
# Subsequent benchmark iterations use `sky exec` so the checkpoint,
# environment, and compiled caches stay warm. The cluster is explicitly
# terminated when the L4 stage completes.

name: dna-issue430-l4-stage

resources:
  cloud: aws
  region: us-east-2
  instance_type: g6.2xlarge
  use_spot: false
  disk_size: 128
  labels:
    project: dna

workdir: .

envs:
  CHECKPOINT_HF: marin-dna/marin-dna-exp135-m5.1
  CHECKPOINT_REVISION: c0676b2012b8b9c526deb26ff517f6b92b6d375d

setup: |
  set -euxo pipefail

  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  ISSUE430_HF_PROJECT=scripts/issue430/environments/hf_torchao
  uv sync --project "$ISSUE430_HF_PROJECT" --frozen
  uv run --project "$ISSUE430_HF_PROJECT" --no-sync python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='$CHECKPOINT_HF', revision='$CHECKPOINT_REVISION', local_dir='$HOME/ckpt')"

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export CUDA_VISIBLE_DEVICES=0
  ISSUE430_HF_PROJECT=scripts/issue430/environments/hf_torchao
  nvidia-smi
  uname -m
  uv run --project "$ISSUE430_HF_PROJECT" --no-sync python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))"
  test -f "$HOME/ckpt/config.json"
