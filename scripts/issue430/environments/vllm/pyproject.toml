[project]
name = "issue430-vllm-runtime"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==3.6.0",
    "einops==0.8.2",
    "jaxtyping==0.3.9",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scikit-learn==1.8.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchao==0.16.0",
    "torchvision==0.25.0",
    "transformers==4.57.6",
    "vllm==0.18.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchao = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
