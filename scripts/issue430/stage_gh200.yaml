# Stage the warm Lambda GH200 for issue #430 without starting a benchmark.
#
# Re-run this task with `sky launch -c dna-issue430-gh200` when setup or file
# mounts change. Subsequent benchmark iterations should use `sky exec` so the
# checkpoint, environment, and compiled caches stay warm.

name: dna-issue430-gh200-stage

resources:
  accelerators: GH200:1
  cloud: lambda
  disk_size: 128
  labels:
    project: dna

workdir: .

envs:
  CHECKPOINT_HF: marin-dna/marin-dna-exp135-m5.1
  CHECKPOINT_REVISION: c0676b2012b8b9c526deb26ff517f6b92b6d375d

setup: |
  set -euxo pipefail

  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"

  if ! dpkg -s libcurl4-openssl-dev >/dev/null 2>&1; then
    sudo apt-get update -qq
    sudo apt-get install -y -qq libcurl4-openssl-dev
  fi

  uv sync --frozen
  if ! uv run python -c "import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null; then
    uv pip install --reinstall "torch==2.10.0" --index-url https://download.pytorch.org/whl/cu128
  fi

  uv run --no-sync python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='$CHECKPOINT_HF', revision='$CHECKPOINT_REVISION', local_dir='$HOME/ckpt')"

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export CUDA_VISIBLE_DEVICES=0
  nvidia-smi
  uv run --no-sync python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name(0))"
  test -f "$HOME/ckpt/config.json"
