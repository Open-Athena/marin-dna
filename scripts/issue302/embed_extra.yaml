# issue #302 — extract the EXTRA per-variant embeddings (beyond Mendelian missense):
#   (1) Mendelian splicing + synonymous   -> embeddings_mend_cds/
#   (2) Complex-traits missense           -> embeddings_complex_missense/
# across the full 8-rung scaling-v0.5 ladder. Each model is downloaded once and
# used for BOTH extractions (checkpoint download is the per-model overhead).
# Self-contained + self-tearing-down (--down) so it finishes unattended; the driver
# uploads each model's npz to S3 as it completes, so artifacts survive teardown.
#
# Launch (autonomous, downs when idle after the run):
#   sky launch scripts/issue302/embed_extra.yaml -c emb302b -y -d --down -i 20

name: emb302b

resources:
    infra: aws/us-east-2
    accelerators: A10G:1
    disk_size: 200
    labels:
        project: dna
    any_of:
      - use_spot: true
      - use_spot: false

workdir: .

envs:
    LIMIT: "0"
    MODELS: "scaling-v0.5-46M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h640-p46M-step-215573;scaling-v0.5-76M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h768-p76M-step-215573;scaling-v0.5-128M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h896-p128M-step-215573;scaling-v0.5-255M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h1152-p255M-step-215573;scaling-v0.5-476M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h1408-p476M-step-215573;scaling-v0.5-1B=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h1920-p1B-step-215573;scaling-v0.5-2B=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h2432-p2B-step-215573;scaling-v0.5-4B=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h2944-p4B-step-215573"
    MEND_DS: "bolinas-dna/evals_mendelian_traits"
    MEND_REV: "4aed58e50c5dea0b878a665007af2ef9e5108e9f"
    COMPLEX_DS: "bolinas-dna/evals_complex_traits"
    COMPLEX_REV: "22f86a89c65cb8f3007ac3cc2739f40efefa4340"
    OUT_MEND: "s3://oa-bolinas/analysis/issue302/embeddings_mend_cds"
    OUT_COMPLEX: "s3://oa-bolinas/analysis/issue302/embeddings_complex_missense"

setup: |
    set -euxo pipefail
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --frozen --group genome-s3

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export WANDB_DISABLED=true

    lim=""
    [ "$LIMIT" != "0" ] && lim="--limit $LIMIT"
    IFS=';' read -ra ENTRIES <<< "$MODELS"
    for entry in "${ENTRIES[@]}"; do
        name="${entry%%=*}"
        s3="${entry#*=}"
        echo "=== $name : Mendelian splicing+synonymous ==="
        uv run --group genome-s3 python scripts/issue302/extract_variant_embeddings.py \
            --s3_path "$s3" --name "$name" --out "$OUT_MEND" \
            --subset "splicing,synonymous_variant" --dataset "$MEND_DS" --revision "$MEND_REV" $lim
        echo "=== $name : Complex-traits missense ==="
        uv run --group genome-s3 python scripts/issue302/extract_variant_embeddings.py \
            --s3_path "$s3" --name "$name" --out "$OUT_COMPLEX" \
            --subset "missense_variant" --dataset "$COMPLEX_DS" --revision "$COMPLEX_REV" $lim
    done
    echo "ALL EXTRACTIONS DONE"
