# issue #302 — extract per-variant ref/alt embeddings for the scaling-v0.5 ladder.
#
# Pulls HF checkpoints + the GRCh38 genome directly from S3 (instance-role creds;
# no GCS/gcloud needed — the evals_v2 pipeline already cached the checkpoints to
# s3://oa-bolinas/.../results/checkpoints/). Loops over $MODELS
# ("name=s3_path;name=s3_path;..."), each: download checkpoint, extract ref/alt
# center-pooled FWD+RC embeddings at {1/4,1/2,3/4,last} layers, upload npz+keys.
#
# Smoke (default env): 128M, --limit 50.   Full run (override on exec):
#   sky launch scripts/issue302/embed.yaml -c emb302          # smoke
#   sky exec   emb302 scripts/issue302/embed.yaml \           # full ladder
#     --env LIMIT=0 \
#     --env MODELS="scaling-v0.5-128M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h896-p128M-step-215573;scaling-v0.5-1B=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h1920-p1B-step-215573;scaling-v0.5-4B=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h2944-p4B-step-215573"

name: emb302

resources:
    infra: aws/us-east-2
    accelerators: A10G:1
    disk_size: 200
    labels:
        project: dna
    any_of:
      - use_spot: true
      - use_spot: false

workdir: .

envs:
    MODELS: "scaling-v0.5-128M=s3://oa-bolinas/snakemake/analysis/evals_v2/results/checkpoints/scaling-v0.5-h896-p128M-step-215573"
    LIMIT: "50"
    OUT: "s3://oa-bolinas/analysis/issue302/embeddings"
    # subset/dataset default to Mendelian missense (back-compat). Override on exec:
    #   Mendelian splice+syn: --env SUBSET="splicing,synonymous_variant" --env OUT=.../embeddings_mend_cds
    #   Complex missense: --env SUBSET=missense_variant --env DATASET=bolinas-dna/evals_complex_traits
    #     --env REVISION=22f86a89c65cb8f3007ac3cc2739f40efefa4340 --env OUT=.../embeddings_complex_missense
    SUBSET: "missense_variant"
    DATASET: "bolinas-dna/evals_mendelian_traits"
    REVISION: "4aed58e50c5dea0b878a665007af2ef9e5108e9f"

setup: |
    set -euxo pipefail
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    export PATH="$HOME/.local/bin:$PATH"
    # --group genome-s3 pulls s3fs so pyfaidx reads the GRCh38 reference from S3.
    uv sync --frozen --group genome-s3

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    export WANDB_DISABLED=true

    lim=""
    [ "$LIMIT" != "0" ] && lim="--limit $LIMIT"
    IFS=';' read -ra ENTRIES <<< "$MODELS"
    for entry in "${ENTRIES[@]}"; do
        name="${entry%%=*}"
        s3="${entry#*=}"
        echo "=== extracting $name from $s3 (subset=$SUBSET dataset=$DATASET) ==="
        uv run --group genome-s3 python scripts/issue302/extract_variant_embeddings.py \
            --s3_path "$s3" --name "$name" --out "$OUT" \
            --subset "$SUBSET" --dataset "$DATASET" --revision "$REVISION" $lim
    done
