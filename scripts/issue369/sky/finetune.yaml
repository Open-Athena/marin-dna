name: dna-issue369-finetune

# LoRA missense fine-tuning (#369). One A10G box; reuse across runs via `sky exec`.
# Baselines (CPU probe fits) and the smoke/dev/nested modes all run through the same
# driver. Pass the driver args via --env RUN_ARGS="...".
#
# Launch (smoke):
#   sky launch -c dna-ft scripts/issue369/sky/finetune.yaml \
#     --env RUN_ARGS="--model 255M --mode smoke --out s3://oa-bolinas/analysis/issue369"
# Reuse the same box for a real run:
#   sky exec dna-ft scripts/issue369/sky/finetune.yaml \
#     --env RUN_ARGS="--model 255M --mode dev --seeds 0,1,2 --out s3://oa-bolinas/analysis/issue369"

resources:
    infra: aws/us-east-2
    accelerators: A10G:1        # g5.xlarge, 24 GB — fits <=1B; 4B needs A100
    disk_size: 200
    labels:
        project: dna
    any_of:                     # spot, fall back to on-demand
        - use_spot: true
        - use_spot: false

workdir: .

envs:
    RUN_ARGS: "--model 255M --mode smoke --out s3://oa-bolinas/analysis/issue369"

setup: |
    set -euxo pipefail
    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    grep -q '.local/bin' "$HOME/.bashrc" || \
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
    export PATH="$HOME/.local/bin:$PATH"
    uv sync --group genome-s3

run: |
    set -euxo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    nvidia-smi || true
    uv run python -c "import torch; print('CUDA', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU-ONLY')"
    uv run pytest tests/finetune -q
    uv run python scripts/issue369/run_finetune.py $RUN_ARGS
