[project]
name = "train-tiny-dna"
version = "0.1.0"
description = "Minimal local-CPU DNA language-model training example with Marin"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Keep the public tutorial on one known-compatible Marin build. The lockfile
    # pins the transitive Iris, Rigging, Haliax, and Zephyr packages.
    "marin-core==0.2.63.dev30434547163",
    "marin-fray==0.2.63.dev30434547163",
    "marin-levanter==0.2.63.dev30434547163",
    # marin.processing.tokenize imports the dupekit-backed normalization module.
    "marin-dupekit==0.1.1",
    # Use Marin's tested CPU JAX version without pulling the unrelated
    # torch/torchvision stack into this small example.
    "jax==0.10.1",
]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
# Marin's standalone consumers mirror these resolution constraints from the
# upstream workspace.
override-dependencies = [
    "omegaconf>=2.4.0.dev4",
    "antlr4-python3-runtime==4.11",
    "python-multipart>=0.0.27",
    "wheel>=0.46.2",
    "datasets>=3.1.0,<5.0.0",
    "equinox>=0.11.10",
]

# marin-core depends on resiliparse>=0.17.2, published on Marin's index.
[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }
