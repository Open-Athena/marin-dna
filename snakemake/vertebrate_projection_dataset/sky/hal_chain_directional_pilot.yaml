name: issue-523-hal-chain-directional-pilot

# Direction-matched regional smoke gate followed, when requested, by one
# whole-genome baboon candidate. On-demand avoids losing the 1.26-TB staged HAL.
resources:
  infra: aws/us-east-2
  instance_type: r6id.12xlarge
  disk_size: 100
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""
  TARGET: smoke
  DRY_RUN: "0"
  DURABLE_OUTPUTS: "0"

setup: |
  set -euxo pipefail

  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null | awk '{print $1, $2}' || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  test "$(uv --version | awk '{print $1, $2}')" = "uv 0.11.31"
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict

  CACTUS_VERSION=3.3.0
  CACTUS_DIR="$HOME/cactus-bin-v${CACTUS_VERSION}"
  if [ ! -d "$CACTUS_DIR" ]; then
    curl -fsSL -o /tmp/cactus.tar.gz \
      "https://github.com/ComparativeGenomicsToolkit/cactus/releases/download/v${CACTUS_VERSION}/cactus-bin-v${CACTUS_VERSION}.tar.gz"
    tar -xzf /tmp/cactus.tar.gz -C "$HOME"
    rm /tmp/cactus.tar.gz
  fi
  UCSC_KENT_VERSION=482
  UCSC_KENT_DIR="$HOME/ucsc-kent-v${UCSC_KENT_VERSION}"
  if [ ! -d "$UCSC_KENT_DIR" ]; then
    conda create --yes --prefix "$UCSC_KENT_DIR" --channel conda-forge --channel bioconda \
      "ucsc-axtchain=${UCSC_KENT_VERSION}" \
      "ucsc-fatotwobit=${UCSC_KENT_VERSION}" \
      "ucsc-liftover=${UCSC_KENT_VERSION}" \
      "ucsc-pslpostarget=${UCSC_KENT_VERSION}" \
      "ucsc-pslswap=${UCSC_KENT_VERSION}" \
      "ucsc-twobitinfo=${UCSC_KENT_VERSION}"
  fi
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$HOME/cactus-bin-v3.3.0/bin:$HOME/ucsc-kent-v482/bin:$PATH"
  export LD_LIBRARY_PATH="$HOME/cactus-bin-v3.3.0/lib:${LD_LIBRARY_PATH:-}"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  command -v aws
  command -v halLiftover
  command -v halStats
  command -v hal2fasta
  command -v pslSwap
  command -v pslPosTarget
  command -v axtChain
  command -v liftOver
  test -x /usr/bin/time
  test -n "$PIPELINE_COMMIT_SHA"
  test "$DURABLE_OUTPUTS" = "0" -o "$DURABLE_OUTPUTS" = "1"
  case "$TARGET" in
    tests|smoke|full_baboon) ;;
    *)
      echo "ERROR: unsupported direction-matched HAL-chain target $TARGET"
      exit 1
      ;;
  esac
  if [ "$TARGET" = "smoke" ]; then
    test "$DURABLE_OUTPUTS" = "0"
  elif [ "$TARGET" = "full_baboon" ]; then
    test "$DURABLE_OUTPUTS" = "1"
  fi

  if [ "$TARGET" = "tests" ]; then
    cd snakemake/vertebrate_projection_dataset
    uv run --locked pytest
    exit 0
  fi

  if ! mountpoint -q /mnt/nvme; then
    sudo apt-get update
    sudo apt-get install -y mdadm time
    NVMES=$(lsblk -dn -o NAME,TYPE,MOUNTPOINT | awk '$2=="disk" && $3=="" && $1 ~ /^nvme[1-9]/ {print "/dev/"$1}')
    N_NVME=$(echo "$NVMES" | wc -w)
    if [ "$N_NVME" -ge 2 ]; then
      sudo mdadm --create /dev/md0 --level=0 --raid-devices="$N_NVME" $NVMES --force --run
      DEV=/dev/md0
    elif [ "$N_NVME" -eq 1 ]; then
      DEV=$NVMES
    else
      echo "ERROR: r6id instance-store NVMe devices were not found"
      exit 1
    fi
    sudo mkfs.ext4 -F -E nodiscard "$DEV"
    sudo mkdir -p /mnt/nvme
    sudo mount -o noatime "$DEV" /mnt/nvme
    sudo chown ubuntu:ubuntu /mnt/nvme
  fi

  TOTAL_BYTES=$(df --output=size -B1 /mnt/nvme | tail -n 1)
  test "$TOTAL_BYTES" -ge 2500000000000
  AVAILABLE_KIB=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
  test "$AVAILABLE_KIB" -ge 350000000
  df -h /mnt/nvme
  free -h

  aws s3api head-object \
    --bucket oa-bolinas \
    --key staging/447-mammalian-2022v1.hal \
    --query ContentLength \
    --output text

  RESULTS_LINK="snakemake/vertebrate_projection_dataset/results"
  RESULTS_NVME="/mnt/nvme/vertebrate_projection/results"
  mkdir -p "$RESULTS_NVME" "$(dirname "$RESULTS_LINK")"
  if [ -e "$RESULTS_LINK" ] && [ ! -L "$RESULTS_LINK" ]; then
    echo "ERROR: refusing to replace non-symlink results path $RESULTS_LINK"
    exit 1
  fi
  ln -sfn "$RESULTS_NVME" "$RESULTS_LINK"

  SNAKEMAKE_LINK="snakemake/vertebrate_projection_dataset/.snakemake"
  SNAKEMAKE_NVME=/mnt/nvme/vertebrate_projection/_snakemake
  mkdir -p "$SNAKEMAKE_NVME"
  if [ -e "$SNAKEMAKE_LINK" ] && [ ! -L "$SNAKEMAKE_LINK" ]; then
    echo "ERROR: refusing to replace non-symlink state path $SNAKEMAKE_LINK"
    exit 1
  fi
  ln -sfn "$SNAKEMAKE_NVME" "$SNAKEMAKE_LINK"

  test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
  SNAKEMAKE_MODE=()
  if [ "$DRY_RUN" = "1" ]; then
    SNAKEMAKE_MODE+=(--dry-run)
  fi
  SNAKEMAKE_PROFILE=()
  if [ "$DURABLE_OUTPUTS" = "1" ]; then
    SNAKEMAKE_PROFILE+=(--profile workflow/profiles/default)
  else
    SNAKEMAKE_PROFILE+=(--default-storage-provider fs --default-storage-prefix "")
  fi

  cd snakemake/vertebrate_projection_dataset
  uv run --locked snakemake "$TARGET" "${SNAKEMAKE_MODE[@]}" \
    --snakefile workflow/hal_chains_directional.Snakefile \
    "${SNAKEMAKE_PROFILE[@]}" \
    --cores 48 \
    --resources mem_mb=360000 chain_generation=2 genome_assets=2 full_grid_liftover=1 \
    --rerun-incomplete \
    --printshellcmds
