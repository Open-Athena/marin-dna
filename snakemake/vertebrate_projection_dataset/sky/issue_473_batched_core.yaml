name: issue-473-batched-core-projection

# Additive acceleration for the two decision-relevant full-scale policies.
# It creates one namespaced HAL request and invokes halLiftover once per target
# species, scans every MAF chromosome once, then lets the unchanged downstream
# contract/QC rules consume the split raw outputs. Optional pilot policies are
# intentionally absent from this target.
resources:
  infra: aws/us-east-2
  instance_type: c6id.12xlarge
  disk_size: 100
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""
  DRY_RUN: "0"

setup: |
  set -euxo pipefail
  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh \
      https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  test "$(uv --version)" = "uv 0.11.31"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"
  test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
  cd snakemake/vertebrate_projection_dataset

  MODE=()
  if [ "$DRY_RUN" = "1" ]; then
    MODE+=(--dry-run)
  fi

  COMMON=(
    --profile workflow/profiles/default
    --config tier=full add_reverse_complement=true max_validation_rows=16384 split_seed=42
    --cores 48
    --resources mem_mb=90000 ucsc_downloads=4 final_large_scan=1 hf_uploads=1
    --rerun-incomplete
    --printshellcmds
  )

  # Phase 1 constructs only the two fixed request tables. Existing immutable
  # source staging is reused by its content-verified local receipts.
  uv run --locked snakemake issue_473_fixed_core_requests \
    --snakefile workflow/Snakefile \
    "${COMMON[@]}" "${MODE[@]}"

  # Phase 2 is a standalone Snakefile, so no old rule competes to produce the
  # split raw paths. Its manifest closes only after 107 HAL and 24 MAF receipts.
  uv run --locked snakemake issue_473_batched_core_prefill \
    --snakefile workflow/Issue473BatchedCore.smk \
    "${COMMON[@]}" "${MODE[@]}"

  # Phase 3 uses every established fragment, contract, sequence, QC, manual
  # inspection, and split rule unchanged. Prefilled raw artifacts make the old
  # per-policy alignment calls unnecessary in this producer namespace.
  uv run --locked snakemake issue_473_fixed_core_projection_experiment \
    --snakefile workflow/Snakefile \
    "${COMMON[@]}" \
    --set-resources \
      issue_473_fixed_hal_fragments:mem_mb=6000 \
      issue_473_fixed_hal_contract:mem_mb=6000 \
      issue_473_fixed_hal_sequences:mem_mb=4000 \
      issue_473_fixed_multiz_contract:mem_mb=4000 \
      issue_473_fixed_merge_multiz_accepted:mem_mb=4000 \
      issue_473_fixed_merge_multiz_rejected:mem_mb=4000 \
    "${MODE[@]}"
