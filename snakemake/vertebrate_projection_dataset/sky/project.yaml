name: vertebrate-chain-projection

# Review the DAG, input sizes, and budget before choosing worker resources.
# The default performs a dry-run only; no HAL or MultiZ staging is reachable.
resources:
  infra: aws/us-east-2
  cpus: 4+
  memory: 40+
  use_spot: true
  disk_size: 500
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""
  CONFIG_FILE: config/config.yaml
  TARGET: all
  DRY_RUN: "1"
  CORES: "4"
  MEM_MB: "32000"

setup: |
  set -euo pipefail
  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict
  uv sync --project snakemake/vertebrate_projection_dataset --locked --group dev

run: |
  set -euo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"
  test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
  case "$TARGET" in all|all_projections) ;; *) echo "Unsupported projection target: $TARGET"; exit 1 ;; esac
  cd snakemake/vertebrate_projection_dataset
  uv run --locked snakemake "$TARGET" --dry-run \
    --profile workflow/profiles/default --configfile "$CONFIG_FILE" \
    --cores "$CORES" --resources mem_mb="$MEM_MB" final_large_scan=1 hf_uploads=1
  if [ "$DRY_RUN" = "0" ]; then
    uv run --locked snakemake "$TARGET" \
      --profile workflow/profiles/default --configfile "$CONFIG_FILE" \
      --cores "$CORES" --resources mem_mb="$MEM_MB" final_large_scan=1 hf_uploads=1 \
      --rerun-incomplete --printshellcmds
  fi
