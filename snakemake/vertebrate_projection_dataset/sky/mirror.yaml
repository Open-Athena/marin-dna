name: vertebrate-multiz-mirror

# One-off, resumable bootstrap of the 74.7 GB pinned UCSC MultiZ source set.
# Launch only when the versioned S3 prefix is missing objects:
#   sky launch -c vertebrate-multiz-mirror \
#     snakemake/vertebrate_projection_dataset/sky/mirror.yaml

resources:
  infra: aws/us-east-2
  instance_type: c6i.4xlarge
  disk_size: 100
  labels:
    project: dna

workdir: .

setup: |
  set -euxo pipefail

  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict
  uv sync

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  command -v aws

  uv run snakemake \
    --snakefile snakemake/vertebrate_projection_dataset/workflow/Snakefile \
    mirror_multiz_bootstrap \
    --cores 1 \
    --rerun-incomplete \
    --printshellcmds
