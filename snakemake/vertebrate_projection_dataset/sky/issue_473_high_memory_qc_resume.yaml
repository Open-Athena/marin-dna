name: issue-473-high-memory-final-qc

# Additive recovery for the five final jobs left after the 92.8 GiB producer
# reached Ray's 95% memory threshold in full paired diagnostics. All alignment,
# contract, sequence, and earlier QC outputs stay in the exact d0e5380a
# producer namespace. The allowed-rule boundary makes repeating projection
# impossible on this worker.
resources:
  infra: aws/us-east-2
  instance_type: r7i.8xlarge
  disk_size: 400
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: d0e5380a46cd66d4c42d763b3c42da1150c92073

setup: |
  set -euxo pipefail
  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh \
      https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null | awk '{print $2}' || true)" != "0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  test "$(uv --version | awk '{print $2}')" = "0.11.31"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test "$PIPELINE_COMMIT_SHA" = d0e5380a46cd66d4c42d763b3c42da1150c92073
  command -v aws
  command -v /usr/bin/time

  test "$(sha256sum snakemake/vertebrate_projection_dataset/workflow/Snakefile | cut -d' ' -f1)" = 0515ea30972277b86ced268c387bd181c9e87022dd1618f3976e7a075fadab47
  test "$(sha256sum snakemake/vertebrate_projection_dataset/workflow/rules/issue_473_fixed.smk | cut -d' ' -f1)" = 028aaeb16508153de437ee81ab4b64b376d61bb54f50dc50e6033d86b0bf30e3
  test "$(sha256sum snakemake/vertebrate_projection_dataset/src/marin_dna_vertebrate_projection/issue_473/diagnostics.py | cut -d' ' -f1)" = 4732cdff12b1e6bcd611f9b9479fd068e2825ae71f139fcfb682bee1ccdd767a
  test "$(sha256sum snakemake/vertebrate_projection_dataset/src/marin_dna_vertebrate_projection/issue_473/assembly.py | cut -d' ' -f1)" = 57d57b6cdb63600b79f805acf8705ee2b4bc50294d39c65494176b381188b758
  test "$(sha256sum snakemake/vertebrate_projection_dataset/src/marin_dna_vertebrate_projection/issue_473/prestage.py | cut -d' ' -f1)" = ee3a1e22b2d0ff6da49d5db59983bb116481e1abd672ee18fff872289e69d123
  test "$(sha256sum snakemake/vertebrate_projection_dataset/src/marin_dna_vertebrate_projection/pipeline_io.py | cut -d' ' -f1)" = 09e41b5f3e8d90cf7d61f8ec3b803d7734af12c84e26087f6f015480fce6f27f
  test "$(sha256sum snakemake/vertebrate_projection_dataset/config/issue_473_immutable_sources.tsv | cut -d' ' -f1)" = 98e6636fb79e0c03d8840e78f8c1ed91be33cd2acabccce2c2340246657a0253
  test "$(sha256sum snakemake/vertebrate_projection_dataset/config/config.yaml | cut -d' ' -f1)" = 5824950d8541d4c171028b41f769545e9b80840a06a689c89ab0c644b239de18

  sudo mkdir -p /mnt/nvme/vertebrate_projection
  sudo chown -R ubuntu:ubuntu /mnt/nvme
  df -h /

  RESULTS_LINK=snakemake/vertebrate_projection_dataset/results
  RESULTS_ROOT=/mnt/nvme/vertebrate_projection/results
  SNAKEMAKE_LINK=snakemake/vertebrate_projection_dataset/.snakemake
  SNAKEMAKE_ROOT=/mnt/nvme/vertebrate_projection/_snakemake
  mkdir -p "$RESULTS_ROOT" "$SNAKEMAKE_ROOT"
  test ! -e "$RESULTS_LINK" -o -L "$RESULTS_LINK"
  test ! -e "$SNAKEMAKE_LINK" -o -L "$SNAKEMAKE_LINK"
  ln -sfn "$RESULTS_ROOT" "$RESULTS_LINK"
  ln -sfn "$SNAKEMAKE_ROOT" "$SNAKEMAKE_LINK"

  cd snakemake/vertebrate_projection_dataset
  date -u +prestage_start=%Y-%m-%dT%H:%M:%SZ
  uv run --with awscrt python -m \
    marin_dna_vertebrate_projection.issue_473.prestage \
    --project-root . \
    --stage-root /mnt/nvme/vertebrate_projection/issue_473_immutable_sources
  date -u +prestage_end=%Y-%m-%dT%H:%M:%SZ
  test "$(find /mnt/nvme/vertebrate_projection/issue_473_immutable_sources/issue417/rejections -type f -name '*.parquet' | wc -l)" -eq 270

  export POLARS_MAX_THREADS=8
  export RAYON_NUM_THREADS=8
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  date -u +qc_resume_start=%Y-%m-%dT%H:%M:%SZ
  /usr/bin/time -v uv run --locked snakemake \
    issue_473_fixed_core_projection_experiment \
    --snakefile workflow/Snakefile \
    --profile workflow/profiles/default \
    --config tier=full add_reverse_complement=true max_validation_rows=16384 split_seed=42 \
    --cores 8 \
    --resources mem_mb=230000 final_large_scan=1 hf_uploads=1 \
    --set-resources \
      issue_473_fixed_full_diagnostics:mem_mb=180000 \
      issue_473_fixed_dataset:mem_mb=80000 \
    --allowed-rules \
      issue_473_fixed_full_diagnostics \
      issue_473_fixed_full_inspection \
      issue_473_fixed_dataset \
      issue_473_fixed_core_projection_experiment \
    --rerun-incomplete \
    --printshellcmds
  date -u +qc_resume_end=%Y-%m-%dT%H:%M:%SZ

  uv run --locked snakemake issue_473_fixed_core_projection_experiment \
    --snakefile workflow/Snakefile \
    --profile workflow/profiles/default \
    --config tier=full add_reverse_complement=true max_validation_rows=16384 split_seed=42 \
    --cores 1 \
    --resources mem_mb=230000 final_large_scan=1 hf_uploads=1 \
    --allowed-rules issue_473_fixed_core_projection_experiment \
    --dry-run \
    --nolock
  date -u +qc_resume_verified=%Y-%m-%dT%H:%M:%SZ
