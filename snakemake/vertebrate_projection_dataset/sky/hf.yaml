name: vertebrate-projection-hf-build

# High-memory assembly of the reviewed JSONL.zst Hugging Face artifacts.
# Projection/split Parquets are restored through Snakemake's canonical S3
# storage provider; projection, extraction, and QC rules are disallowed.
resources:
  infra: aws/us-east-2
  instance_type: r6i.8xlarge
  disk_size: 1000
  labels:
    project: dna

workdir: .

file_mounts:
  ~/.cache/huggingface/token: ~/.cache/huggingface/token
  ~/.cache/huggingface/stored_tokens: ~/.cache/huggingface/stored_tokens

envs:
  PIPELINE_COMMIT_SHA: ""
  TARGET: all_hf_files
  DRY_RUN: "1"
  ALLOW_HF_UPLOAD: "0"

setup: |
  set -euxo pipefail

  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh \
      https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  test "$(uv --version)" = "uv 0.11.31"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"

  test "$TARGET" = "all_hf_files" -o "$TARGET" = "all_hf"
  test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
  if [ "$TARGET" = "all_hf" ]; then
    test "$ALLOW_HF_UPLOAD" = "1"
  fi

  ALLOWED_RULES=(
    prepare_train_jsonl_shards
    prepare_validation_jsonl_shards
    compress_publication_shard
    dataset_card
    hf_artifact_manifest
    all_hf_files
  )
  if [ "$TARGET" = "all_hf" ]; then
    ALLOWED_RULES+=(hf_upload_dataset all_hf)
  fi

  SNAKEMAKE_MODE=()
  if [ "$DRY_RUN" = "1" ]; then
    SNAKEMAKE_MODE+=(--dry-run)
  fi

  cd snakemake/vertebrate_projection_dataset

  uv run --locked snakemake "$TARGET" "${SNAKEMAKE_MODE[@]}" \
    --profile workflow/profiles/default \
    --config tier=full \
    --cores 32 \
    --resources mem_mb=250000 final_large_scan=1 hf_uploads=1 \
    --allowed-rules "${ALLOWED_RULES[@]}" \
    --forcerun dataset_card \
    --rerun-incomplete \
    --printshellcmds
