name: issue-517-gpn-star-hf

# High-memory build and public upload of the six GPN-Star-P training datasets.
# The immutable projection source is restored through Snakemake's S3 provider.
resources:
  infra: aws/us-east-2
  instance_type: r6i.8xlarge
  disk_size: 1000
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""
  TARGET: all_gpn_hf_files
  DRY_RUN: "1"
  ALLOW_HF_UPLOAD: "0"

setup: |
  set -euxo pipefail

  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh \
      https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null | awk '{print $1, $2}' || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  test "$(uv --version | awk '{print $1, $2}')" = "uv 0.11.31"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"

  test "$TARGET" = "tests" -o "$TARGET" = "all" -o \
    "$TARGET" = "all_gpn_hf_files" -o "$TARGET" = "all_gpn_hf"
  test "$DRY_RUN" = "0" -o "$DRY_RUN" = "1"
  if [ "$TARGET" = "all_gpn_hf" ]; then
    test "$ALLOW_HF_UPLOAD" = "1"
  fi

  cd snakemake/vertebrate_projection_dataset
  if [ "$TARGET" = "tests" ]; then
    uv run --locked pytest
    exit 0
  fi

  ALLOWED_RULES=(
    gpn_publication_producer_manifest
    gpn_dataset_splits
    gpn_prepare_train_jsonl_shards
    gpn_prepare_validation_jsonl_shards
    gpn_compress_publication_shard
    gpn_dataset_card
    gpn_hf_artifact_manifest
    all_gpn_hf_files
  )
  if [ "$TARGET" = "all_gpn_hf" ]; then
    ALLOWED_RULES+=(gpn_hf_upload_dataset all_gpn_hf)
  fi

  SNAKEMAKE_MODE=()
  if [ "$DRY_RUN" = "1" ]; then
    SNAKEMAKE_MODE+=(--dry-run)
  fi

  uv run --locked snakemake "$TARGET" "${SNAKEMAKE_MODE[@]}" \
    --snakefile workflow/gpn_star_publication.Snakefile \
    --profile workflow/profiles/default \
    --cores 32 \
    --resources mem_mb=250000 final_large_scan=1 hf_uploads=1 \
    --allowed-rules "${ALLOWED_RULES[@]}" \
    --rerun-incomplete \
    --printshellcmds
