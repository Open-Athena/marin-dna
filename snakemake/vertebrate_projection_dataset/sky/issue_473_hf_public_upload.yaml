name: issue-473-hf-public-upload

# Upload only the exact retained, validated v3 artifact tree. This task cannot
# invoke projection, splitting, shuffling, card generation, or validation.
resources:
  infra: aws/us-east-2
  instance_type: r6i.8xlarge
  disk_size: 1000
  labels:
    project: dna

workdir: .

file_mounts:
  ~/.cache/huggingface/token: ~/.cache/huggingface/token
  ~/.cache/huggingface/stored_tokens: ~/.cache/huggingface/stored_tokens

envs:
  PIPELINE_COMMIT_SHA: ""
  TARGET: issue_473_all_public_hf
  DRY_RUN: "1"
  ALLOW_PUBLIC_HF_UPLOAD: "0"

setup: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  if ! uv --version 2>/dev/null | grep -Eq '^uv 0[.]11[.]31([[:space:]]|$)'; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  uv --version | grep -Eq '^uv 0[.]11[.]31([[:space:]]|$)'
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  uv sync --project snakemake/vertebrate_projection_dataset --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/skypilot-runtime/bin:$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"
  test "$TARGET" = "issue_473_all_public_hf"
  test "$DRY_RUN" = "0" || test "$DRY_RUN" = "1"

  SNAKEMAKE_MODE=()
  if test "$DRY_RUN" = "1"; then
    SNAKEMAKE_MODE+=(--dry-run)
  else
    test "$ALLOW_PUBLIC_HF_UPLOAD" = "1"
  fi

  cd snakemake/vertebrate_projection_dataset

  uv run --locked snakemake "$TARGET" \
    --snakefile workflow/Issue473PublicUpload.smk \
    --profile workflow/profiles/default \
    --cores 1 \
    --resources hf_uploads=1 \
    --allowed-rules issue_473_public_hf_upload_dataset issue_473_all_public_hf \
    "${SNAKEMAKE_MODE[@]}" \
    --rerun-incomplete \
    --printshellcmds
