[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-dna-vertebrate-projection"
version = "0.0.1"
description = "Locked runtime and Python package for the vertebrate projection dataset"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marin-dna",
    "marin-dna-zoonomia-projection",
    "huggingface-hub",
    "polars",
    "pyarrow>=21.0.0",
    "pyyaml",
    "zstandard",
    "snakemake",
    "snakemake-storage-plugin-s3>=0.3.6",
]

[project.scripts]
marin-dna-build-vertebrate-species-manifest = "marin_dna_vertebrate_projection.cli.build_species_manifest:main"
marin-dna-build-multiz-mirror-manifest = "marin_dna_vertebrate_projection.cli.build_multiz_mirror_manifest:main"
marin-dna-build-twobit-manifest = "marin_dna_vertebrate_projection.cli.build_twobit_manifest:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "snakemake-storage-plugin-fs>=1.1.3",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
marin-dna = { path = "../..", editable = true }
marin-dna-zoonomia-projection = { path = "../zoonomia_projection_dataset", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna_vertebrate_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
