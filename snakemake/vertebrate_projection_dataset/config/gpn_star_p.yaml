pipeline_version: gpn-star-p-uniform-v1
tier: smoke

window_size: 255
step_size: 128

# Canonical position-level GPN-Star-P entropy Parquets.
gpn_dataset_repo: songlab/gpn-star-scores
gpn_dataset_revision: 5c799b2ec6aa089f0caa8294ae72adb4510f81ae
gpn_score_set: gpn-star-hg38-p243-200m
gpn_entropy_manifest: config/gpn_star_p_entropy_manifest.tsv
gpn_entropy_cutoff: 0.081001
gpn_min_selected_bases: 51
gpn_assignment_recipe: exp232-v4-plus-exp326-arm-a-remainder-v1

# Exact full-genome audit gates from the issue #517 cutoff analysis.
expected_uniform_windows: 22948560
expected_selected_source_positions: 218273080
expected_windows_ge_10pct: 2421580
expected_windows_ge_20pct: 1627410

# #232 v4 region assignment plus #326 Arm A.
ensembl_release: 115
ccre_url: https://downloads.wenglab.org/Registry-V4/GRCh38-cCREs.bed
region_label_tss_radius: 256
region_label_ccre_flank: 0
region_label_tss_pc_only: true
region_label_functional_threshold: 0.20
region_label_priority:
  [cds, utr3, tss_region_and_utr5, ncrna_exon, ccre_non_promoter]
assignment_arms:
  [cds, utr3, tss_region_and_utr5, ncrna_exon, enhancer, background]

standard_chroms:
  [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
   chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19,
   chr20, chr21, chr22, chrX, chrY]

species_candidates: config/species_candidates.tsv
species_selected: config/species_selected.tsv
multiz_mirror_manifest: config/multiz_mirror.tsv
twobit_manifest: config/twobit_manifest.tsv

hal_s3_uri: s3://oa-bolinas/staging/447-mammalian-2022v1.hal
hal_stage_path: /mnt/nvme/vertebrate_projection/447-mammalian-2022v1.hal
multiz_stage_dir: /mnt/nvme/vertebrate_projection/multiz100way/ucsc-2015-05-12

# One chromosome is enough to exercise live scoring and both projection backends.
smoke_chroms: [chr18]
smoke_mammals: [Mus_musculus, Loxodonta_africana]
smoke_non_mammals: [galGal4, allMis1, xenTro7, danRer10, petMar2]
smoke_anchors_per_arm: 4

inspection_seed: 517
inspection_rows_per_region: 3
inspection_fragmented_rows: 5
inspection_rejected_rows_per_reason: 2
