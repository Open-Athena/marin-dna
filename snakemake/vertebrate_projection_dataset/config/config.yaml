pipeline_version: chains-v1
tier: smoke

window_size: 255
step_size: 128
phyloP_447m_threshold: 2.2162
min_proportion_conserved: 0.20

ensembl_release: 115
ccre_url: https://downloads.wenglab.org/Registry-V4/GRCh38-cCREs.bed
standard_chroms:
  [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
   chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19,
   chr20, chr21, chr22, chrX, chrY]

species_selected: config/species_selected.tsv
# Fabricated miniature inputs; replace both manifests for biological execution.
chain_assets: tests/fixtures/chains/pipeline_assets.tsv
genome_assets: tests/fixtures/chains/genomes.tsv
smoke_anchors: tests/fixtures/chains/anchors.tsv
smoke_chroms: [chr1]
smoke_cohorts: [all]
require_zrs: false
liftover_mem_mb: 32000
table_mem_mb: 16000

validation_rows: 16384
smoke_validation_rows: 1
validation_seed: 42
add_rc: true
publication_train_shards: 64
publication_smoke_train_shards: 4
publication_validation_shards: 1
publication_shuffle_seed: 42
inspection_seed: 417
inspection_rows_per_region: 3
inspection_fragmented_rows: 5
inspection_rejected_rows_per_reason: 2
region_cohorts:
  [all, cds, cds_mammals_only, utr3, ncrna_exon, tss_region_and_utr5,
   ccre_non_promoter, background]

hf_owner: marin-dna
hf_upload_workers: 1

# v4 region labeling from issue #227, pinned independently here.
region_label_tss_radius: 256
region_label_ccre_flank: 0
region_label_tss_pc_only: true
region_label_functional_threshold: 0.20
region_label_priority:
  [cds, utr3, tss_region_and_utr5, ncrna_exon, ccre_non_promoter]
