pipeline_version: functional-v1
hf_repo_prefix: functional
hf_repo_names:
  cds: functional-cds
  utr3: functional-utr3
  tss_region: functional-tss
  ncrna: functional-ncrna
  enhancer: functional-enhancer
tier: smoke

window_size: 255
step_size: 128
feature_flank: 20
min_feature_size: 20
max_feature_size: 10000
tss_radius: 256
phyloP_447m_threshold: 2.2162
projection_min_proportion_conserved: 0.10
training_min_proportion_conserved: 0.20

# Issue #517 uses the complete Ensembl GRCh38 release 115 annotation.
# Qualifying alternative transcripts are intentionally retained; RefSeq and
# Ensembl_canonical-only filtering are not part of this recipe.
ensembl_release: 115
ccre_url: https://downloads.wenglab.org/Registry-V4/GRCh38-cCREs.bed
development_vep_repo: marin-dna/evals_mendelian_traits
development_vep_revision: 4aed58e50c5dea0b878a665007af2ef9e5108e9f
development_vep_split: train
ncrna_biotypes: [lncRNA, miRNA, snoRNA, snRNA, ribozyme, scaRNA, vault_RNA]
functional_priority: [cds, utr3, tss_region, ncrna, enhancer]
functional_arms: [cds, utr3, tss_region, ncrna, enhancer]
region_cohorts: [cds, utr3, tss_region, ncrna, enhancer]
smoke_region_cohorts: [cds, utr3, tss_region, ncrna, enhancer]
standard_chroms:
  [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
   chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19,
   chr20, chr21, chr22, chrX, chrY]

species_candidates: config/species_candidates.tsv
species_selected: config/species_selected.tsv
multiz_mirror_manifest: config/multiz_mirror.tsv
twobit_manifest: config/twobit_manifest.tsv
liftover_chain_manifest: config/liftover_chain_manifest.tsv
liftover_min_match: 0.95
liftover_multiple: false

hal_s3_uri: s3://oa-bolinas/staging/447-mammalian-2022v1.hal
hal_stage_path: /mnt/nvme/vertebrate_projection/447-mammalian-2022v1.hal
multiz_stage_dir: /mnt/nvme/vertebrate_projection/multiz100way/ucsc-2015-05-12

smoke_chroms: [chr7, chr18]
smoke_mammals: [Mus_musculus, Loxodonta_africana]
smoke_non_mammals: [galGal4, allMis1, xenTro7, danRer10, petMar2]
smoke_training_anchors_per_arm: 8
smoke_deferred_anchors_per_arm: 2

validation_rows: 16384
smoke_validation_rows: 1
validation_seed: 517
add_rc: true
publication_train_shards: 64
publication_smoke_train_shards: 4
publication_validation_shards: 1
publication_shuffle_seed: 517
inspection_seed: 517
inspection_rows_per_region: 3
inspection_fragmented_rows: 5
inspection_rejected_rows_per_reason: 2

hf_owner: marin-dna
hf_upload_workers: 1
