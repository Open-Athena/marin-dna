[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-dna-zoonomia-projection"
version = "0.0.1"
description = "Locked runtime and Python package for the Zoonomia projection dataset"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marin-dna",
    "bioframe",
    "huggingface-hub",
    "numpy",
    "openpyxl",
    "pandas>=2.0,<3.0",
    "polars",
    "pyarrow>=21.0.0",
    "pybigwig",
    "snakemake",
    "snakemake-storage-plugin-s3>=0.3.6",
]

[project.scripts]
marin-dna-build-species-list = "marin_dna_zoonomia_projection.cli.build_species_list:main"
marin-dna-calibrate-447m = "marin_dna_zoonomia_projection.cli.calibrate_447m_threshold:main"
marin-dna-zrs-check = "marin_dna_zoonomia_projection.cli.zrs_sanity_check:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
marin-dna = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna_zoonomia_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
