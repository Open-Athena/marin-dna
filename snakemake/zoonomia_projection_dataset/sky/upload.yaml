name: zoonomia-projection-hf-upload

# HF dataset assembly + upload (rule all_hf).

resources:
    infra: aws/us-east-2
    instance_type: r6i.8xlarge
    disk_size: 300
    labels:
        project: dna

workdir: .

# HF CLI reads the token from ~/.cache/huggingface/token.
file_mounts:
    ~/.cache/huggingface: ~/.cache/huggingface

# Forward the launcher's commit SHA so HF dataset cards get commit-pinned
# permalinks. The cluster can't resolve ``git rev-parse HEAD`` itself when
# the host is in a worktree (the synced ``.git`` is a *file* pointing at a
# host path that doesn't exist on the cluster). Pass it explicitly at launch
# (a bare shell-var prefix is NOT inherited by SkyPilot):
#
#     sky launch -c <name> sky/upload.yaml --env COMMIT_SHA=$(git rev-parse HEAD)
#
# Defaults to "" (optional); if empty, common.smk falls back to "main" — links
# still resolve, just not pinned.
# UPLOAD_VERSION selects which intervals partition to push: v3 (default) or
# v4 (issue #227). Override at launch: `sky launch ... --env UPLOAD_VERSION=v4`.
# UPLOAD_MODE selects WHICH datasets to push:
#   region        (default) — the six v3_*/v4_* region partitions for
#                  UPLOAD_VERSION (the default 108-family species cohort). The
#                  curated cCRE sub-filters (below) are excluded — they are not
#                  partitions.
#   species_subset — the species_subset_datasets combos (issue #233), e.g.
#                  zoonomia-v1-v4_cds-order. UPLOAD_VERSION is ignored.
#                  Launch: `sky launch ... --env UPLOAD_MODE=species_subset`.
#   curated_ccre  — the two #326 curated cCRE/enhancer sub-filters of
#                  v4_ccre_non_promoter (v4_ccre_noexon{,_enhancer}).
#                  UPLOAD_VERSION is ignored.
#                  Launch: `sky launch ... --env UPLOAD_MODE=curated_ccre`.
envs:
    COMMIT_SHA: ""
    UPLOAD_VERSION: v3
    UPLOAD_MODE: region

setup: |
    set -euxo pipefail

    if [ ! -d "$HOME/miniforge3" ]; then
        curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
        rm /tmp/miniforge.sh
    fi

    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi

    grep -q 'miniforge3/bin' "$HOME/.bashrc" || \
        echo 'export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"

    export PATH="$HOME/.local/bin:$PATH"
    uv sync

run: |
    set -euxo pipefail

    source "$HOME/miniforge3/etc/profile.d/conda.sh"
    export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
    export CONDA_EXE="$HOME/miniforge3/bin/conda"

    cd snakemake/zoonomia_projection_dataset

    # Compute upload.done targets. region mode: the six v3_*/v4_* partitions
    # for $UPLOAD_VERSION. species_subset mode: the species_subset_datasets
    # combos (zoonomia-{pv}-{iv}-{cohort}). v1/v2 are already pushed and their
    # upload.done markers in S3 satisfy `rule all_hf` separately; we don't need
    # (or want) to walk those branches.
    UPLOAD_TARGETS=$(UPLOAD_VERSION="$UPLOAD_VERSION" UPLOAD_MODE="$UPLOAD_MODE" uv run python -c "
    import yaml, os
    cfg = yaml.safe_load(open('config/config.yaml'))
    pv = cfg['pipeline_version']
    mode = os.environ['UPLOAD_MODE']
    # The #326 curated cCRE sub-filters are NOT region partitions; keep them out
    # of region mode and give them their own curated_ccre mode. Single source of
    # truth = config's curated_ccre_subsets (shared with dataset.smk + regions.smk),
    # not a name-prefix heuristic that could catch an unintended future name.
    curated = list(cfg.get('curated_ccre_subsets', []))
    if mode == 'species_subset':
        for d in cfg.get('species_subset_datasets', []):
            print(f'results/upload.done/zoonomia-{pv}-{d[\"intervals\"]}-{d[\"species\"]}')
    elif mode == 'curated_ccre':
        for iv in curated:
            print(f'results/upload.done/zoonomia-{pv}-{iv}')
    else:
        ver = os.environ['UPLOAD_VERSION']
        for iv in cfg['intervals_versions']:
            if iv.startswith(ver + '_') and iv not in curated:
                print(f'results/upload.done/zoonomia-{pv}-{iv}')
    ")
    test -n "$UPLOAD_TARGETS"  # fail loudly if the mode/version matched nothing

    # `--allowed-rules` whitelists the v3 chain so Snakemake refuses to
    # walk back into the cross-mammal projection (hal_to_fasta /
    # project_one_species / extract_sequences / merge_sequences), whose
    # intermediate `local()` FASTAs aren't mirrored to S3 and which would
    # otherwise be re-scheduled despite their downstream outputs
    # (`sequences/{species}.parquet`, `all_species_with_sequence.parquet`)
    # already existing in S3 default-storage.
    # All three readme rules are whitelisted; only the one matching the
    # target's wildcard (v3_* / v4_* / *-{cohort}) actually fires. subset_species
    # (issue #233) filters the existing intervals subset (e.g. subsets/v4_cds.parquet,
    # already in S3) to a species cohort — it does NOT touch the projection. The
    # region-label / projection rules are deliberately absent so Snakemake errors
    # rather than walking back into them — their outputs (query_names,
    # composition, subset parquets' source) already exist in S3.
    # EXCEPTION (#326): the two curated cCRE sub-filters are new, so their
    # query_names do NOT yet exist in S3 — whitelist their derive rules (which
    # read only the v4 region-labels parquet + cCRE + defined, all in S3, so
    # they don't walk into the projection) and their minimal card rule. These
    # fire only in curated_ccre mode; in region/species_subset mode the existing
    # S3 outputs satisfy mtime and they stay dormant.
    ALLOWED_RULES=(
        subset_dataset_derived
        subset_species
        prepare_training_shards
        compress_shard
        dataset_hf_readme_v3
        dataset_hf_readme_v4
        dataset_hf_readme_species_subset
        derive_subset_v4_ccre_noexon
        derive_subset_v4_ccre_noexon_enhancer
        dataset_hf_readme_curated_ccre
        hf_upload_dataset
    )

    # Pass commit SHA through to Snakemake if the launcher provided one
    # (see envs: COMMIT_SHA above).
    SNAKEMAKE_EXTRA=()
    if [ -n "${COMMIT_SHA:-}" ]; then
        SNAKEMAKE_EXTRA+=(--config "commit_sha=$COMMIT_SHA")
    fi

    # NOTE: ${SNAKEMAKE_EXTRA[@]} (which may be `--config commit_sha=...`) must
    # NOT be the last option before the positional targets — Snakemake's
    # `--config` greedily consumes following tokens as name=value pairs and
    # would choke on the target paths. Keep it right after --profile so the
    # subsequent flags bound it.

    # Dry-run gate first — verify only HF-related rules are scheduled.
    uv run snakemake --profile workflow/profiles/default \
        "${SNAKEMAKE_EXTRA[@]}" \
        --allowed-rules "${ALLOWED_RULES[@]}" \
        --rerun-triggers mtime \
        --printshellcmds \
        -n $UPLOAD_TARGETS

    # Real run.
    uv run snakemake --profile workflow/profiles/default \
        "${SNAKEMAKE_EXTRA[@]}" \
        --allowed-rules "${ALLOWED_RULES[@]}" \
        --rerun-triggers mtime \
        --printshellcmds \
        --rerun-incomplete \
        $UPLOAD_TARGETS
