name: zoonomia-regions

# Per-anchor region-type annotation. Target is selectable via $SNAKEMAKE_TARGET
# (default all_region_labels = v3); pass all_region_labels_v4 for the issue #227
# v4 partition.
#
# Produces, per conservation filter level (min0.10 and min0.20):
#   v3 (all_region_labels):
#     - region_labels/min{min_p}.parquet            (per-anchor labels + frac_*)
#     - region_labels/min{min_p}.composition.tsv    (composition report)
#   v4 (all_region_labels_v4):
#     - region_labels/v4/min{min_p}.parquet         (bp-priority + window-majority)
#     - region_labels/v4/min{min_p}.composition.tsv
# And, for the project_min_p level only (min0.20):
#   - subsets_def/{v3,v4}_<label>.query_names.txt   (6 lists for the partition)
#
# Compute profile: c6id.4xlarge mirrors sky/validation.yaml. The bedtools
# coverage step on 22.9M anchors × multiple region BEDs is mostly bound by
# bioframe and is bound to <30 min wall. Memory: GTF parse + 5 region
# unions; mem_mb=24000 in the rule covers it on a 32 GB box.
#
# Cluster pattern (memo: cloud_launch_conventions, sky_cluster_reuse):
#   sky launch -c zoonomia-regions sky/regions.yaml                              # v3
#   sky exec   zoonomia-regions   sky/regions.yaml --env SNAKEMAKE_TARGET=all_region_labels_v4
#   sky down   zoonomia-regions                       # only at session end

envs:
    SNAKEMAKE_TARGET: all_region_labels

resources:
    infra: aws/us-east-2
    instance_type: c6id.4xlarge      # 16 vCPU, 32 GB RAM, 950 GB local NVMe
    disk_size: 100
    labels:
        project: dna

workdir: .

setup: |
    set -euxo pipefail

    if [ ! -d "$HOME/miniforge3" ]; then
        curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
        rm /tmp/miniforge.sh
    fi

    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi

    grep -q 'miniforge3/bin' "$HOME/.bashrc" || \
        echo 'export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"

    export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
    uv sync --project snakemake/zoonomia_projection_dataset --locked

run: |
    set -euxo pipefail

    source "$HOME/miniforge3/etc/profile.d/conda.sh"
    export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
    export CONDA_EXE="$HOME/miniforge3/bin/conda"

    cd snakemake/zoonomia_projection_dataset

    # Clear any stale snakemake lockfile from a prior crash. Safe no-op on a
    # clean working dir.
    uv run --locked snakemake --profile workflow/profiles/default --unlock || true

    # Dry-run gate (fails closed): capture the plan and HARD-ABORT if it
    # would run anything beyond the region-label rules — e.g. the multi-hour
    # halLiftover projection or a genome/scoring rebuild. The labeling step
    # only needs anchors + GTF + cCRE (already on S3); the projection must NOT
    # be re-derived here.
    DRYLOG=$(uv run --locked snakemake --profile workflow/profiles/default \
        --rerun-incomplete -n "$SNAKEMAKE_TARGET" 2>&1) || true
    echo "$DRYLOG"

    if echo "$DRYLOG" | grep -q "Nothing to be done"; then
        echo "Dry-run: outputs already present — nothing to do. Exiting clean."
        exit 0
    fi

    # (1) Denylist: any heavy upstream rule => abort.
    HEAVY='project_one_species|hal_to_fasta|hal_chrom_sizes|fasta_to_2bit|extract_sequences|merge_sequences|merge_projected|prepare_input_ucsc|filter_single_chrom_strand|filter_length|resize_to_length|download_genome|genome_to_2bit|download_bigwig|download_annotation|cre_download|cre_process|score_windows_chrom|merge_scored|make_windows|chrom_sizes|chrom_sizes_filtered|undefined_regions|defined_regions|filter_bed'
    if echo "$DRYLOG" | grep -qE "^(rule|localrule|checkpoint|localcheckpoint) ($HEAVY):"; then
        echo "ABORT: dry-run scheduled a heavy upstream rule (projection/genome/scoring)." >&2
        echo "This launcher only runs the labeling step; everything upstream must already exist on S3." >&2
        exit 1
    fi

    # (2) Allowlist (fail closed): every scheduled rule must be a region-label rule.
    ALLOWED="build_region_labels build_region_labels_v4 region_label_composition region_label_composition_v4 derive_subset_v3_region derive_subset_v4_region all_region_labels all_region_labels_v4"
    SCHEDULED=$(echo "$DRYLOG" | awk '
        /^Job stats:/ {s=1; next}
        s && /^-+[[:space:]]+-+/ {r=1; next}
        r && /^total[[:space:]]/ {r=0; s=0; next}
        r && NF>=2 {print $1}
    ' | sort -u)
    if [ -z "$SCHEDULED" ]; then
        echo "ABORT: no parsable 'Job stats:' table in the dry-run output — snakemake likely errored (see above) or its output format changed. Refusing to run blind." >&2
        exit 1
    fi
    for rule in $SCHEDULED; do
        case " $ALLOWED " in
            *" $rule "*) : ;;
            *) echo "ABORT: unexpected scheduled rule '$rule' (not a region-label rule)." >&2; exit 1 ;;
        esac
    done
    echo "Dry-run gate PASSED — only region-label rules scheduled: $SCHEDULED"

    # Real run (gated above).
    uv run --locked snakemake --profile workflow/profiles/default \
        --use-conda \
        --printshellcmds \
        --rerun-incomplete \
        "$SNAKEMAKE_TARGET"

    # Composition TSVs are uploaded to S3 by snakemake; fetch them from
    # there for inspection (the cluster image doesn't ship awscli, and
    # snakemake prunes the local copy after upload anyway):
    #   aws s3 cp s3://oa-bolinas/snakemake/zoonomia_projection_dataset/results/human/intervals/region_labels/min0.20.composition.tsv -
