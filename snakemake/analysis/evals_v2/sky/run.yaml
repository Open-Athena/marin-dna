# SkyPilot task: run the evals_v2 pipeline on a small GPU node.
#
# The pipeline pulls model checkpoints from `gs://marin-us-central1/...`
# (or HF Hub for `hf_repo` model entries), reads the GRCh38 reference
# directly from S3 by pyfaidx, scores variants on the matched-pair eval
# datasets, and computes PairwiseAccuracy ± SE per (model, dataset).
# 6 models × 3 datasets = 18 inference runs, each ≤ 10K variants — fits
# on a single small GPU. RC averaging doubles per-run cost.
#
# Auth: the user's GCP application-default credentials are mounted from
# ~/.config/gcloud/application_default_credentials.json. The setup step
# installs the gcloud CLI so the pipeline's `gcloud storage cp -r` rule
# works. AWS creds for the S3 genome read come from the instance role.
#
# Launch:
#   sky launch snakemake/analysis/evals_v2/sky/run.yaml -c evals-v2

name: evals-v2

resources:
    infra: aws/us-east-2
    # AWS DLAMI 20260721: Ubuntu 24.04.4, NVIDIA driver 595.71.05.
    # Pinned for the PyTorch 2.13.0 / CUDA 13.0 runtime in issue #462.
    image_id: ami-0324f0ad73bdcd087
    accelerators: A10G:1        # 24 GB Ampere — bf16-capable. L4 (g6.xlarge) is
                                # ~$0.21/hr cheaper and would also work; keeping A10G
                                # because that's what we benchmarked batch_size=64 on.
    disk_size: 200
    labels:
        project: dna
    # Prefer spot (≈70% cheaper) with an on-demand fallback, so a launch never
    # fails for lack of spot capacity. These evals are short (~20 min), so a
    # mid-run spot preemption is a small, re-runnable risk. (Enabled after a spot
    # quota bump; flip both to on-demand by deleting this any_of block.)
    any_of:
      - use_spot: true
      - use_spot: false

workdir: .

envs:
    SNAKEMAKE_ARGS: ""           # extra snakemake args (e.g. --forcerun compute_scores)
    GPU_RUNTIME_PARITY: "false"  # true runs the issue-462 fixed-cell parity gate only.
    EXTRA_UV_GROUPS: ""          # extra `uv` groups for this run, e.g. "--group umap"
                                 # for the embedding-UMAP target (#246). Default
                                 # empty so metrics/nuc_dep runs stay lean (the
                                 # umap group pulls a ~56 MB LLVM wheel).

file_mounts:
    # Application Default Credentials so `gcloud storage cp -r` can pull
    # private GCS objects from gs://marin-us-central1/...
    ~/.config/gcloud/application_default_credentials.json: ~/.config/gcloud/application_default_credentials.json

setup: |
    set -euxo pipefail

    if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
    if [[ "$(uv --version)" != "uv 0.11.31" ]]; then
        uv self update 0.11.31
    fi

    # gcloud CLI for the pipeline's `download_model` shell rule.
    if ! command -v gcloud >/dev/null 2>&1; then
        curl -fsSL https://sdk.cloud.google.com > /tmp/gcloud-install.sh
        bash /tmp/gcloud-install.sh --disable-prompts --install-dir="$HOME"
    fi

    grep -q 'google-cloud-sdk/bin' "$HOME/.bashrc" || \
        echo 'export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"

    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"

    # Pin to the ADC we mounted; gcloud picks this up automatically.
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"

    # `--group genome-s3` pulls in s3fs so pyfaidx can read the GRCh38
    # reference directly from S3 (see config/config.yaml `genome_path`).
    # $EXTRA_UV_GROUPS adds per-target groups (e.g. `--group umap` for #246).
    uv sync --project snakemake/analysis/evals_v2 --locked --group genome-s3 $EXTRA_UV_GROUPS

    # Fail setup before scoring if the image, driver, torch, compiled CUDA,
    # A10G, CUDA availability, or bf16 execution differs from the pinned tuple.
    uv run --project snakemake/analysis/evals_v2 --locked --group genome-s3 \
        $EXTRA_UV_GROUPS evals-gpu-runtime-check \
        --config snakemake/analysis/evals_v2/config/gpu_runtime_validation.yaml \
        smoke

    # Smoke-test GCS access so a bad ADC fails fast in setup, not in a rule.
    gcloud storage ls gs://marin-us-central1/checkpoints/ | head -3 >/dev/null

run: |
    set -euxo pipefail

    export PATH="$HOME/google-cloud-sdk/bin:$HOME/.local/bin:$PATH"
    export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"

    # HF Trainer auto-initializes wandb if it can find the package; without
    # an API key on this fresh node it errors out. Disable wandb entirely
    # since this is a non-training inference job.
    export WANDB_DISABLED=true

    cd snakemake/analysis/evals_v2

    if [[ "$GPU_RUNTIME_PARITY" == "true" ]]; then
        # Re-score the fixed train-split cell in memory and compare it with the
        # checksummed PyTorch 2.8 baseline. This writes no pipeline artifacts.
        uv run --locked --group genome-s3 $EXTRA_UV_GROUPS \
            pytest tests/evals/test_gpu_runtime_validation.py
        uv run --locked --group genome-s3 $EXTRA_UV_GROUPS \
            evals-gpu-runtime-check \
            --config config/gpu_runtime_validation.yaml \
            parity
        exit 0
    fi

    # $SNAKEMAKE_ARGS goes last so it can include `-- target1 target2 ...`
    # without breaking the parser (everything after `--` is positional, so
    # if `--profile` etc. follow `$SNAKEMAKE_ARGS` they'd be treated as
    # target paths and the rule lookup fails with
    # `AttributeError: 'AnnotatedString' object has no attribute 'is_storage'`).
    uv run --locked --group genome-s3 $EXTRA_UV_GROUPS snakemake \
        --profile workflow/profiles/default \
        --printshellcmds \
        --rerun-incomplete \
        $SNAKEMAKE_ARGS
