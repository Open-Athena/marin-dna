[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-dna-evals"
version = "0.0.1"
description = "Locked runtime and Python package for the MarinDNA evals_v2 pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marin-dna",
    "marin-dna-rag-glm",
    "datasets>=3.1.0,<4.0.0",
    "einops",
    "huggingface-hub",
    "jaxtyping",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas>=2.0,<3.0",
    "polars",
    "pyarrow>=21.0.0",
    "pybigwig",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "snakemake",
    "snakemake-storage-plugin-s3>=0.3.6",
    "torch==2.5.1; sys_platform == 'linux'",
    "torch==2.13.0; sys_platform == 'darwin'",
    "transformers[torch]<5",
    "zstandard",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
genome-s3 = [
    "s3fs>=2024",
]
umap = [
    "umap-learn>=0.5",
]
dashboard = [
    "boto3",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
marin-dna = { path = "../../../", editable = true }
marin-dna-rag-glm = { path = "../../rag_glm", editable = true }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow and/or network-dependent; deselected in the default CI gate",
]
