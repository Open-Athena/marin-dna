inference:
  batch_size: 128       # Was 64 with output_hidden_states=True keeping all
                        # 19+2 layers' activations alive (~2.6 GB at L=256,
                        # hidden=1920); the slim LLR+JSD bundle frees that
                        # headroom for ~2x batch on A10G (24 GB).
  num_workers: 4
  data_transform_on_the_fly: true
  torch_compile: true
  rc: true              # Compute the RC strand alongside FWD; doubles
                        # inference time but is the validated default
                        # per issue #175 conclusion 2. AVG / minus_llr /
                        # abs_llr columns are derived in the metrics rule.
  n_bootstrap: 1000     # AUPRC cluster-bootstrap iterations per
                        # (subset × score_type).
  bootstrap_seed: 0     # 0 → reproducible across re-runs. Bumping
                        # this triggers metric re-execution via
                        # snakemake's `params:` hash.


# ---------------------------------------------------------------------------
# cLLR mutation-rate calibration tables (stage 3, #267/#270). Off `rule all`;
# build with `snakemake calibration` (or a single
# results/calibration/<model>/llr_neutral_mean_n{n}.parquet target). Scores the
# pinned, pre-filtered + subsampled neutral set with the fast LLR bundle (FWD+RC)
# and bins by pentanuc_mut → per-checkpoint llr_neutral_mean table. The neutral set
# is ACGT-window-filtered upstream (neutral_sites pipeline); this rule does no
# genome filtering. Entropy calibration is a separate, deferred path. See
# rules/calibration.smk.
# ---------------------------------------------------------------------------
calibration:
  # S3 prefix of the neutral-sites pipeline's subsampled artifacts. The rule
  # appends `/neutral_sites_n{n}_w{scoreable_window}.parquet`.
  neutral_sites_s3_prefix: s3://oa-bolinas/snakemake/neutral_sites/results/subsampled
  subsample_n: 100        # per-5-mer cap; selects neutral_sites_n100_w{w}.parquet
                          # and names the `calibration` collector's targets.
  scoreable_window: 512   # the neutral set is pre-filtered so every w-bp window is
                          # all-ACGT; 512 = the largest model window, so ONE set is
                          # valid for every model (255/256/512). Must be >= each
                          # scored model's window_size (asserted in the rule).
  min_bin_count: 10       # hard floor on observations per pentanuc_mut cell. At
                          # n=100 the true min is 41 (CpG-depleted 5-mers); the
                          # ACGT-window pre-filter shaves a few gap-adjacent sites,
                          # so 10 catches a broken/empty cell without false-firing
                          # on legitimate post-filter depletion.
  rc: true                # FWD+RC average, matching the eval convention.
  models:
    - mix-v0.9-p1B-i24-exp135-m5.1-step-59158   # exp135-1B-m5.1 (our winner / pilot model)


# ---------------------------------------------------------------------------
# Nucleotide dependency maps (categorical Jacobian) — interpretation, #237.
#
# NOT a metric: these targets are kept off `rule all`. Build explicitly:
#   snakemake nuc_dep                                  # all (locus, model) plots
#   snakemake results/plots/nuc_dep/LDLR/<model>.svg   # one map
#
# Coordinates are 0-based half-open, GRCh38 (Ensembl chrom names, no `chr`).
# Loci are reused from the nuc-dep paper's human examples so our maps can be
# eyeballed against the published figures. Each locus must fit the model's
# `window_size` (asserted at config load). HBA1 is 256 bp in the paper; we crop
# 1 bp (trim the 3' end) so it fits the 255 bp window of the mix-v0.9 models —
# GPN-Star likewise ran HBA1 with the locus filling the whole window (256/256),
# so a locus == window_size (zero flank) is an intended, supported case.
# ---------------------------------------------------------------------------
nuc_dep:
  window_size: 255     # fixed window for ALL models so they see the SAME input (#240),
                       # overriding each model's native context (e.g. exp21's 512)
  combines: [mean]     # stitched-FWD/RC symmetrization (#237/#240); max is near-identical (Spearman ~0.98), so we keep only mean
  ord: inf             # vector-norm order collapsing each 4x4 nucleotide block
  batch_size: 32       # sequences per forward pass (execution-only; tune for VRAM)
  dpi: 100             # heatmap raster dpi (the SVG embeds one rasterized image; lower = smaller file)
  # No-BOS models are supported (#240): the forward pass can't predict the
  # window's first position and RC can't predict the last, but the FWD+RC stitch
  # recovers both, so the map stays complete. Each locus must still fit
  # `window_size` (HBA1 == 255 fills it exactly).
  models:
    - mix-v0.9-p1B-i24-exp135-m5.1-step-59158
    - exp166-v0.1-p1B-step-27329  # 1B generalist (zoonomia v0.1), 255+BOS — 2nd dashboard model (#240)
    - exp21-promoters-yolo-step-22000  # promoter specialist (final ckpt, on the leaderboard), 512-ctx no-BOS, run at 255 (#240)
  loci:
    LDLR:  {chrom: "19", start: 11089299,  end: 11089425,  strand: "+"}
    TH:    {chrom: "11", start: 2171682,   end: 2171868,   strand: "-"}
    GRIA4: {chrom: "11", start: 105609444, end: 105609472, strand: "+"}
    # HBA1: paper locus 176699-176955 (256 bp) cropped to 255 (3' end -1) to fit.
    HBA1:  {chrom: "16", start: 176699,    end: 176954,    strand: "+"}
    # tRNA-Arg-TCT-4-1 (gtrnadb GRCh38), a structured ncRNA used in the nuc-dep
    # paper (Fig 7) — the map should recover its cloverleaf base-pairing. UCSC
    # display chr1:159141611-159141684 (-) is 1-based inclusive → 0-based
    # half-open start 159141610, end 159141684 (74 bp).
    tRNA_Arg_TCT: {chrom: "1", start: 159141610, end: 159141684, strand: "-"}

# Embedding UMAP (GPN-Star Fig 4A/4B) — interpretation, issue #246. Off `rule all`;
# build with `snakemake umap`. Install needs `--group genome-s3 --group umap`
# (S3 genome read + the optional umap-learn group). Reuses the `models:` registry
# above (entry must declare `window_size`); first pass is exp135-1B only.
umap_embeddings:
  dataset: songlab/gpn-star-umap-regions   # HF: 111,329 labeled 100 bp windows (chrom/start/end/label/cons)
  layer_index: -1                          # last hidden layer (match GPN-Star); configurable for a later sweep
  n_center_bp: 100                         # central positions to mean-pool (== the dataset window)
  random_state: 42                         # UMAP seed (also forces single-threaded UMAP)
  dpi: 200                                 # scatter raster dpi
  # batch_size: keep at 128 (= inference.batch_size). On A10G, VRAM oscillates
  # ~7.5–22 GB across strand 1 (Trainer.predict accumulating [N, 1920] outputs +
  # a torch.compile workspace reservation — far heavier than the variant path's
  # [N, 2]), peaking ~95% at batch 128. Higher would OOM. The run is also
  # GPU-compute-bound, so a bigger batch wouldn't speed it up regardless.
  batch_size: 128
  models:
    - mix-v0.9-p1B-i24-exp135-m5.1-step-59158   # exp135-1B-m5.1 (255+BOS) — first pass, single model

# Functional/non-functional LL gap (issue #274) — off `rule all`; build with
# `snakemake ll_gap` (or one `results/ll_gap/scores/<model>/<region>.parquet`
# per sky cluster, then `snakemake ll_gap` to gather). For each (model, region)
# it scores the mean log-likelihood on uppercase (phyloP-functional) vs
# lowercase (non-functional) target tokens over a mixed-case validation-interval
# dataset, then aggregates to a per-(model, region) gap. These `datasets` are HF
# `seq` datasets (the v5/v1/v15 sets the training runs used for
# val_cds/val_upstream/val_downstream) — NOT the variant `datasets:` above.
# `models` reuse the `models:` registry. FWD strand only (matches the
# training-logged gap). m5.1 leads the list as the validation gate: it logged
# `val_cds_{functional,nonfunctional}/loss` in W&B, so -LL_upper/-LL_lower must
# reproduce those before the ladder gaps are trusted.
ll_gap:
  split: validation
  datasets:
    - name: cds          # v5 — CDS
      hf_repo: bolinas-dna/genomes-v5-validation-intervals-v5_255_255
      hf_revision: daff592f213aaa1cab1711d477a79ff6b1bc4ef4
    - name: upstream     # v1 — promoter / upstream
      hf_repo: bolinas-dna/genomes-v5-validation-intervals-v1_255_255
      hf_revision: a761bc0b663a9827303f3112e4667d53d5326fac
    - name: downstream   # v15 — 3' UTR / downstream
      hf_repo: bolinas-dna/genomes-v5-validation-intervals-v15_255_255
      hf_revision: d7b27eecd68453934ebb3e7e6e78d5401789faa5
  models:
    - mix-v0.9-p1B-i24-exp135-m5.1-step-59158   # validation gate (has the W&B gap)
    - scaling-v0.5-h640-p46M-step-215573
    - scaling-v0.5-h768-p76M-step-215573
    - scaling-v0.5-h896-p128M-step-215573
    - scaling-v0.5-h1152-p255M-step-215573
    - scaling-v0.5-h1408-p476M-step-215573
    - scaling-v0.5-h1920-p1B-step-215573
    - scaling-v0.5-h2432-p2B-step-215573
    - scaling-v0.5-h2944-p4B-step-215573
