# HuggingFace prefix for the matched-pair eval datasets. Each dataset is
# loaded as f"{input_hf_prefix}_{dataset.name}".
input_hf_prefix: bolinas-dna/evals

# Canonical bgzipped + indexed GRCh38 (Ensembl release 115; sequence is
# byte-identical to 113/114 — only annotations differ). Read directly from
# S3 by pyfaidx via fsspec/s3fs — no full download.
genome_path: s3://oa-bolinas/data/genomes/homo_sapiens/GRCh38/ensembl-release-115/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz

# Train-only convention — the test split is held out for the final-eval pass.
# All development / iteration uses train.
split: train

datasets:
  # Per-dataset `hf_revision` pins the HF dataset commit consumed by
  # this run. Bumping the SHA triggers re-execution via snakemake's
  # `params:` hash. Mirrors `hf_commit` in
  # dashboard/src/data/datasets.json.py — keep the two in sync.
  - name: mendelian_traits
    hf_revision: 4aed58e50c5dea0b878a665007af2ef9e5108e9f  # PR #194 k=9 rebuild
    score_protocol: minus_llr   # pathogenic positives should score higher than gnomAD-common negatives
  - name: complex_traits
    hf_revision: 22f86a89c65cb8f3007ac3cc2739f40efefa4340  # PR #194 k=9 rebuild
    score_protocol: abs_llr     # fine-mapped positives — magnitude regardless of direction

  # DART-Eval Task-5 chromatin-accessibility QTL benchmarks (PR #214). No
  # matching / no subsampling, so `eval_protocol: qtl_global` selects the
  # global path: AUPRC over all variants + Pearson/Spearman of the score vs
  # `effect_size` over positives only (no subset/match_group, no macro-avg).
  # `score_protocol: abs_llr` still drives the LLR→score transform, yielding
  # the `abs_llr_{fwd,rc,avg}` + `jsd_{fwd,rc,avg}` score columns (abs-LLR + JSD).
  - name: caqtl
    hf_revision: 9d004a21812c067b9ba1ebfe72f51b9095a5d0f8
    score_protocol: abs_llr
    eval_protocol: qtl_global
  - name: dsqtl
    hf_revision: b7e02a07beb831c7047286aacd3ddfd299d6f88f
    score_protocol: abs_llr
    eval_protocol: qtl_global

# Model checkpoints. Each entry must have exactly one of:
#   - `gcs_path`: full GCS URI to the checkpoint directory (includes /hf/step-{N});
#                  pulled with `gcloud storage cp -r`.
#   - `hf_repo`:  HuggingFace Hub repo ID; pulled with `huggingface_hub.snapshot_download`.
# The result lands in results/checkpoints/{name}/.
#
# `window_size` is the number of DNA bases extracted per variant context.
# 256 = old convention (no BOS, e.g. exp55/58/59).
# 255 = new convention (BOS prepended, e.g. exp136 / exp166-v0.1).
# 512 = older 512-context runs trained without BOS (e.g. exp21 promoter-yolo);
#       pair with a per-model `batch_size` override to fit on an A10G.
#
# Optional per-model fields:
#   - `datasets: [name, …]`  Restrict evaluation to a subset of the configured
#                            `datasets`. Omit to run on all of them.
#   - `batch_size: N`        Override `inference.batch_size` for this checkpoint.
#                            Useful when the global default is tuned for a
#                            different context size.
