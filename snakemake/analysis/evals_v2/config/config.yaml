  # migration, not `snakemake all`, and complex_traits hasn't been
  # re-emitted for them under the new dataset revisions. Widen `datasets:`
  # to add complex coverage when re-running for those leaderboards.
  - name: exp55-mammals-step-16999
    gcs_path: gs://marin-dna-us-central1/checkpoints/exp55-mammals-r01-52f413/hf/step-16999
    window_size: 256
