name: linclust-conservation-panel20-linclust

resources:
  infra: aws/us-east-2
  instance_type: r7i.16xlarge
  use_spot: false
  disk_size: 1500
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""

setup: |
  set -euxo pipefail
  test "$PIPELINE_COMMIT_SHA" = "$(printf '%s' "$PIPELINE_COMMIT_SHA" | grep -E '^[0-9a-f]{40}$')"
  CHECKOUT="$HOME/marin-dna-checkout-$PIPELINE_COMMIT_SHA"
  if [ ! -d "$CHECKOUT/.git" ]; then
    git clone --filter=blob:none --no-checkout https://github.com/Open-Athena/marin-dna.git "$CHECKOUT"
    git -C "$CHECKOUT" fetch --depth 1 origin "$PIPELINE_COMMIT_SHA"
    git -C "$CHECKOUT" checkout --detach FETCH_HEAD
  fi
  test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$PIPELINE_COMMIT_SHA"
  git -C "$CHECKOUT" diff --exit-code
  test -z "$(git -C "$CHECKOUT" status --porcelain --untracked-files=all)"
  if [ ! -d "$HOME/miniforge3" ]; then
    MINIFORGE_VERSION=26.3.2-3
    MINIFORGE_SHA256=848194851a98903134187fbb4ab50efe87b003e0c0f808f97644b7524a62bf2c
    curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
      -o /tmp/miniforge.sh \
      "https://github.com/conda-forge/miniforge/releases/download/$MINIFORGE_VERSION/Miniforge3-$MINIFORGE_VERSION-Linux-x86_64.sh"
    printf '%s  %s\n' "$MINIFORGE_SHA256" /tmp/miniforge.sh | sha256sum --check --strict
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null | awk '{print $2}' || true)" != "0.12.5" ]; then
    curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
  fi
  test "$(uv --version | awk '{print $2}')" = "0.12.5"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict
  timeout --signal=TERM --kill-after=1m 20m \
    uv sync --project "$CHECKOUT/snakemake/analysis/linclust_conservation" --locked --group dev

run: |
  set -euxo pipefail
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"
  CHECKOUT="$HOME/marin-dna-checkout-$PIPELINE_COMMIT_SHA"
  test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$PIPELINE_COMMIT_SHA"
  cd "$CHECKOUT/snakemake/analysis/linclust_conservation"
  run_panel20() {
    set -euxo pipefail
    uv run --locked pytest
    uv run --locked snakemake -n panel_linclust \
      --profile workflow/profiles/default \
      --default-storage-provider none \
      --configfile config/panel20_linclust.yaml \
      --cores 64 \
      --resources mem_mb=450000 staging_jobs=8 sampling_jobs=8
    uv run --locked snakemake panel_linclust \
      --profile workflow/profiles/default \
      --default-storage-prefix s3://oa-bolinas/snakemake/analysis/linclust_conservation/runs/panel20-linclust/ \
      --configfile config/panel20_linclust.yaml \
      --cores 64 \
      --resources mem_mb=450000 staging_jobs=8 sampling_jobs=8 \
      --rerun-incomplete
  }
  export -f run_panel20
  timeout --signal=TERM --kill-after=5m 4h bash -c run_panel20
