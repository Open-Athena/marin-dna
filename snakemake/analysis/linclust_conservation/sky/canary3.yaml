name: linclust-conservation-canary3

resources:
  infra: aws/us-east-2
  instance_type: m6i.large
  disk_size: 80
  labels:
    project: dna

workdir: .

envs:
  PIPELINE_COMMIT_SHA: ""

setup: |
  set -euxo pipefail
  test "$PIPELINE_COMMIT_SHA" = "$(printf '%s' "$PIPELINE_COMMIT_SHA" | grep -E '^[0-9a-f]{40}$')"
  if [ -f .git ]; then rm .git; fi
  git init
  git remote remove origin || true
  git remote add origin https://github.com/Open-Athena/marin-dna.git
  git fetch --depth 1 origin "$PIPELINE_COMMIT_SHA"
  git reset --mixed FETCH_HEAD
  test "$(git rev-parse HEAD)" = "$PIPELINE_COMMIT_SHA"
  git diff --exit-code
  test -z "$(git status --porcelain --untracked-files=all)"
  if [ ! -d "$HOME/miniforge3" ]; then
    curl -fsSL -o /tmp/miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
    rm /tmp/miniforge.sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null || true)" != "uv 0.12.5" ]; then
    curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
  fi
  test "$(uv --version)" = "uv 0.12.5"
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  conda config --set channel_priority strict
  uv sync --project snakemake/analysis/linclust_conservation --locked --group dev

run: |
  set -euxo pipefail
  export PATH="$HOME/miniforge3/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/miniforge3/bin/conda"
  test -n "$PIPELINE_COMMIT_SHA"
  test "$(git rev-parse HEAD)" = "$PIPELINE_COMMIT_SHA"
  cd snakemake/analysis/linclust_conservation
  uv run --locked pytest
  uv run --locked snakemake -n smoke \
    --profile workflow/profiles/default \
    --default-storage-provider none \
    --config selection_path=config/assembly_canary3.tsv
  uv run --locked snakemake smoke \
    --profile workflow/profiles/default \
    --default-storage-prefix s3://oa-bolinas/snakemake/analysis/linclust_conservation/runs/canary3/ \
    --config selection_path=config/assembly_canary3.tsv \
    --cores 2 \
    --resources mem_mb=7000 staging_jobs=1 sampling_jobs=1 \
    --rerun-incomplete
