      prefilter_mode: 0
      sensitivity: 7.5
      cluster_mode: 0
      min_sequence_identity: 0.5
      coverage: 0.8
      max_sequences: 384
      spaced_kmer_mode: 1
      mask_lower_case: 1
      low_complexity_masking: 1
