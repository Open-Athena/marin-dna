      etag: e5fab8d96ea494d36efae82884387b32-10
      size_bytes: 78728906
      genome_uri: s3://oa-bolinas/staging/vertebrate_projection_dataset/v1/06549d8f7f3ba76151b9c54a5e52d3e3f4402a2d/full/hal/genomes/Dasypus_novemcinctus.2bit
