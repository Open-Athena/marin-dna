    baseline:
      coverage: 0.8
      min_sequence_identity: 0.5
      kmers_per_sequence: 20
      kmer_per_sequence_scale: 0.2
      spaced_kmer_mode: 0
    best_255_recipe:
      coverage: 0.7
      min_sequence_identity: 0.4
      kmers_per_sequence: 20
      kmer_per_sequence_scale: 0.5
      spaced_kmer_mode: 1
    dense_spaced:
      coverage: 0.7
      min_sequence_identity: 0.4
      kmers_per_sequence: 20
      kmer_per_sequence_scale: 1.0
      spaced_kmer_mode: 1

exhaustive_graph:
