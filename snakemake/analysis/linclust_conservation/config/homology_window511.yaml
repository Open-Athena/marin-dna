pipeline_version: v1
selection_path: config/assembly_canary3.tsv

window:
  length: 511
  stride: 128
  max_repeat_fraction: 0.5

manifest:
  taxon: mammalia
  datasets_version: 18.36.0
  query_reference_only: true
  source_bucket: oa-bolinas
  source_prefix: snakemake/training_dataset/dataset_creation/results/genome

staging:
  destination_bucket: oa-bolinas
  destination_prefix: snakemake/analysis/linclust_conservation/inputs/genomes

smoke:
  seed: 521
  candidates_per_assembly: 2000
  batch_size: 250000
  max_alignment_edges: 100000

phylop:
  url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/phyloP447way/hg38.phyloP447way.bw
  threshold: 2.2162

mmseqs:
  candidate_release: 18.8cc5c
  order_seeds: [0, 1, 2]
  min_sequence_identity: 0.5
  coverage: 0.8
  coverage_mode: 0
  evalue: 0.001
  kmers_per_sequence: 20
  spaced_kmer_mode: 0
  mask_lower_case: 1
  low_complexity_masking: 1
  cluster_mode: 0
  alignment_kmer_length: 11
  alignment_split_memory_limit: 4G

homology_fixture:
  max_anchors: 128
  candidate_anchors: 1024
  sequence_mode: center-expanded
  selection_window_length: 255
  sources:
    - label: human
      species: Homo sapiens
      assembly: hg38
      uri: s3://oa-bolinas/staging/vertebrate_projection_dataset/v1/06549d8f7f3ba76151b9c54a5e52d3e3f4402a2d/full/sequences/human_reference.parquet
      etag: ed35649b61c39215f25b183f941b94f7-10
      size_bytes: 81423428
      genome_uri: s3://oa-bolinas/staging/vertebrate_projection_dataset/v1/06549d8f7f3ba76151b9c54a5e52d3e3f4402a2d/full/reference/hg38.2bit
      genome_etag: 9436b7f9bf626c7b69a10208f6fbb0d2-100
      genome_size_bytes: 835393456
    - label: mouse
      species: Mus musculus
      assembly: GCF_000001635.26
      uri: s3://oa-bolinas/staging/vertebrate_projection_dataset/v1/06549d8f7f3ba76151b9c54a5e52d3e3f4402a2d/full/sequences/hal/Mus_musculus.parquet
      etag: 736d7b520b21362c5a1fc4cdf00f06eb-10
      size_bytes: 79942737
      genome_uri: s3://oa-bolinas/staging/vertebrate_projection_dataset/v1/06549d8f7f3ba76151b9c54a5e52d3e3f4402a2d/full/hal/genomes/Mus_musculus.2bit
