<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 0 1380 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .ink   { fill: #1f1e1b; }
      .muted { fill: #7a7a7a; }
      .label-bold { font-family: 'Lato', sans-serif; font-size: 24px; font-weight: 700; }
      .micro { font-family: 'Lato', sans-serif; font-size: 19px; }
      .span-label { font-family: 'Lato', sans-serif; font-size: 26px; font-weight: 700; }
      .branch { stroke: #1f1e1b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ─── Phylogenetic tree (GPN-Star Fig 1B layout) ───
       Pectinate tree: each split is a "V" of two diagonal branches that
       meet at the internal node. ~700 Mya at the top, leaves at the
       bottom. Internal-node x positions are the midpoint of their two
       children's x's, so each split forms a balanced V wedge. -->

  <!-- Internal-node positions
       (x, y): horizontal centre between children, climbing up by 120 each level. -->
  <!-- ~65 Mya:  midpoint(humans 80, primates 200)         = (140, 460) -->
  <!-- ~100 Mya: midpoint(~65 Mya 140, mammals 400)        = (270, 340) -->
  <!-- ~600 Mya: midpoint(~100 Mya 270, vertebrates 650)   = (460, 220) -->
  <!-- ~700 Mya: midpoint(~600 Mya 460, animals 900)       = (680, 100) -->

  <!-- Mya labels to the left of each split -->
  <text x="120" y="466" class="label-bold ink" text-anchor="end">~65 Mya</text>
  <text x="250" y="346" class="label-bold ink" text-anchor="end">~100 Mya</text>
  <text x="440" y="226" class="label-bold ink" text-anchor="end">~600 Mya</text>
  <text x="660" y="106" class="label-bold ink" text-anchor="end">~700 Mya</text>

  <!-- Diagonal branches (each split is a V joining its two children).
       Two branches per split, going DOWN to children. -->
  <g class="branch">
    <!-- ~65 Mya V: down to humans (left) and primates (right) -->
    <line x1="140" y1="460" x2="80"  y2="550"/>
    <line x1="140" y1="460" x2="200" y2="550"/>

    <!-- ~100 Mya V: down to ~65 Mya subtree (left) and mammals (right) -->
    <line x1="270" y1="340" x2="140" y2="460"/>
    <line x1="270" y1="340" x2="400" y2="550"/>

    <!-- ~600 Mya V: down to ~100 Mya subtree (left) and vertebrates (right) -->
    <line x1="460" y1="220" x2="270" y2="340"/>
    <line x1="460" y1="220" x2="650" y2="550"/>

    <!-- ~700 Mya V: down to ~600 Mya subtree (left) and animals (right) -->
    <line x1="680" y1="100" x2="460" y2="220"/>
    <line x1="680" y1="100" x2="900" y2="550"/>
  </g>

  <!-- Internal-node dots (small circles where branches meet) -->
  <g fill="#1f1e1b">
    <circle cx="140" cy="460" r="5"/>
    <circle cx="270" cy="340" r="5"/>
    <circle cx="460" cy="220" r="5"/>
    <circle cx="680" cy="100" r="5"/>
  </g>

  <!-- ─── Leaf triangles ───
       Apex sits at each branch endpoint (x_leaf, 550); base 30px below.
       Neutral grey — clade names live only on the cumulative-span bars. -->
  <g fill="#A89B8D" stroke="#1f1e1b" stroke-width="1.5">
    <polygon points="80,550 60,590 100,590"/>
    <polygon points="200,550 180,590 220,590"/>
    <polygon points="400,550 376,590 424,590"/>
    <polygon points="650,550 620,590 680,590"/>
    <polygon points="900,550 864,590 936,590"/>
  </g>

  <!-- Divider between tree and span key -->
  <line x1="40" y1="640" x2="1080" y2="640" stroke="#B5A898" stroke-width="1"/>

  <!-- ─── Cumulative training-subset spans, INVERSE-stacked ───
       Longest/darkest on top (animals), shortest/lightest at the bottom
       (humans). Span widths preserve the cumulative inclusion: animals
       includes vertebrates includes mammals includes primates includes
       humans. Same colours as the corresponding lines in T1 / T2. -->
  <g stroke="#1f1e1b" stroke-width="0.75">
    <rect x="60"  y="680" width="900" height="40" fill="#3D2417"/>  <!-- animals -->
    <rect x="60"  y="730" width="640" height="40" fill="#6E4421"/>  <!-- vertebrates -->
    <rect x="60"  y="780" width="370" height="40" fill="#9e6d43"/>  <!-- mammals -->
    <rect x="60"  y="830" width="160" height="40" fill="#B58853"/>  <!-- primates -->
    <rect x="60"  y="880" width="40"  height="40" fill="#D9C4A0"/>  <!-- humans -->
  </g>

  <!-- Bar labels: clade name + cumulative species count, anchored just
       past each bar's right end. -->
  <g>
    <text x="970" y="708" class="span-label ink">animals
      <tspan class="micro muted" font-weight="400"> (~499 sp.)</tspan>
    </text>
    <text x="710" y="758" class="span-label ink">vertebrates
      <tspan class="micro muted" font-weight="400"> (~317 sp.)</tspan>
    </text>
    <text x="440" y="808" class="span-label ink">mammals
      <tspan class="micro muted" font-weight="400"> (~81 sp.)</tspan>
    </text>
    <text x="230" y="858" class="span-label ink">primates
      <tspan class="micro muted" font-weight="400"> (~11 sp.)</tspan>
    </text>
    <text x="110" y="908" class="span-label ink">humans
      <tspan class="micro muted" font-weight="400"> (1 sp.)</tspan>
    </text>
  </g>

  <!-- Caption on the left of the bar block -->
  <text class="label-bold ink" text-anchor="start">
    <tspan x="-90" y="788">train on</tspan>
    <tspan x="-90" y="816" class="micro muted">a cumulative</tspan>
    <tspan x="-90" y="838" class="micro muted">species subset</tspan>
  </text>
</svg>
