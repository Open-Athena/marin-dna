<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 0 1100 580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .ink   { fill: #1f1e1b; }
      .muted { fill: #7a7a7a; }
      .label-bold { font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700; }
      .clade { font-family: 'Lato', sans-serif; font-size: 20px; }
      .micro { font-family: 'Lato', sans-serif; font-size: 17px; }
      .span-label { font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700; }
      .branch { stroke: #1f1e1b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- ─── Phylogenetic tree (GPN-Star Fig 1B layout) ─── -->

  <!-- Mya labels to the left of each split -->
  <text x="58"  y="246" class="label-bold ink" text-anchor="end">~65 Mya</text>
  <text x="178" y="186" class="label-bold ink" text-anchor="end">~100 Mya</text>
  <text x="368" y="126" class="label-bold ink" text-anchor="end">~600 Mya</text>
  <text x="588" y="66"  class="label-bold ink" text-anchor="end">~700 Mya</text>

  <!-- Internal-node dots -->
  <g fill="#1f1e1b">
    <circle cx="140" cy="240" r="4"/>
    <circle cx="260" cy="180" r="4"/>
    <circle cx="450" cy="120" r="4"/>
    <circle cx="670" cy="60"  r="4"/>
  </g>

  <!-- Branches: L-shaped paths -->
  <g class="branch">
    <path d="M 80  300 L 80  240 L 140 240"/>
    <path d="M 200 300 L 200 240 L 140 240"/>
    <path d="M 140 240 L 140 180 L 260 180"/>
    <path d="M 400 300 L 400 180 L 260 180"/>
    <path d="M 260 180 L 260 120 L 450 120"/>
    <path d="M 650 300 L 650 120 L 450 120"/>
    <path d="M 450 120 L 450 60  L 670 60"/>
    <path d="M 900 300 L 900 60  L 670 60"/>
  </g>

  <!-- ─── Leaf triangles: NON-OVERLAPPING sub-clades ───
       Each triangle is one disjoint slice of the tree (just humans,
       just non-human primates, just non-primate mammals, etc.). All
       neutral grey so the colour-coding lives in the cumulative spans
       below, not in the subtrees — matches GPN-Star Fig 1B convention. -->
  <g fill="#A89B8D" stroke="#1f1e1b" stroke-width="1.5">
    <polygon points="74,300 80,288 86,300"/>
    <polygon points="186,300 200,278 214,300"/>
    <polygon points="370,300 400,266 430,300"/>
    <polygon points="600,300 650,256 700,300"/>
    <polygon points="840,300 900,246 960,300"/>
  </g>

  <!-- Clade labels below triangles -->
  <g text-anchor="middle">
    <text x="80"  y="328" class="clade ink">humans</text>
    <text x="80"  y="350" class="micro muted">(1 sp.)</text>
    <text x="200" y="328" class="clade ink">primates</text>
    <text x="200" y="350" class="micro muted">(~11 sp.)</text>
    <text x="400" y="328" class="clade ink">mammals</text>
    <text x="400" y="350" class="micro muted">(~81 sp.)</text>
    <text x="650" y="328" class="clade ink">vertebrates</text>
    <text x="650" y="350" class="micro muted">(~317 sp.)</text>
    <text x="900" y="328" class="clade ink">animals</text>
    <text x="900" y="350" class="micro muted">(~499 sp.)</text>
  </g>

  <!-- Divider line between tree and span key -->
  <line x1="40" y1="385" x2="990" y2="385" stroke="#B5A898" stroke-width="1"/>

  <!-- ─── Cumulative training-subset spans ───
       Each bar shows which sub-clades are included when training on
       that subset. Mammals = humans + primates + mammals. Colour
       darkens with breadth — same gradient used by the T1 / T2 lines,
       so the spans key the plot colours directly. -->
  <g stroke="#1f1e1b" stroke-width="0.75">
    <!-- bar y-positions: humans 410 → animals 530 (each 22 tall, 8 gap) -->
    <rect x="60"  y="410" width="36"  height="22" fill="#D9C4A0"/>
    <rect x="60"  y="440" width="160" height="22" fill="#B58853"/>
    <rect x="60"  y="470" width="356" height="22" fill="#9e6d43"/>
    <rect x="60"  y="500" width="606" height="22" fill="#6E4421"/>
    <rect x="60"  y="530" width="856" height="22" fill="#3D2417"/>
  </g>

  <!-- Subset labels next to (or on) each span -->
  <g>
    <text x="104" y="427" class="span-label ink">humans</text>
    <text x="228" y="457" class="span-label ink">primates</text>
    <text x="424" y="487" class="span-label ink">mammals</text>
    <text x="674" y="517" class="span-label" fill="#f5efe6">vertebrates</text>
    <text x="924" y="547" class="span-label" fill="#f5efe6">animals</text>
  </g>

  <!-- Section caption -->
  <text x="-90" y="473" class="label-bold ink" text-anchor="start">
    <tspan x="-90" dy="0">train on</tspan>
    <tspan x="-90" dy="22" class="micro muted">a cumulative</tspan>
    <tspan x="-90" dy="20" class="micro muted">species subset</tspan>
  </text>
</svg>
