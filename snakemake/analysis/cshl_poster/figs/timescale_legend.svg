<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 0 1300 580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .ink   { fill: #1f1e1b; }
      .muted { fill: #7a7a7a; }
      .label-bold { font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700; }
      .micro { font-family: 'Lato', sans-serif; font-size: 17px; }
      .span-label { font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700; }
      .branch { stroke: #1f1e1b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- ─── Phylogenetic tree (GPN-Star Fig 1B layout) ─── -->

  <!-- Mya labels to the left of each split -->
  <text x="58"  y="246" class="label-bold ink" text-anchor="end">~65 Mya</text>
  <text x="178" y="186" class="label-bold ink" text-anchor="end">~100 Mya</text>
  <text x="368" y="126" class="label-bold ink" text-anchor="end">~600 Mya</text>
  <text x="588" y="66"  class="label-bold ink" text-anchor="end">~700 Mya</text>

  <!-- Internal-node dots -->
  <g fill="#1f1e1b">
    <circle cx="140" cy="240" r="4"/>
    <circle cx="260" cy="180" r="4"/>
    <circle cx="450" cy="120" r="4"/>
    <circle cx="670" cy="60"  r="4"/>
  </g>

  <!-- Branches: L-shaped paths -->
  <g class="branch">
    <path d="M 80  300 L 80  240 L 140 240"/>
    <path d="M 200 300 L 200 240 L 140 240"/>
    <path d="M 140 240 L 140 180 L 260 180"/>
    <path d="M 400 300 L 400 180 L 260 180"/>
    <path d="M 260 180 L 260 120 L 450 120"/>
    <path d="M 650 300 L 650 120 L 450 120"/>
    <path d="M 450 120 L 450 60  L 670 60"/>
    <path d="M 900 300 L 900 60  L 670 60"/>
  </g>

  <!-- ─── Leaf triangles: non-overlapping sub-clades, neutral colour
       (colour-coding lives in the cumulative spans below, not the
       subtrees, per GPN-Star Fig 1B). -->
  <g fill="#A89B8D" stroke="#1f1e1b" stroke-width="1.5">
    <polygon points="74,300 80,288 86,300"/>
    <polygon points="186,300 200,278 214,300"/>
    <polygon points="370,300 400,266 430,300"/>
    <polygon points="600,300 650,256 700,300"/>
    <polygon points="840,300 900,246 960,300"/>
  </g>

  <!-- No text under the triangles. The clade name AND the cumulative
       species count both live on each bar's label below (single source
       of truth — the bars are what's cumulative). -->

  <!-- Divider between tree and span key -->
  <line x1="40" y1="355" x2="1000" y2="355" stroke="#B5A898" stroke-width="1"/>

  <!-- ─── Cumulative training-subset spans, INVERSE-stacked ───
       Longest (animals) on top, shortest (humans) at the bottom — per
       GPN-Star Fig 1B. Each clade name appears exactly once, anchored
       to the right end of its bar, in dark text on the page background. -->
  <g stroke="#1f1e1b" stroke-width="0.75">
    <!-- animals (longest, darkest)  — humans through animals -->
    <rect x="60"  y="380" width="900" height="22" fill="#3D2417"/>
    <!-- vertebrates -->
    <rect x="60"  y="410" width="640" height="22" fill="#6E4421"/>
    <!-- mammals -->
    <rect x="60"  y="440" width="370" height="22" fill="#9e6d43"/>
    <!-- primates -->
    <rect x="60"  y="470" width="160" height="22" fill="#B58853"/>
    <!-- humans (shortest, lightest) -->
    <rect x="60"  y="500" width="40"  height="22" fill="#D9C4A0"/>
  </g>

  <!-- Span labels: clade name + cumulative species count, dark text,
       anchored after each bar's right end. -->
  <g>
    <text x="970" y="398" class="span-label ink">animals
      <tspan class="micro muted" font-weight="400"> (~499 sp.)</tspan>
    </text>
    <text x="710" y="428" class="span-label ink">vertebrates
      <tspan class="micro muted" font-weight="400"> (~317 sp.)</tspan>
    </text>
    <text x="440" y="458" class="span-label ink">mammals
      <tspan class="micro muted" font-weight="400"> (~81 sp.)</tspan>
    </text>
    <text x="230" y="488" class="span-label ink">primates
      <tspan class="micro muted" font-weight="400"> (~11 sp.)</tspan>
    </text>
    <text x="110" y="518" class="span-label ink">humans
      <tspan class="micro muted" font-weight="400"> (1 sp.)</tspan>
    </text>
  </g>

  <!-- Caption on the left -->
  <text x="-90" y="443" class="label-bold ink" text-anchor="start">
    <tspan x="-90" dy="0">train on</tspan>
    <tspan x="-90" dy="22" class="micro muted">a cumulative</tspan>
    <tspan x="-90" dy="20" class="micro muted">species subset</tspan>
  </text>
</svg>
