# Genome reference (GRCh38)
# `genome_url` is for the legacy `download_genome` rule used by the
# eqtl/complex_traits annotation rules (untouched as of #179).
genome_url: http://ftp.ensembl.org/pub/release-113/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
# `canonical_genome_path` is the bgzipped + indexed reference used by the
# materialize rule. pyfaidx reads it directly from S3 (no full download).
# Sequence is byte-identical to releases 113/114 — only annotations differ.
canonical_genome_path: s3://oa-bolinas/data/genomes/homo_sapiens/GRCh38/ensembl-release-115/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz

# HuggingFace repository prefix for dataset uploads.
# Final repo name is f"{output_hf_prefix}_{dataset}" (joined with underscore).
output_hf_prefix: bolinas-dna/evals

# Datasets to build and upload.
# `mendelian_traits_harness_255` is the only harness-materialized dataset built
# here; it produces 2 rows per variant (one per strand) for the online
# lm_eval VEP scorer (`marin_dna.pipelines.evals.lm_eval.dna_vep_llr_eval`)
# which averages FWD+RC scores per variant. complex_traits_harness was
# dropped in #179: complex traits are scored offline only via
# `snakemake/analysis/evals_v2/`, which already does FWD+RC averaging.
datasets:
  - mendelian_traits
  - complex_traits
  - mendelian_traits_harness_255
  - caqtl
  - dsqtl
  - sge

# ----- Shared trait-pipeline parameters -----
annotation_url: http://ftp.ensembl.org/pub/release-107/gtf/homo_sapiens/Homo_sapiens.GRCh38.107.chr.gtf.gz
consequences_repo: songlab/hg38-variant-consequences
gnomad_full_repo: songlab/gnomad-full
gnomad_min_AN: 25000
gnomad_common_min_AF: 0.001
tss_proximal_dist: 1000
exon_proximal_dist: 30
exclude_consequences:
  - transcript_ablation
  - splice_acceptor_variant
  - splice_donor_variant
  - stop_gained
  - frameshift_variant
  - stop_lost
  - start_lost
  - transcript_amplification
  - feature_elongation
  - feature_truncation
consequence_groups:
  splicing:
    - splice_donor_5th_base_variant
    - splice_region_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - exon_proximal
  distal:
    - intergenic_variant
    - intron_variant
    - upstream_gene_variant
    - downstream_gene_variant
    - PLS
    - PLS_flank
    - pELS
    - pELS_flank
    - dELS
    - dELS_flank
    - CA-H3K4me3
    - CA-H3K4me3_flank
    - CA-CTCF
    - CA-CTCF_flank
    - CA-TF
    - CA-TF_flank
    - CA
    - CA_flank
    - TF
    - TF_flank

# Display name + ordering for the values that end up in `consequence_group`
# (which are either a key from `consequence_groups` above, or one of the
# single-consequence categories left unmapped by `build_dataset`).
consequence_group_order:
  missense_variant: Missense
  distal: Distal
  splicing: Splicing
  tss_proximal: Promoter
  5_prime_UTR_variant: 5' UTR
  non_coding_transcript_exon_variant: ncRNA
  3_prime_UTR_variant: 3' UTR
  synonymous_variant: Synonymous

# ----- Mendelian-traits-specific -----
mendelian_traits:
  AF_threshold: 0.001
  hgmd_url: https://sei-files.s3.amazonaws.com/pathogenic_mutations.tar.gz
  smedley_url: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716302786-mmc2.xlsx
  clinvar_release: "20251019"
  submission_summary_date: "2025-10"
  # Cap positives in oversized consequence_group subsets before matching.
  # Missense pre-cap is ~12.7k of 14.3k total positives; capping makes VEP
  # inference ~5x faster without losing subset-AUPRC statistical signal.
  max_positives_per_subset:
    missense_variant: 1000

# ----- Complex-traits-specific -----
complex_traits:
  finemapping_repo: gonzalobenegas/finucane-ukbb-finemapping
  ldscore_s3: s3://pan-ukb-us-east-1/ld_release/UKBB.EUR.ldscore.ht
  pip_pos_threshold: 0.9
  pip_neg_threshold: 0.01

# ----- caQTL / dsQTL accessibility-QTL datasets (supervised official-metrics, #310) -----
# Standardized ChromBPNet benchmark files (Synapse syn64126763 children; #262), the
# canonical variant sets used by both the ChromBPNet and AlphaGenome papers. Each
# FileEntity is a zip wrapping one .tsv (downloaded over HTTP with a Synapse PAT;
# export SYNAPSE_AUTH_TOKEN). caqtl = African caQTLs (hg38); dsqtl = Yoruba dsQTLs
# (hg19 -> lifted). IDs mirror STANDARDIZED_QTL in the chrombpnet_qtl library module.
chrombpnet_qtl:
  caqtl_synapse_id: syn64126781
  dsqtl_synapse_id: syn64126779

# ----- DART-Eval Task 3 cell-type peaks (#293) -----
# Synapse FileEntity ID (Synapse PAT; export SYNAPSE_AUTH_TOKEN). DART-Eval's
# top-5,000-per-cell-type `input_data/top_5000_deseq_peaks.tsv` (25,000 x 500 bp
# peaks, 5,000 balanced per cell line) — the subset they feed their zero-shot
# clustering / UMAP. Synapse project syn60581042.
dart_eval:
  task3_synapse_id: syn62161401

# ----- SGE (saturation genome editing) variant-effect dataset (issue #289) -----
# Per-SNV experimental function scores from endogenous SGE assays; no matching /
# no subsampling, HIGH-impact `exclude_consequences` dropped, every author column
# preserved (author_ prefix). Phase 1: BRCA1 only.
sge:
  # Build-time consequence_group allowlist (#297 item E): keep only the groups where the
  # SGE assay actually measures function. The rest (synonymous, UTRs, ncRNA, distal,
  # tss_proximal, …) are near-uninformative for an SGE benchmark and are dropped for
  # inference speed + focus. Re-add a group here to score it again; remove the key (or
  # set it null) to keep every group.
  consequence_group_allowlist:
    - missense_variant
    - splicing
  brca1:
    # Findlay et al. 2018 (Nature 562:217-222) supplementary table — the same file
    # Evo2 bundles. Served from the Nature static-content host. hg19 genomic coords
    # for ALL SNVs incl. intronic (MaveDB's cDNA->genome map drops intronic), so
    # this is the cleanest BRCA1 source.
    url: "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-018-0461-z/MediaObjects/41586_2018_461_MOESM3_ESM.xlsx"
    chrom: "17"
    lift: true  # hg19 -> GRCh38
    # Canonical accession for the dataset (the same Findlay 2018 BRCA1 SGE scores
    # deposited in MaveDB, PMID 30209399). Stamped per-variant as `mavedb_urn` so
    # (gene, mavedb_urn) identifies the exact study — needed once a gene has >1
    # study (e.g. BRCA2: Huang + Sahu).
    mavedb_urn: "urn:mavedb:00000097-0-2"
  # Phase 2a: genome-targeted MaveDB score-sets — hgvs_nt is `NC_…:g.` (genomic),
  # so coordinates parse directly and intronic SNVs are kept with no transcript
  # mapping. All GRCh38-native (no liftover). `chrom` picks the per-chrom
  # consequence parquet. (The transcript-targeted genes — BRCA2, RAD51C, BAP1,
  # DDX3X, VHL, CARD11 — need c.->g. intronic recovery and are a separate phase.)
  mavedb_genomic:
    - {gene: BARD1, mavedb_urn: "urn:mavedb:00001250-a-1", chrom: "2"}
    - {gene: PALB2, mavedb_urn: "urn:mavedb:00001259-a-1", chrom: "16"}
    - {gene: RAD51D, mavedb_urn: "urn:mavedb:00001260-a-1", chrom: "17"}
    - {gene: XRCC2, mavedb_urn: "urn:mavedb:00001264-a-1", chrom: "7"}
    - {gene: CTCF, mavedb_urn: "urn:mavedb:00001262-a-1", chrom: "16"}
    - {gene: SFPQ, mavedb_urn: "urn:mavedb:00001265-a-1", chrom: "1"}
  # Phase 2b: transcript-targeted MaveDB score-sets — hgvs_nt is `ENST…:c.`
  # (transcript cDNA), whose intronic variants MaveDB's own map drops. The
  # `sge_recode_mavedb` rule recovers genomic coords with pyhgvs + cdot (needs the
  # `hgvs` dependency group). GRCh38 (no liftover).
  mavedb_transcript:
    - {gene: BRCA2, mavedb_urn: "urn:mavedb:00001225-a-1", chrom: "13"}
    - {gene: RAD51C, mavedb_urn: "urn:mavedb:00000673-0-1", chrom: "17"}
    - {gene: BAP1, mavedb_urn: "urn:mavedb:00000662-0-1", chrom: "3"}
    - {gene: DDX3X, mavedb_urn: "urn:mavedb:00000658-0-1", chrom: "X"}
    - {gene: VHL, mavedb_urn: "urn:mavedb:00000675-a-1", chrom: "3"}
  # CARD11 (urn:mavedb:00001226) deliberately excluded: it's a *codon*-saturation,
  # diploid, bidirectional (GOF + dominant-negative) assay — 82% multi-base codon
  # delins (only ~644 usable SNVs), coding-only, and on a different score axis than
  # the other LOF-depletion genes. Too divergent for this SNV LOF-style benchmark.
