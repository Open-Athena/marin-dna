name: dna-exp402-rag-audit

resources:
  infra: aws/us-east-2
  instance_type: r6i.4xlarge
  disk_size: 100
  labels:
    project: dna

workdir: ../..

setup: |
  set -euxo pipefail

  if ! command -v uv >/dev/null 2>&1; then
      curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --project snakemake/rag_glm --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  cd snakemake/rag_glm

  uv run --locked snakemake --profile workflow/profiles/default \
      --allowed-rules species_audit \
      --printshellcmds \
      -n results/audit/summary.json

  uv run --locked snakemake --profile workflow/profiles/default \
      --allowed-rules species_audit \
      --printshellcmds \
      --rerun-incomplete \
      results/audit/summary.json

  uv run --locked python -c "
  import boto3
  import sys

  boto3.client('s3').download_fileobj(
      'oa-bolinas',
      'snakemake/rag_glm/results/audit/summary.json',
      sys.stdout.buffer,
  )
  "
