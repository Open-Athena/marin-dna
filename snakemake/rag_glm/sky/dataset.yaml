name: dna-exp402-rag-dataset

resources:
  infra: aws/us-east-2
  instance_type: r6i.4xlarge
  disk_size: 100
  labels:
    project: dna

workdir: ../..

file_mounts:
  ~/.cache/huggingface/token: ~/.cache/huggingface/token

envs:
  COMMIT_SHA: ""
  SNAKEMAKE_TARGET: "results/upload.done/zoonomia-rag-v1-v1"

setup: |
  set -euxo pipefail

  if ! command -v uv >/dev/null 2>&1; then
      curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --project snakemake/rag_glm --locked

run: |
  set -euxo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  cd snakemake/rag_glm

  test -n "$COMMIT_SHA"

  uv run --locked snakemake --profile workflow/profiles/default \
      --config "commit_sha=$COMMIT_SHA" \
      --allowed-rules build_training_dataset upload_training_dataset \
      --printshellcmds \
      -n "$SNAKEMAKE_TARGET"

  uv run --locked snakemake --profile workflow/profiles/default \
      --config "commit_sha=$COMMIT_SHA" \
      --allowed-rules build_training_dataset upload_training_dataset \
      --printshellcmds \
      --rerun-incomplete \
      "$SNAKEMAKE_TARGET"

  uv run --locked python -c "
  import boto3
  import sys

  boto3.client('s3').download_fileobj(
      'oa-bolinas',
      'snakemake/rag_glm/results/dataset/zoonomia-rag-v1-v1/manifest.json',
      sys.stdout.buffer,
  )
  "
