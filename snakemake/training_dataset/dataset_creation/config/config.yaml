genomes_path: config/genomes.parquet

shuffle_seed: 42

validation:
    max_samples: 16384
    genome: GCF_000001405.40
    conservation_bigwig: results/conservation/cactus241way.phyloP.bw
    phylop_threshold: 2.27
    seed: 42

n_shards: 64

add_rc: true

intervals:
    training:
        - v5/255/128 # CDS
        - v1/255/128 # upstream
        - v15/255/128 # downstream
    # Recipes that only apply to a subset of genome_sets (e.g., the v30-v33
    # cCRE recipes only apply to the 20 mammals in `mammals_seg20`).
    # Each entry: {genome_set: [recipe/w/s, ...]}.
    training_per_genome_set:
        mammals_seg20:
            - v30/255/128 # mmseqs2-projected ELS_conserved_20 minus functional exons
            - v31/255/128 # v30 with phyloP-241way per-cCRE filter raised to ≥50 bp
            - v32/255/128 # v30 with phastCons-43p track at ≥0.961, ≥20 bp
            - v33/255/128 # v30 with phastCons-43p track at ≥0.961, ≥50 bp
        # issue #353 CDS projection-vs-annotation experiment. Arm A only for
        # now (v5 = each species' own annotated CDS); Arm B (human-CDS
        # projection) is added as an interval_mappings recipe in a follow-up.
        animals_order204:
            - v5/255/128 # CDS — Arm A (per-species annotation), all-204 scope
        vertebrates_order125:
            - v5/255/128 # CDS — Arm A, vertebrate scope
    validation: # step = window for max diversity
        - v5/255/255
        - v1/255/255
        - v15/255/255
        - v30/255/255

genome_sets:
    - name: animals
      rank_key: kingdom
      rank_value: Metazoa
    - name: vertebrates
      rank_key: phylum
      rank_value: Chordata
    - name: mammals
      rank_key: class
      rank_value: Mammalia
    - name: primates
      rank_key: order
      rank_value: Primates
    - name: humans
      rank_key: species
      rank_value: "Homo sapiens"
    - name: human_mouse
      accessions:
          - GCF_000001405.40 # Human
          - GCF_000001635.27 # Mouse
    # One species per mammalian order (Chromosome-level assemblies only, 20
    # species total) -- the genome set for the cCRE recipes v30-v33.
    - name: mammals_seg20
      accessions:
          - GCF_050624435.1  # Tenrec ecaudatus (Afrosoricida)
          - GCF_009834535.1  # Camelus ferus (Artiodactyla)
          - GCF_018350215.1  # Panthera leo (Carnivora)
          - GCF_027574615.1  # Eptesicus fuscus (Chiroptera)
          - GCF_030445035.2  # Dasypus novemcinctus (Cingulata)
          - GCF_902635505.1  # Sarcophilus harrisii (Dasyuromorphia)
          - GCF_027409185.1  # Cynocephalus volans (Dermoptera)
          - GCF_027887165.1  # Monodelphis domestica (Didelphimorphia)
          - GCF_011100635.1  # Trichosurus vulpecula (Diprotodontia)
          - GCF_027595985.1  # Sorex araneus (Eulipotyphla)
          - GCF_030435755.1  # Ochotona princeps (Lagomorpha)
          - GCF_019393635.1  # Dromiciops gliroides (Microbiotheria)
          - GCF_004115215.2  # Ornithorhynchus anatinus (Monotremata)
          - GCF_037893015.1  # Macrotis lagotis (Peramelemorphia)
          - GCF_037783145.1  # Equus przewalskii (Perissodactyla)
          - GCF_040802235.1  # Manis javanica (Pholidota)
          - GCF_023851605.1  # Tamandua tetradactyla (Pilosa)
          - GCF_000001405.40 # Homo sapiens (Primates)
          - GCF_024166365.1  # Elephas maximus indicus (Proboscidea)
          - GCF_000001635.27 # Mus musculus (Rodentia)
    # One genome per Metazoan order (annotated RefSeq): the order-level dedup of
    # the family universe in config/genomes.parquet, 204 species across 17
    # phyla. Target species for the issue #353 CDS projection-vs-annotation
    # experiment. Regenerate with scripts/issue353_build_animal_order_species.py.
    - name: animals_order204
      accessions_tsv: config/animals_order204.tsv
    # Vertebrate (Chordata) subset of animals_order204 — the 125 species where CDS
    # projection carries real data. The matched vertebrate-scope set for the #353
    # sweep (both arms).
    - name: vertebrates_order125
      accessions_tsv: config/animals_order204_chordata.tsv

# Interval sets defined on one source genome and projected onto others via
# local pairwise alignment. Each entry produces intervals at
# results/intervals/{name}/{g}.parquet for every configured genome — the
# source-genome file is a chrom-normalized copy of `source_parquet`; other
# genomes come from the `mapper` alignment. Downstream (fasta extraction,
# windowing, HF upload) consumes these alongside annotation-derived interval
# sets; the origin is not visible past this rule.
interval_mappings:
    - name: ELS_conserved_20_mmseqs2_s75
      source_parquet: results/cre/ELS_conserved_20.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      # -s 7.5 / --max-accept 1 is the Pareto-optimal low-cost point from
      # issue #120 (hg38↔mm10 cCRE orthologs: ~70% R@1 at ~97% P@1).
      # max-accept 1 enforces the "one best target interval per source
      # interval" contract downstream.
      sensitivity: 7.5
      max_accept: 1
      # Whole-mammal nucleotide search needs ~50-80 GB resident. Defaults
      # here fit the 15 GB dev box (slow — large targets really need the
      # cloud profile); override on skypilot / big-mem runs.
      split_memory_limit: "12G"
      mem_mb: 14000
      flank_bp: 0
    # Source-curation sweep around the v30 baseline above: same projection
    # parameters, only the upstream cCRE conservation filter changes.
    - name: ELS_conserved_50_mmseqs2_s75
      source_parquet: results/cre/ELS_conserved_50.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "12G"
      mem_mb: 14000
      flank_bp: 0
    - name: ELS_phastCons_43p_conserved_20_mmseqs2_s75
      source_parquet: results/cre/ELS_phastCons_43p_conserved_20.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "12G"
      mem_mb: 14000
      flank_bp: 0
    - name: ELS_phastCons_43p_conserved_50_mmseqs2_s75
      source_parquet: results/cre/ELS_phastCons_43p_conserved_50.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "12G"
      mem_mb: 14000
      flank_bp: 0

output_hf_prefix: bolinas-dna/genomes-v5

# Arm B of the issue #353 CDS projection-vs-annotation experiment. A
# self-contained duplicate chain (workflow/rules/cds_projection.smk) that
# projects the human v5 CDS windows onto every animals_order204 species via
# mmseqs2 (v30 flags), isolated under results/cds_projection/ + its own HF repo
# so nothing clashes with the shared training_dataset outputs. Target:
# `all_cds_projection`.
cds_projection:
    hf_prefix: bolinas-dna/animals-cds-proj-v1
    genome_set: animals_order204
    source_genome: GCF_000001405.40 # human — v5 CDS windows are the projection query
    source_recipe: v5
    window_size: 255
    step_size: 128
    target_len: 255
    # mmseqs2 nucleotide search — same operating point as v30 (#120/#123).
    sensitivity: 7.5
    max_accept: 1
    split_memory_limit: "12G" # dev-box default; override on the big-mem cloud run
    mem_mb: 14000
    add_rc: true
    # Dataset cohorts (the #353 sweep): cohort -> genome_set to merge. Both reuse
    # the same per-genome projection parquets; each becomes its own HF repo
    # bolinas-dna/animals-cds-proj-v1-{cohort}.
    cohorts:
        all204: animals_order204
        vert125: vertebrates_order125

