# Overrides for big-memory cloud instances (r6i.8xlarge, 256 GB RAM / 32 vCPU).
# Layered on top of config/config.yaml via
#   snakemake --configfile config/config.yaml --configfile config/config.cloud.yaml
# Pair with `--resources mem_mb=220000` on the CLI.
#
# `interval_mappings` is a list, so Snakemake replaces it wholesale when
# merging; duplicate every active entry here with its cloud memory knobs.

interval_mappings:
    - name: ELS_conserved_20_mmseqs2_s75
      source_parquet: results/cre/ELS_conserved_20.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "220G"
      mem_mb: 220000
      flank_bp: 0
    - name: ELS_conserved_50_mmseqs2_s75
      source_parquet: results/cre/ELS_conserved_50.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "220G"
      mem_mb: 220000
      flank_bp: 0
    - name: ELS_phastCons_43p_conserved_20_mmseqs2_s75
      source_parquet: results/cre/ELS_phastCons_43p_conserved_20.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "220G"
      mem_mb: 220000
      flank_bp: 0
    - name: ELS_phastCons_43p_conserved_50_mmseqs2_s75
      source_parquet: results/cre/ELS_phastCons_43p_conserved_50.parquet
      source_chrom_style: ucsc_stripped
      source_genome: GCF_000001405.40
      mapper: mmseqs2
      sensitivity: 7.5
      max_accept: 1
      split_memory_limit: "220G"
      mem_mb: 220000
      flank_bp: 0

# cds_projection (issue #353 Arm B) is a dict; Snakemake replaces it wholesale
# on merge, so the FULL block is repeated here with the big-memory knobs —
# unsplit mmseqs2 (split-memory-limit 220G) on the 256 GB r6i.8xlarge.
cds_projection:
    hf_prefix: bolinas-dna/animals-cds-proj-v1
    genome_set: animals_order204
    source_genome: GCF_000001405.40
    source_recipe: v5
    window_size: 255
    step_size: 128
    target_len: 255
    sensitivity: 7.5
    max_accept: 1
    split_memory_limit: "220G"
    mem_mb: 220000
    add_rc: true
